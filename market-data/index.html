// nos va a permitir agregar el boton de add task en caso que quiera
// agregarlo a ese nivel y no entrar a ver el detail" — factoriza lo que
// antes solo hacía clientModalAssignBtn (abrir "+ Add Task" ya prellenado)
// para poder llamarlo también desde el botón rápido "+ Add task" de cada
// fila de cliente/aeropuerto en la lista desplegada, sin pasar por el
// modal de detalle.
//
// datos históricos a que te refieres?"): ANTES el origen de la tarea se
// autocompletaba buscando, entre las rutas reales del cliente
// (findTopRouteForClient), la de mayor tonelaje histórico hacia el país —
// eso es justo lo que producía "RIO" como origen aunque ella solo hubiera
// elegido el país "Brazil" en el filtro (sin aeropuerto), o "TSN" como
// destino aunque hubiera entrado específicamente a "Shanghai (SHA)": el
// buscador encontraba una ruta real distinta y la imponía en vez de
// respetar lo que ella tenía elegido. AHORA no se busca ningún histórico
// para esto: el ORIGEN es tal cual el filtro de Origen activo del Reporte
// de ventas en ese momento (país solo, o país + aeropuerto si eligió
// ambos) y el DESTINO es el nivel exacto desde el que se apretó "+ Add
// task" — país solo si fue desde la lista de clientes de un país (o de los
// clientes de un aeropuerto puntual dentro de ese país, ver
// loadAirportClientsContent), o país + aeropuerto puntual si fue desde
// "Airports used by {client}" (ver loadClientAirportsContent) — nunca la
// ruta "con más toneladas" de otro lado. destAirportCode/destAirportCity
// quedan vacíos en el primer caso.
async function openAddTaskModalFor(cliente, paisName, paisCode, destAirportCode, destAirportCity){
  const f = state.tabFilters.reporte;
  const origenPaisFiltro = f.origenPais && f.origenPais !== "Todos" ? f.origenPais : "";
  // origenAeropuertos ahora es multi-select (11 sep) — origenAeropuertoFiltro
  // sigue siendo el string comma-separated que ya esperaban el 'origen'
  // guardado en la tarea y los params de API (/api/summary, filter_df ya
  // sabe separar por coma); origenAeropuertoDisplayList es la versión
  // legible (" + ") solo para mostrar en pantalla.
  const origenAeropuertoFiltro = (f.origenAeropuertos && f.origenAeropuertos.length) ? f.origenAeropuertos.join(',') : "";
  const origenAeropuertoDisplayList = (f.origenAeropuertos && f.origenAeropuertos.length) ? f.origenAeropuertos.join(' + ') : "";
  // en el filtro de Origen PERO la fuente activa es de un solo país real
  // (ej. México CASS, Japón WACD — no hay nada que elegir en el filtro
  // porque solo existe ese país), el origen de la tarea es igual ese
  // país — no "sin origen". 'origen_pais_unico' lo calcula el backend
  // (ver /api/data-sources) y llega en state.dataSources; si la fuente
  // SÍ mezcla varios países (o no se pudo determinar), esto da vacío y
  // se sigue mostrando "Any origin" como antes.
  const fuenteActiva = (state.dataSources || []).find(s => s.id === state.dataSource);
  const origenPaisUnico = (fuenteActiva && !origenPaisFiltro && !origenAeropuertoFiltro) ? (fuenteActiva.origen_pais_unico || "") : "";
  const originDisplay = origenAeropuertoDisplayList || origenPaisFiltro || origenPaisUnico || 'Any origin (no Origin filter set)';
  const destDisplay = destAirportCode ? `${paisName} · ${destAirportCode}${destAirportCity ? ' (' + destAirportCity + ')' : ''}` : paisName;
  state.newTask = {
    vendedor_username: "", cliente,
    // OJO: 'pais' se guarda SIEMPRE como el nombre de país limpio (nunca
    // "País · Aeropuerto") — el backend usa este campo tal cual para
    // resolve_country_code() (match exacto contra el nombre real del país,
    // ver client_tonnage_snapshot/"cierre del ciclo" en main.py); si se le
    // agregara el código de aeropuerto acá, ninguna tarea con destino a un
    // aeropuerto puntual podría medir su impacto después. El aeropuerto de
    // destino se guarda aparte (destAirportCode/destDisplay) solo para
    // mostrarlo en el resumen — mismo criterio que ya usa
    // openAddTaskModalForAirport, que tampoco toca 'pais'.
    pais: paisName,
    origen: origenAeropuertoFiltro || origenPaisFiltro || origenPaisUnico || "",
    detalle: "", readOnly: true,
    originDisplay, destDisplay,
    destAirportCode: destAirportCode || "",
    routeInfo: null,
  };
  // mercado / market share) sigue mostrando datos reales — ahora salen de
  // /api/summary con el cliente + destino (país, y aeropuerto si aplica) +
  // el MISMO filtro de Origen activo, en vez de depender de que exista una
  // ruta puntual en /api/client-view/routes. Si falla (cliente nuevo, sin
  // datos para ese cruce, etc.) el modal igual se abre — solo queda sin el
  // hint de toneladas/share, nunca bloquea la asignación.
  try {
    const p = periodParams();
    p.set('cliente', cliente);
    if (paisCode) p.set('pais', paisCode);
    if (destAirportCode) p.set('aeropuerto', destAirportCode);
    if (origenPaisFiltro) p.set('origen_pais', origenPaisFiltro);
    if (origenAeropuertoFiltro) p.set('origen_aeropuerto', origenAeropuertoFiltro);
    const summary = await api('/api/summary?' + p.toString());
    state.newTask.routeInfo = {
      destinoCode: destAirportCode || '',
      tonMercado: summary.ton_mercado,
      marketSharePct: summary.market_share_pct,
      periodLabel: compactPeriodLabel(),
    };
  } catch (e) { /* se abre igual, sin el hint de mkt/ms% — ver comentario arriba */ }
  openTaskModal(); 
}

// (no de un cliente puntual) — un aeropuerto no es un cliente al que se
// le pueda asignar una tarea, pero sí tiene sentido una tarea de "todo lo
// que llega a este aeropuerto" (una meta de market share que involucra a
// todos los clientes que pasan por ahí), así que en vez de buscarle una
// ruta a un "cliente" inventado (eso producía el origen "?"), se usan
// directamente las cifras ya cargadas para el aeropuerto en el modal de
// detalle (periodSummary, del período activo) — sin concepto de "origen"
// (no aplica: son todos los orígenes que llegan a ese aeropuerto).
async function openAddTaskModalForAirport(paisName, airportCode, airportCity, periodSummary){
  const ps = periodSummary || {};
  state.newTask = {
    vendedor_username: "",
    cliente: `All clients — ${airportCity} (${airportCode})`,
    pais: paisName,
    origen: "",
    detalle: "",
    readOnly: true,
    isAirportTask: true,
    routeInfo: {
      destinoCode: airportCode,
      tonMercado: ps.ton_mercado || 0,
      marketSharePct: ps.market_share_pct || 0,
      periodLabel: compactPeriodLabel(),
    },
  };
  openTaskModal(); 
}

// país en la tabla By Country), para una tarea que involucra a todos sus
// aeropuertos y clientes — no un cliente/aeropuerto puntual como los otros
// 2 casos de arriba. Mismo patrón que openAddTaskModalForAirport (cliente
// sintético "All clients — {país}", isCountryTask en vez de isAirportTask
// para el renderizado del resumen), pero el mkt ton/market share no se pide
// aparte a la API: la fila de la tabla (state.countries) ya trae el total
// agregado del país con los filtros activos, así que se reusa directo.
async function openAddTaskModalForCountry(paisCode, paisName){
  const f = state.tabFilters.reporte;
  const origenPaisFiltro = f.origenPais && f.origenPais !== "Todos" ? f.origenPais : "";
  const origenAeropuertoFiltro = (f.origenAeropuertos && f.origenAeropuertos.length) ? f.origenAeropuertos.join(',') : "";
  const fuenteActiva = (state.dataSources || []).find(s => s.id === state.dataSource);
  const origenPaisUnico = (fuenteActiva && !origenPaisFiltro && !origenAeropuertoFiltro) ? (fuenteActiva.origen_pais_unico || "") : "";
  const rowData = state.countries.find(r => r.Des_Country_Code === paisCode) || {};
  state.newTask = {
    vendedor_username: "",
    cliente: `All clients — ${paisName}`,
    pais: paisName,
    origen: origenAeropuertoFiltro || origenPaisFiltro || origenPaisUnico || "",
    detalle: "",
    readOnly: true,
    isCountryTask: true,
    routeInfo: {
      destinoCode: '',
      tonMercado: rowData.ton_mercado || 0,
      marketSharePct: rowData.market_share_pct || 0,
      periodLabel: compactPeriodLabel(),
    },
  };
  openTaskModal(); 
}

// ---------------------------------------------------------------------
// Modal "+ ADD TASK" (Follow-up) — antes era un panel fijo "Assign new
// task" que vivía siempre visible al lado de la lista de tareas; ahora es

// modal de detalle de cliente (renderClientModal) de arriba: un div propio
// colgado del body, que se re-arma completo cada vez que cambia el estado.
// Disponible para admin/CEO/manager (asignan a cualquier vendedor
// supervisado) y para el propio vendedor (solo puede asignarse a sí
// mismo — ver canAssignTasksToOthers/renderTaskModal).
// ---------------------------------------------------------------------
function openTaskModal(){
  // Refuerza en el frontend el mismo permiso que ya valida el backend
  // (require_task_creator), pero esto evita que el modal se abra igual si
  // algún botón quedara sin esconder por error.
  if (!canAssignTasks()) return;
  state.taskModalOpen = true;
  renderTaskModal();
}
function closeTaskModal(){
  state.taskModalOpen = false;
  renderTaskModal();

// fila real (cliente conocido) tiene que verse como su dibujo — nombre del
// cliente, ruta, y una línea con toneladas de mercado + market share del
// período activo, todo de solo lectura arriba; abajo el desplegable de
// vendedor y un campo de comentario en blanco (no el texto largo
// autogenerado de antes). Cuando NO hay contexto conocido (se abrió con el
// botón "+ Add task" suelto del toolbar de Follow-up), se muestran los 3
// campos editables de siempre — sigue siendo necesario poder crear una
// tarea a mano para un cliente/ruta que todavía no aparece en la data.
function renderTaskModal(){
  let root = document.getElementById('taskModalRoot');
  if (!root) { root = document.createElement('div'); root.id = 'taskModalRoot'; document.body.appendChild(root); }
  if (!state.taskModalOpen) { root.innerHTML = ''; return; }
  const vendedores = state.users.length ? state.users.filter(u => u.rol === 'vendedor') : [];
  const nt = state.newTask;
  const ri = nt.routeInfo;
  root.innerHTML = `
    <div class="modal-overlay" id="taskModalOverlay">
      <div class="modal-box" style="width:460px;">
        <div class="modal-head">
          <div><div class="title">+ Add new task</div></div>
          <button class="modal-close" id="taskModalCloseBtn">&times;</button>
        </div>
        <div class="modal-body">
          ${nt.readOnly ? `
          <div style="margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--line);">
            <div style="font-weight:700;font-size:15px;">${esc(nt.cliente)}</div>
            <div style="font-size:13px;color:var(--ink);margin-top:3px;">${nt.isCountryTask ? esc(nt.pais||'') + ' (every airport/client)' : nt.isCrossSellTask ? 'Cross-sell &#8594; ' + esc((ri && ri.destinoCode) || '') + ' (' + esc(nt.pais||'') + ')' : nt.isAirportTask ? esc(nt.pais||'') + ' &middot; ' + esc((ri && ri.destinoCode) || '') : nt.originDisplay !== undefined ? esc(nt.originDisplay) + ' &#8594; ' + esc(nt.destDisplay||nt.pais||'') : esc((nt.origen||'?').toUpperCase()) + ' &#8594; ' + esc((ri && ri.destinoCode) || (nt.pais||'').toUpperCase())}</div>
            ${ri ? `<div class="hint" style="margin-top:2px;padding-top:0;">(mkt ${fmtNum(ri.tonMercado,1)}T &nbsp;ms ${fmtPct(ri.marketSharePct)} &nbsp;&middot;&nbsp; ${esc(ri.periodLabel||'')})</div>` : `<div class="hint" style="margin-top:2px;padding-top:0;">No route data found for this client/country yet.</div>`}
          </div>
          ` : `
          <div class="form-group"><label class="form-label">Client / forwarder</label><input id="taskCliente" class="form-input" placeholder="E.g.: KUEHNE + NAGEL" value="${esc(nt.cliente)}"></div>
          <div class="form-group"><label class="form-label">Country</label><input id="taskPais" class="form-input" placeholder="E.g.: Germany" value="${esc(nt.pais)}"></div>
          <div class="form-group"><label class="form-label">Origin (flight/airport, optional)</label><input id="taskOrigen" class="form-input" placeholder="E.g.: HKG" value="${esc(nt.origen)}"></div>
          `}
          <div class="form-group">
            <label class="form-label">Sale rep</label>
            ${canAssignTasksToOthers() ? `
            <select id="taskVendedor" class="form-select">
              <option value="">Choose sales rep…</option>
              ${vendedores.map(v => `<option value="${esc(v.username)}" ${nt.vendedor_username===v.username?'selected':''}>${esc(v.nombre)}${v.continente_permitido?' ('+esc(v.continente_permitido)+')':''}</option>`).join('')}
            </select>
            ${vendedores.length===0 ? `<div class="hint">No sales reps created yet — go to the Permissions tab to add one.</div>` : ''}
            ` : `
            <!-- 16 sep: un vendedor solo puede asignarse tareas a sí mismo — no hay
                 desplegable, queda fijo con su propio nombre (ver addTask, que lee
                 state.user.username directo en vez de este campo). -->
            <div class="form-input" style="background:#FAFAF6;color:var(--muted);">${esc(state.user.nombre)} (you)</div>
            `}
          </div>
          <div class="form-group">
            <label class="form-label">Comment</label>
            <select id="taskDetalleTemplate" class="form-select" style="margin-bottom:6px;">
              <option value="">Choose a saved comment (optional)…</option>
              ${TASK_COMMENT_TEMPLATES.map(t => `<option value="${esc(t)}">${esc(t)}</option>`).join('')}
              <option value="__other__">Other (type your own)</option>
            </select>
            <textarea id="taskDetalle" class="form-textarea" rows="3" placeholder="E.g.: Call to understand kg drop">${esc(nt.detalle)}</textarea>
          </div>
          <button class="btn btn-primary" id="addTaskBtn">+ Add task</button>
          <div class="hint">Tip: from Sales Report, any alert or opportunity has a button that fills in this form automatically.</div>
        </div>
      </div>
    </div>
  `;
  const closeBtn = document.getElementById('taskModalCloseBtn');
  if (closeBtn) closeBtn.onclick = closeTaskModal;
  const overlay = document.getElementById('taskModalOverlay');
  if (overlay) overlay.onclick = (e) => { if (e.target.id === 'taskModalOverlay') closeTaskModal(); };
  const addBtn = document.getElementById('addTaskBtn');
  if (addBtn) addBtn.onclick = addTask;
  const detalleTemplateSel = document.getElementById('taskDetalleTemplate');
  if (detalleTemplateSel) detalleTemplateSel.onchange = (e) => {
    const ta = document.getElementById('taskDetalle');
    if (!ta) return;
    if (e.target.value === '__other__') { ta.value = ''; ta.focus(); }
    else if (e.target.value !== '') { ta.value = e.target.value; }
  };
}

// Descarga la minuta como PDF — usa fetch directo (no api()) porque la
// respuesta es binaria, no JSON, así que se maneja como Blob y se dispara
// la descarga con un <a download> temporal.
async function downloadTasksPdf(groupBy){
  const btn = document.getElementById('downloadMinutesPdfBtn');
  try {
    if (btn) { btn.disabled = true; btn.textContent = 'Generating…'; }
    const res = await fetch(API + '/api/tasks/export/pdf?group_by=' + encodeURIComponent(groupBy), {
      headers: { Authorization: 'Bearer ' + state.token },
    });
    if (!res.ok) {
      const body = await res.json().catch(() => ({}));
      throw new Error(body.detail || ('Error ' + res.status));
    }
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'follow-up-minutes-' + groupBy + '.pdf';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  } catch (err) {
    alert('Could not download the PDF: ' + err.message);
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = '💾 Download PDF'; }
  }
}

async function addTask(){
  // 16 sep: un vendedor no tiene el desplegable #taskVendedor (ver
  // renderTaskModal) — siempre se asigna a sí mismo. El permiso real se
  // refuerza en el backend (require_task_creator + el chequeo en
  // create_task, main.py), esto es solo para que el campo tenga un valor.
  const vendedor_username = canAssignTasksToOthers() ? document.getElementById('taskVendedor').value : state.user.username;
  const nt = state.newTask;
  // en modo de solo lectura (contexto conocido) no existen los inputs
  // #taskCliente/#taskPais/#taskOrigen — el cliente/país/origen ya vienen
  // fijos en state.newTask (ver renderTaskModal / openAddTaskModalFor).
  const clienteEl = document.getElementById('taskCliente');
  const paisEl = document.getElementById('taskPais');
  const origenEl = document.getElementById('taskOrigen');
  const cliente = clienteEl ? clienteEl.value.trim() : (nt.cliente || '').trim();
  const pais = paisEl ? paisEl.value.trim() : (nt.pais || '').trim();
  const origen = origenEl ? origenEl.value.trim() : (nt.origen || '').trim();
  const detalle = document.getElementById('taskDetalle').value.trim();
  const btn = document.getElementById('addTaskBtn');
  if (!vendedor_username) { alert('Choose a sales rep before assigning the task.'); return; }
  if (!cliente) { alert('Missing client.'); return; }
  // Si se deja en blanco, se guarda un detalle genérico, para que la
  // tarea siempre tenga algo que describirla en las listas/minutas.
  const detalleFinal = detalle || `Follow up client: ${cliente}${pais ? ' in ' + pais : ''}`;
  // Cualquier flujo que llegó a este modal ya calculó (o intentó
  // calcular) toneladas de mercado/market share/período en
  // nt.routeInfo (ver openAddTaskModalFor, openAddTaskModalForAirport,
  // assignFromOpportunity, y los quick-assign de alertas/oportunidad
  // manual/cumplimiento) — se manda tal cual al backend para que
  // Follow-up ya no tenga que recalcularlo en vivo contra la base de
  // datos que esté activa en ese momento.
  const ri = nt.routeInfo;
  try {
    if (btn) { btn.disabled = true; btn.textContent = 'Assigning…'; }
    await api('/api/tasks', { method: 'POST', body: JSON.stringify({
      vendedor_username, cliente, pais, origen: origen || null, detalle: detalleFinal,
      market_share_pct: ri ? ri.marketSharePct : null,
      ton_mercado: ri ? ri.tonMercado : null,
      periodo_label: ri ? ri.periodLabel : null,
      destino_aeropuerto: nt.destAirportCode || null,
    }) });
    state.newTask = { vendedor_username: "", cliente: "", pais: "", origen: "", detalle: "", readOnly: false, routeInfo: null };
    closeTaskModal();
    await loadTasks(); renderMain();
  } catch (err) {
    alert('Could not assign the task: ' + err.message);
    if (btn) { btn.disabled = false; btn.textContent = '+ Add task'; }
  }
}
async function assignFromOpportunity(o){
  // openAddTaskModalFor — cliente/ruta conocidos, se muestran de solo
  // lectura arriba (ver renderTaskModal) y el comentario queda en blanco.
  state.newTask = { vendedor_username: "", cliente: o.FF_Head_Name, pais: o.Des_Country, origen: "", detalle: "", readOnly: true, routeInfo: null };
  // cliente, la de mayor tonelaje de mercado que va al país de la
  // oportunidad, y se usa esa ruta puntual (origen→destino, toneladas,
  // share) para prellenar el origen y el resumen de arriba. Esto NO toca
  // el cálculo de impacto (line base/medición sigue siendo por
  // país+cliente, ver resolve_country_code/client_tonnage_snapshot en el
  // backend) — es solo para que el resumen sea específico y se pueda leer
  // de un vistazo.
  const match = await findTopRouteForClient(o.FF_Head_Name, o.Des_Country);
  if (match) {
    state.newTask.origen = match.origen_code || '';
    state.newTask.routeInfo = { destinoCode: match.destino_code, tonMercado: match.ton_mercado, marketSharePct: match.market_share_pct, periodLabel: periodLabelForMatch(match) };
  } else {
    // sin ruta real encontrada, igual mostramos el market share a nivel país
    // que ya trae la oportunidad, para no dejar el resumen completamente vacío.
    state.newTask.routeInfo = { destinoCode: null, tonMercado: o.mkt_w, marketSharePct: o.market_share_pct, periodLabel: compactPeriodLabel() };
  }
  openTaskModal(); 
}

let _refreshCachePollTimer = null;

async function triggerRefreshCache(){
  if (!isAdmin()) return;
  const btn = document.getElementById('refreshCacheBtn');
  if (btn) { btn.disabled = true; btn.textContent = 'Starting…'; }
  try {
    await api('/api/admin/refresh-cache', { method: 'POST' });
  } catch(e) {
    alert('Could not start the refresh: ' + (e.message || e));
  }
  await loadRefreshCacheStatus();
  renderMain();
  // Puede tardar varios minutos (17+ fuentes completas) — se consulta el
  // estado cada 15s hasta que 'corriendo' pase a false, en vez de dejar el
  // botón pegado en "Starting…" sin ninguna señal de avance.
  if (_refreshCachePollTimer) clearInterval(_refreshCachePollTimer);
  _refreshCachePollTimer = setInterval(async () => {
    await loadRefreshCacheStatus();
    if (state.tab === 'fuentes') renderMain();
    if (!state.refreshCacheStatus || !state.refreshCacheStatus.corriendo) {
      clearInterval(_refreshCachePollTimer);
      _refreshCachePollTimer = null;
    }
  }, 15000);
}

// detalle real. Cubre también el nivel anidado (aeropuerto/cliente
// dentro del país, que no tiene caché propio y por eso sí necesita un
// pedido nuevo al backend cuando esto pasa).
function restoreExpandedReportDetail(){
  if (state.tab !== 'reporte' || !state.expandedCountry) return;
  const code = state.expandedCountry;
  const wrap = document.getElementById('detailWrap-' + code);
  if (!wrap) return;
  const rowData = state.countries.find(r => r.Des_Country_Code === code);
  const name = rowData ? rowData.Des_Country : code;
  const cache = state.detailLevel === 'cliente' ? state.reportClientsCache : state.reportAirportsCache;
  if (cache && cache.code === code) {
    wrap.innerHTML = state.detailLevel === 'cliente' ? renderClientsListHtml(code, name) : renderAirportsListHtml(code, name);
    wireDetailWrapEvents(wrap, code, name);
    // Nivel anidado: sin caché propio (ver loadAirportClientsContent/
    // loadClientAirportsContent), así que si seguía expandido hay que
    // volver a pedirle su detalle — mismo problema, un nivel más adentro.
    if (state.expandedAirport) {
      const airport = (state.reportAirportsCache.airports || []).find(a => a.Des_Code === state.expandedAirport);
      loadAirportClientsContent(code, name, state.expandedAirport, airport ? airport.Des_City : '');
    } else if (state.expandedClient) {
      loadClientAirportsContent(code, name, state.expandedClient);
    }
  } else if (wrap.querySelector('.loading')) {
    loadDetailContent(code, name);
  }
}

function globalLevelData(){
  const level = state.globalLevel || 'continente';
  const map = new Map();
  (state.globalCountries.length ? state.globalCountries : state.countryOptionsAll).forEach(r => {
    const key = level === 'continente' ? r.Des_Continent : r.Des_Country;
    if (!map.has(key)) map.set(key, { key, continente: r.Des_Continent, tons: 0, rev: 0, mktTons: 0, mktRev: 0 });
    const a = map.get(key);
    a.tons += r.ton_propias; a.rev += r.cust_c;
    a.mktTons += r.ton_mercado; a.mktRev += r.mkt_c;
  });
  return Array.from(map.values());
}

// Formatea en millones cuando el número es grande (ej. "1.7M"), y en
// miles/normal cuando es chico — así los totales de Vista Global no se
// ven como un número gigante ilegible.
function fmtBig(n, unitSuffix){
  unitSuffix = unitSuffix || '';
  const abs = Math.abs(n || 0);
  if (abs >= 1e6) return numComma(n/1e6, 1) + 'M' + unitSuffix;
  if (abs >= 1e3) return numComma(n/1e3, 1) + 'K' + unitSuffix;
  return numComma(n, 0) + unitSuffix;
}

async function loadComparativo(){
  state.comparativoLoading = true;
  renderMain();
  const f = state.tabFilters.comparativo;
  const ecParam = continentesParam('comparativo');
  const qs = new URLSearchParams();
  if (state.comparativoPeriod === 'custom') {
    const c = state.comparativoCustom;
    const aIdx = [state.months.indexOf(c.aFrom), state.months.indexOf(c.aTo)].sort((x,y)=>x-y);
    const bIdx = [state.months.indexOf(c.bFrom), state.months.indexOf(c.bTo)].sort((x,y)=>x-y);
    qs.set('months_a', state.months.slice(aIdx[0], aIdx[1]+1).join(','));
    qs.set('months_b', state.months.slice(bIdx[0], bIdx[1]+1).join(','));
  } else {
    qs.set('period', state.comparativoPeriod);
  }
  if (ecParam) qs.set('continente', ecParam);
  if (paisParam('comparativo')) qs.set('pais', paisParam('comparativo'));
  if (aeropuertoParam('comparativo')) qs.set('aeropuerto', aeropuertoParam('comparativo'));
  if (f.origenPais !== "Todos") qs.set('origen_pais', f.origenPais);
  if (origenAeropuertoParam('comparativo')) qs.set('origen_aeropuerto', origenAeropuertoParam('comparativo'));
  // "Destinos <aerolínea>" (pedido del 16 sep) — mismo filtro
  // compartido que ya usa Reporte de ventas (ver comentario igual en
  // loadGlobalData).
  if (f.aerolineaDestino !== "Todos") qs.set('aerolinea_destino', f.aerolineaDestino);
  try {
    state.comparativoData = await api('/api/comparativo?' + qs.toString());
    const d = state.comparativoData;
    const trendParamsFor = (months) => {
      const p = new URLSearchParams({ months: months.join(',') });
      if (ecParam) p.set('continente', ecParam);
      if (paisParam('comparativo')) p.set('pais', paisParam('comparativo'));
      if (aeropuertoParam('comparativo')) p.set('aeropuerto', aeropuertoParam('comparativo'));
      if (f.origenPais !== "Todos") p.set('origen_pais', f.origenPais);
      if (origenAeropuertoParam('comparativo')) p.set('origen_aeropuerto', origenAeropuertoParam('comparativo'));
      if (f.aerolineaDestino !== "Todos") p.set('aerolinea_destino', f.aerolineaDestino);
      return p;
    };
    // dos series independientes (una por período) para el gráfico de barras
    // dobles + líneas dobles — no una sola línea de tiempo combinada.
    const [trendA, trendB] = await Promise.all([
      (d.periodo_a && d.periodo_a.length) ? api('/api/trend?' + trendParamsFor(d.periodo_a).toString()) : Promise.resolve([]),
      (d.periodo_b && d.periodo_b.length) ? api('/api/trend?' + trendParamsFor(d.periodo_b).toString()) : Promise.resolve([]),
    ]);
    state.comparativoTrendA = trendA;
    state.comparativoTrendB = trendB;
  } catch (e) {
    state.comparativoData = { rows: [], periodo_a: [], periodo_b: [], aviso: e.message };
    state.comparativoTrendA = [];
    state.comparativoTrendB = [];
  }
  state.comparativoLoading = false;
  renderMain();
}

function origenAeropuertoMultiSelectLabel(f){
  if (f.origenAeropuertos.length === 0) return 'All airports';

  return f.origenAeropuertos.length + ' airports selected';

function renderOrigenAeropuertoMultiSelectPanel(scope, idSuffix){
  const f = state.tabFilters[scope];

  return `

        </div>` : ''}
      </div>`;
}
function wireOrigenAeropuertoCheckboxes(scope, idSuffix, onDataReload){
  const f = state.tabFilters[scope];
  const applyChange = async () => {
    await onDataReload();
    f.origenAeropuertoDropdownOpen = true; // se mantiene abierto mientras se van tildando varios
    renderMain();
  };
  const allCb = document.getElementById('origenAeropuertoCbAll' + idSuffix);
  if (allCb) allCb.onchange = async () => { f.origenAeropuertos = []; await applyChange(); };
  document.querySelectorAll('.origen-aeropuerto-cb' + idSuffix).forEach(cb => cb.onchange = async (e) => {
    if (e.target.checked) { if (!f.origenAeropuertos.includes(e.target.value)) f.origenAeropuertos.push(e.target.value); }
    else f.origenAeropuertos = f.origenAeropuertos.filter(a => a !== e.target.value);
    await applyChange();
  });
}
function wireOrigenAeropuertoMultiSelect(scope, idSuffix, onDataReload){
  const f = state.tabFilters[scope];
  const toggle = document.getElementById('origenAeropuertoMultiToggle' + idSuffix);
  if (toggle) toggle.onclick = (e) => { e.stopPropagation(); f.origenAeropuertoDropdownOpen = !f.origenAeropuertoDropdownOpen; renderMain(); };
  const panel = document.getElementById('origenAeropuertoMultiPanel' + idSuffix);
  if (panel) panel.onclick = (e) => e.stopPropagation();
  wireOrigenAeropuertoCheckboxes(scope, idSuffix, onDataReload);
}

async function loadClienteViewList(){
  if (state.clienteViewList.length) return;
  try { state.clienteViewList = await api('/api/client-view/clients'); } catch(e) { state.clienteViewList = []; }
}

async function loadClienteViewData(){
  if (!state.clienteViewSelected) { state.clienteViewData = null; state.clienteViewDestinos = []; return; }
  state.clienteViewLoading = true;
  renderMain();
  const cf = state.tabFilters.cliente;
  const params = new URLSearchParams({ cliente: state.clienteViewSelected });
  const ecClienteParam = continentesParam('cliente');
  if (ecClienteParam) params.set('continente', ecClienteParam);
  if (paisParam('cliente')) params.set('pais', paisParam('cliente'));
  if (cf.origenPais !== "Todos") params.set('origen_pais', cf.origenPais);
  if (origenAeropuertoParam('cliente')) params.set('origen_aeropuerto', origenAeropuertoParam('cliente'));
  // "Destinos <aerolínea>" en Client View (pedido del 16 sep) — mismo
  // patrón que Vista Global/Comparativo (ver comentario en loadGlobalData).
  if (cf.aerolineaDestino !== "Todos") params.set('aerolinea_destino', cf.aerolineaDestino);
  // AÑO SOLO TIENE YTD Y FULL HISTORY" — mismo selector de período (y
  // mismo helper windowsFor) que ya usa el Reporte de ventas, en vez de
  // solo YTD/histórico completo. Antes esto NUNCA se mandaba al backend —
  // los KPIs de arriba siempre eran del histórico completo del cliente y
  // solo los gráficos de abajo se recortaban en el frontend.
  if (state.clienteViewPeriodo === "custom") {
    if (state.clienteViewDateFrom) params.set('date_from', state.clienteViewDateFrom);
    if (state.clienteViewDateTo) params.set('date_to', state.clienteViewDateTo);
  } else if (state.clienteViewPeriodo !== "all") {
    params.set('months', windowsFor(state.clienteViewPeriodo).join(','));
  }
  try {
    const [summary, destinos] = await Promise.all([
      api('/api/client-view/summary?' + params.toString()),
      api('/api/client-view/by-destination?' + params.toString()),
    ]);
    state.clienteViewData = summary;
    state.clienteViewDestinos = destinos;
  } catch (e) {
    state.clienteViewData = { trend: [], kpi: null, error: e.message };
    state.clienteViewDestinos = [];
  }
  state.clienteViewLoading = false;
  renderMain();
}

function drawClienteViewCharts(){
  if (state.clienteViewChartInst) { state.clienteViewChartInst.destroy(); state.clienteViewChartInst = null; }
  if (state.clienteViewRateChartInst) { state.clienteViewRateChartInst.destroy(); state.clienteViewRateChartInst = null; }
  if (state.clienteViewDonutInst) { state.clienteViewDonutInst.destroy(); state.clienteViewDonutInst = null; }
  const d = state.clienteViewData;
  if (!d || !d.trend || !d.trend.length) return;

  // (ver renderClienteView/loadClienteViewData) ahora se manda al backend
  // y 'd.trend' YA viene acotado a ese período — antes este recorte se
  // hacía acá mismo, en el frontend, mirando solo el año del último mes
  // disponible (por eso solo había YTD/histórico completo como opciones).
  const trend = d.trend;

  const chartCanvas = document.getElementById('clienteViewChart');
  if (chartCanvas) {
    state.clienteViewChartInst = new Chart(chartCanvas, {
      data: {
        labels: trend.map(t => monthLabel(t.month)),
        datasets: [
          { type: 'bar', label: LBL_MKT_TON, data: trend.map(t => t.ton_mercado), backgroundColor: OWN_PALETTE[5], borderColor: OWN_PALETTE[2], borderWidth: 1, yAxisID: 'y', order: 2 },
          { type: 'line', label: LBL_MS, data: trend.map(t => t.market_share_pct), borderColor: OWN_PALETTE[0], backgroundColor: OWN_PALETTE[0], yAxisID: 'y1', tension: 0.25, pointRadius: 3, order: 1 },
        ]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        scales: {
          y: { position: 'left', beginAtZero: true, ticks: { font: { size: 11 } } },
          y1: { position: 'right', beginAtZero: true, ticks: { font: { size: 11 }, callback: v => v + '%' }, grid: { drawOnChartArea: false } },
          x: { ticks: { font: { size: 10 } }, grid: { display: false } }
        },
        plugins: { legend: { display: state.chartLegendsVisible, labels: { font: { size: 11 } } } }
      }
    });
  }

  const rateCanvas = document.getElementById('clienteViewRateChart');
  if (rateCanvas) {
    state.clienteViewRateChartInst = new Chart(rateCanvas, {
      data: {
        labels: trend.map(t => monthLabel(t.month)),
        datasets: [
          { type: 'bar', label: LBL_MKT_TON, data: trend.map(t => t.ton_mercado), backgroundColor: OWN_PALETTE[5], borderColor: OWN_PALETTE[2], borderWidth: 1, yAxisID: 'y', order: 3 },
          { type: 'line', label: LBL_MKT_RATE, data: trend.map(t => t.tarifa_mercado), borderColor: '#8C6218', backgroundColor: '#8C6218', yAxisID: 'y1', tension: 0.25, pointRadius: 3, order: 2 },
          { type: 'line', label: LBL_CX_RATE, data: trend.map(t => t.tarifa_propia), borderColor: OWN_PALETTE[0], backgroundColor: OWN_PALETTE[0], yAxisID: 'y1', tension: 0.25, pointRadius: 3, order: 1 },
        ]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        scales: {
          y: { position: 'left', beginAtZero: true, ticks: { font: { size: 11 } } },
          y1: { position: 'right', beginAtZero: true, ticks: { font: { size: 11 }, callback: v => '$'+v }, grid: { drawOnChartArea: false } },
          x: { ticks: { font: { size: 10 } }, grid: { display: false } }
        },
        plugins: { legend: { display: state.chartLegendsVisible, labels: { font: { size: 11 } } } }
      }
    });
  }

  const donutCanvas = document.getElementById('clienteViewDonut');
  if (donutCanvas && state.clienteViewDestinos.length) {
    const top = state.clienteViewDestinos.slice(0, 8);
    const labels = top.map(r => r.Des_Code);
    const values = top.map(r => r.mkt_w);
    const totalVal = values.reduce((a,b)=>a+b, 0);
    state.clienteViewDonutInst = new Chart(donutCanvas, {
      type: 'doughnut',
      data: { labels, datasets: [{ data: values, backgroundColor: OWN_PALETTE, borderColor: '#fff', borderWidth: 2 }] },
      options: {
        responsive: true, maintainAspectRatio: false, cutout: '58%',
        plugins: {
          // a la derecha le achicaba mucho el círculo del donut en esta
          // tarjeta en particular.
          legend: {
            display: state.chartLegendsVisible,
            position: 'bottom', labels: {
              font: { size: 10 }, boxWidth: 8,
              generateLabels: (chart) => chart.data.labels.map((label, i) => ({
                text: `${label} · ${fmtPct(totalVal ? values[i]/totalVal*100 : 0)}`,
                fillStyle: OWN_PALETTE[i % OWN_PALETTE.length],
                index: i,
              })),
            }
          },
          centerText: { value: fmtTon(totalVal, 1), label: LBL_MKT_TON },
          tooltip: { callbacks: { label: (ctx) => ctx.label + ': ' + fmtTon(ctx.raw) + ' (' + fmtPct(totalVal ? ctx.raw/totalVal*100 : 0) + ')' } }
        }
      },
      plugins: [centerTextPlugin]
    });
  }
}

// Antes este texto decía siempre "Origin: HKG · Cathay Cargo (CASS)" sin
// importar la fuente activa — quedaba mal (y confundía) con cualquier
// fuente que no fuera esa una específica. Ahora refleja de verdad lo que
// se está mirando: la aerolínea puntual (Cathay, Avianca, o la que
// corresponda) si aplica, o que se están mostrando todos los clientes
// cuando la fuente mezcla varias y no hay una aerolínea asignada.
function aerolineaHintTexto(){
  const fuente = (state.dataSources || []).find(s => s.id === state.dataSource);
  const nombreFuente = fuente ? fuente.nombre : null;
  if (AIRLINE_GENERIC) {
    return nombreFuente
      ? `Showing all clients for ${nombreFuente}. Once a specific airline is assigned, the selector to view just theirs will appear right here.`
      : `Showing all clients. Once a specific airline is assigned, the selector to view just theirs will appear right here.`;
  }
  return `Airline: ${AIRLINE_NAME} (${AIRLINE_CODE})${nombreFuente ? ' · ' + nombreFuente : ''}.`;
}

// cuando se agrupa por país, se arma un panel independiente por cada
// continente (con sus propias donas) en vez de un solo gráfico gigante
// mezclando 190 países — así pediste que se viera.
// Único lugar donde se decide el orden de los continentes en la vista "By
// country" del Reporte global — lo usan renderGlobalByContinentGroups()
// (arma los paneles y sus canvas "contDonut-N") y drawGlobalCharts() (llena
// esos mismos canvas con los gráficos) — antes cada uno tenía su propio
// sort() con un criterio distinto (uno por toneladas de mercado, el otro
// por toneladas propias) y por eso un panel podía terminar mostrando el
// que ambos llaman a esta misma función, no se pueden volver a desalinear.
function sortContinentesPorMktTons(byContinent){
  return Array.from(byContinent.keys()).sort((a,b) => {
    const totalA = byContinent.get(a).reduce((s,r)=>s+r.mktTons,0);
    const totalB = byContinent.get(b).reduce((s,r)=>s+r.mktTons,0);
    return totalB - totalA;
  });
}

function renderGlobalByContinentGroups(){
  const rows = globalLevelData(); // ya viene agrupado por país (state.globalLevel === 'pais')
  const metric = state.globalMetric || 'toneladas';
  const isRev = metric === 'revenue';
  const val = r => isRev ? r.mktRev : r.mktTons;
  const valCx = r => isRev ? r.rev : r.tons;
  const fmtVal = v => isRev ? '$' + fmtNum(v,0) : fmtNum(v,1);
  const lblMkt = isRev ? LBL_MKT_REV : LBL_MKT_TON, lblCx = isRev ? LBL_CX_REV : LBL_CX_TON;
  const byContinent = new Map();
  rows.forEach(r => {
    if (!byContinent.has(r.continente)) byContinent.set(r.continente, []);
    byContinent.get(r.continente).push(r);
  });
  // orden por toneladas de MERCADO totales (no las propias) — así el
  // continente con el mercado más grande siempre queda primero. OJO: este
  // mismo orden lo tiene que usar drawGlobalCharts() de más abajo, porque
  // ahí es donde a cada canvas "contDonut-N" (armado acá, según este
  // índice N) se le pone el gráfico de verdad — si un día se cambia este
  // criterio, hay que cambiarlo en el otro lado también (ver comentario
  // ahí, con el bug real que causó tenerlos distintos).
  const continentes = sortContinentesPorMktTons(byContinent);
  const switchHtml = `
    <div class="filters" style="margin-bottom:12px;">
      <span class="hint" style="padding-right:4px;">View by:</span>
      <div class="seg">
        <button class="${metric==='toneladas'?'active':''}" data-global-metric="toneladas">Tons</button>
        <button class="${metric==='revenue'?'active':''}" data-global-metric="revenue">Revenue</button>
      </div>
    </div>`;
  return switchHtml + continentes.map((cont, ci) => {
    // su "top 8") por toneladas PROPIAS (valCx), mientras que el gráfico
    // de al lado (más abajo, en drawGlobalCharts) ya ordenaba por
    // toneladas de MERCADO (val) — dos criterios distintos otra vez
    // (mismo patrón que el bug de continentes desalineados, 31 ago), así
    // que la tabla no quedaba ordenada de mayor a menor por mercado como
    // pidió, y encima mostraba países distintos a los del gráfico. Ahora
    // los dos usan "val" (mercado).
    const paisesSorted = byContinent.get(cont).sort((a,b) => val(b) - val(a));
    const totalTons = paisesSorted.reduce((s,r) => s + valCx(r), 0);
    const totalMktTons = paisesSorted.reduce((s,r) => s + val(r), 0);
    const top = paisesSorted.slice(0, 8);
    const resto = paisesSorted.slice(8);
    const otrosTons = resto.reduce((s,r) => s + valCx(r), 0);
    const otrosMktTons = resto.reduce((s,r) => s + val(r), 0);
    return `
    <div class="panel" style="margin-bottom:16px;">
      <div class="panel-head">
        <span>${esc(cont)}</span>
      </div>
      <div style="padding:16px;">
        <div class="donuts-global">
          <div style="text-align:center;">
            <div style="height:260px;position:relative;"><canvas id="contDonut-${ci}"></canvas></div>
            <div class="hint">By country — ${lblMkt}</div>
          </div>
          <div style="text-align:center;">
            <div class="responsive-table-wrap">
            <table style="font-size:12px;">
              <thead><tr><th style="text-align:left;">Country</th><th>${lblMkt}</th><th>${lblCx}</th><th>${LBL_MS}</th></tr></thead>
              <tbody>
                <tr style="border-bottom:2px solid var(--line);font-weight:700;"><td style="padding:5px 8px;text-align:left;">Total</td><td class="num">${fmtVal(totalMktTons)}</td><td class="num">${fmtVal(totalTons)}</td><td class="num">${fmtPct(totalMktTons?totalTons/totalMktTons*100:0)}</td></tr>
                ${top.map(r => `<tr style="border-top:1px solid var(--line);"><td style="padding:5px 8px;text-align:left;">${esc(r.key)}</td><td class="num">${fmtVal(val(r))}</td><td class="num">${fmtVal(valCx(r))}</td><td class="num">${fmtPct(r.mktTons?r.tons/r.mktTons*100:0)}</td></tr>`).join('')}
                ${resto.length ? `<tr style="border-top:1px solid var(--line);color:var(--muted);"><td style="padding:5px 8px;text-align:left;">Other (${resto.length})</td><td class="num">${fmtVal(otrosMktTons)}</td><td class="num">${fmtVal(otrosTons)}</td><td class="num">${fmtPct(otrosMktTons?otrosTons/otrosMktTons*100:0)}</td></tr>` : ''}
              </tbody>
            </table>

function drawGlobalCharts(){
  if (state.globalChart1) { state.globalChart1.destroy(); state.globalChart1 = null; }
  if (state.globalChart2) { state.globalChart2.destroy(); state.globalChart2 = null; }
  (state.globalContinentCharts || []).forEach(c => c.destroy());
  state.globalContinentCharts = [];

  const level = state.globalLevel || 'continente';
  if (level === 'pais') {
    // un gráfico chico por cada continente, con sus países adentro
    const rows = globalLevelData();
    const metric = state.globalMetric || 'toneladas';
    const isRev = metric === 'revenue';
    const val = r => isRev ? r.mktRev : r.mktTons;
    const byContinent = new Map();
    rows.forEach(r => { if (!byContinent.has(r.continente)) byContinent.set(r.continente, []); byContinent.get(r.continente).push(r); });
    // habían armado los canvas "contDonut-N" en un orden (por toneladas de
    // MERCADO, ver renderGlobalByContinentGroups()) y este bloque los
    // llenaba con los datos en OTRO orden (por toneladas propias/CX) — dos
    // criterios de orden distintos para la misma lista de continentes, así
    // que el canvas del panel "Europe" (1° por tamaño de mercado) terminaba
    // con los datos del continente que quedara 1° por toneladas propias
    // (ej. Asia), aunque la tabla de al lado del mismo panel sí mostraba
    // Europa bien (esa tabla no depende de este orden). Ahora los dos usan
    // exactamente el mismo criterio (sortContinentesPorMktTons), así el
    // canvas #N siempre es el continente #N en ambos lados.
    const continentes = sortContinentesPorMktTons(byContinent);
    continentes.forEach((cont, ci) => {
      const canvas = document.getElementById('contDonut-' + ci);
      if (!canvas) return;
      const paisesAll = byContinent.get(cont).sort((a,b) => val(b) - val(a));
      const top = paisesAll.slice(0, 8);
      const otros = paisesAll.slice(8).reduce((s,r) => s + val(r), 0);
      const labels = top.map(r=>r.key);
      const values = top.map(r=>val(r));
      if (otros > 0) { labels.push('Other'); values.push(otros); }
      const total = paisesAll.reduce((s,r) => s + val(r), 0);
      const fmtVal = v => isRev ? '$' + fmtNum(v,0) : fmtNum(v,1);
      const chart = new Chart(canvas, {
        type: 'doughnut',
        data: { labels, datasets: [{ data: values, backgroundColor: labels.map((_,i)=>GLOBAL_PALETTE[i%GLOBAL_PALETTE.length]), borderColor:'#fff', borderWidth:2 }] },
        options: { responsive:true, maintainAspectRatio:false, cutout:'60%',
          plugins: { legend: { display: state.chartLegendsVisible, position:'bottom', labels:{ font:{size:9}, boxWidth:8 } }, centerText: { value: fmtVal(total), label: isRev ? LBL_MKT_REV : LBL_MKT_TON },
            tooltip: { callbacks: { label: (ctx) => ctx.label + ': ' + fmtVal(ctx.raw) + ' (' + fmtPct(total?ctx.raw/total*100:0) + ')' } } } },
        plugins: [centerTextPlugin]
      });
      state.globalContinentCharts.push(chart);
    });
    return;
  }

  const rows = globalLevelData();
  const totalMktTons = rows.reduce((s,r) => s + r.mktTons, 0);
  const totalMktRev = rows.reduce((s,r) => s + r.mktRev, 0);
  const sorted = rows.slice().sort((a,b) => b.mktTons - a.mktTons);
  const c1 = document.getElementById('globalDonutTons');
  if (c1) state.globalChart1 = new Chart(c1, {
    type: 'doughnut',
    data: { labels: sorted.map(r=>r.key), datasets: [{ data: sorted.map(r=>r.mktTons), backgroundColor: sorted.map((_,i)=>GLOBAL_PALETTE[i%GLOBAL_PALETTE.length]), borderColor:'#fff', borderWidth:2 }] },
    options: { responsive:true, maintainAspectRatio:false, cutout:'60%',
      plugins: { legend: { display: state.chartLegendsVisible, position:'bottom', labels:{ font:{size:10}, boxWidth:10 } }, centerText: { value: fmtNum(totalMktTons,1), label:'total tons' },
        tooltip: { callbacks: { label: (ctx) => ctx.label + ': ' + fmtNum(ctx.raw,1) + ' (' + fmtPct(totalMktTons?ctx.raw/totalMktTons*100:0) + ')' } } } },
    plugins: [centerTextPlugin]
  });
  const c2 = document.getElementById('globalDonutRev');
  if (c2) state.globalChart2 = new Chart(c2, {
    type: 'doughnut',
    data: { labels: sorted.map(r=>r.key), datasets: [{ data: sorted.map(r=>r.mktRev), backgroundColor: sorted.map((_,i)=>GLOBAL_PALETTE[i%GLOBAL_PALETTE.length]), borderColor:'#fff', borderWidth:2 }] },
    options: { responsive:true, maintainAspectRatio:false, cutout:'60%',
      plugins: { legend: { display: state.chartLegendsVisible, position:'bottom', labels:{ font:{size:10}, boxWidth:10 } }, centerText: { value: '$'+fmtNum(totalMktRev,0), label:'total revenue' },
        tooltip: { callbacks: { label: (ctx) => ctx.label + ': $' + fmtNum(ctx.raw,0) + ' (' + fmtPct(totalMktRev?ctx.raw/totalMktRev*100:0) + ')' } } } },
    plugins: [centerTextPlugin]
  });
}

// Universo de países/continentes a partir del cual se arman las opciones
// del selector de Destino: para la pestaña 'reporte', cuando hay una
// aerolínea elegida en "Destinos <aerolínea>", se usa el universo ya
// acotado a esa aerolínea (ver loadReporteCountryOptions) en vez del
// universo completo — así el propio selector solo ofrece continentes/
// países con "Y" para esa aerolínea.
function countryOptionsUniverse(scope){
  const rf = state.tabFilters.reporte;
  if (scope === 'reporte' && rf.aerolineaDestino !== 'Todos' && state.reporteCountryOptions.length) return state.reporteCountryOptions;
  return state.countryOptionsAll;
}
function countryOptionsForContinente(scope){
  const ecs = effContinentes(scope);
  const seen = new Map();
  countryOptionsUniverse(scope).forEach(r => {
    if (ecs.length && !ecs.includes(r.Des_Continent)) return;
    if (!seen.has(r.Des_Country_Code)) seen.set(r.Des_Country_Code, { code: r.Des_Country_Code, name: r.Des_Country, size: 0 });
    seen.get(r.Des_Country_Code).size += (r.mkt_w || 0);
  });
  const arr = Array.from(seen.values());
  return state.tabFilters[scope].paisSortMode === 'tamano'
    ? arr.sort((a,b) => b.size - a.size)
    : arr.sort((a,b) => a.name.localeCompare(b.name));
}
function continentOptions(scope){ return Array.from(new Set(countryOptionsUniverse(scope).map(r => r.Des_Continent))).sort(); }

}

  const byVendor = new Map();
  state.tasks.forEach(t => {
    if (!byVendor.has(t.vendedor_username)) byVendor.set(t.vendedor_username, { nombre: t.vendedor_nombre, total: 0, hechas: 0 });
    const v = byVendor.get(t.vendedor_username);
    v.total++; if (t.estado === 'hecha') v.hechas++;
  });
  const rows = Array.from(byVendor.entries()).map(([username, v]) => ({ username, nombre: v.nombre, pct: v.total ? Math.round(v.hechas/v.total*100) : 0, total: v.total, hechas: v.hechas }));
  rows.sort((a,b) => a.pct - b.pct);
  return `
  <div class="panel" style="margin-top:16px;">
    <div class="panel-head">
      <span>&#128101; Task completion by sales rep</span>
      <span style="text-transform:none;font-weight:400;font-size:10px;">&#128308; &lt;20% &nbsp; &#128993; 20–40% &nbsp; &#128994; 40%+</span>
    </div>
    <div style="padding:12px 16px;">
      ${rows.length === 0 ? `<div class="empty">No tasks assigned to anyone yet.</div>` : rows.map(r => {
        const c = complianceColor(r.pct);
        return `
        <div style="display:flex; align-items:center; justify-content:space-between; padding:8px 0; border-top:1px solid var(--line);">
          <div style="display:flex; align-items:center; gap:10px;">
            <span style="width:10px;height:10px;border-radius:50%;background:${c.text};"></span>
            <span style="font-size:13px;font-weight:500;">${esc(r.nombre)}</span>
          </div>
          <div style="display:flex; align-items:center; gap:10px;">
            <span style="font-size:11px;color:var(--muted);">${r.hechas}/${r.total} tasks</span>
            <span style="font-size:12px;font-weight:600;padding:3px 10px;border-radius:12px;background:${c.bg};color:${c.text};">${r.pct}%</span>
          </div>
        </div>`;
      }).join('')}
    </div>
  </div>`;
}

function taskStatusLabel(estado){ return estado === 'hecha' ? 'Done' : estado === 'en_progreso' ? 'In progress' : 'Pending'; }

function renderTaskImpact(t){
  const imp = state.taskImpacts[t.id];
  if (imp === undefined) return `<div class="hint">Loading impact…</div>`;
  if (!imp || !imp.medible) return `<div class="hint">📊 Impact not measurable${imp && imp.motivo ? ': ' + esc(imp.motivo) : '.'}</div>`;
  const color = imp.recupero ? 'var(--teal)' : 'var(--coral)';
  const icon = imp.recupero ? '📈' : '📉';
  return `
    <div style="background:#FAFAF6;border:1px solid var(--line);border-radius:6px;padding:8px 10px;font-size:11.5px;">
      <b>${icon} Cycle close:</b> ${fmtNum(imp.baseline_ton_propias,2)} in ${monthLabel(imp.baseline_mes)} → ${fmtNum(imp.actual_ton_propias,2)} in ${monthLabel(imp.actual_mes)}
      &nbsp;<span style="font-weight:700;color:${color};">${imp.delta_ton>=0?'+':''}${fmtNum(imp.delta_ton,2)}${imp.delta_pct!==null?' ('+(imp.delta_pct>=0?'+':'')+fmtNum(imp.delta_pct,1)+'%)':''}</span>
      <div style="color:var(--muted);margin-top:2px;">${imp.recupero ? 'This effort did recover cargo.' : 'No cargo recovery visible in the data yet.'}</div>
    </div>`;
}

async function loadTaskImpact(taskId){
  if (state.taskImpacts[taskId] !== undefined) return;
  try {
    state.taskImpacts[taskId] = await api('/api/tasks/' + taskId + '/impacto');
  } catch (e) {
    state.taskImpacts[taskId] = { medible: false, motivo: e.message };
  }
  const el = document.querySelector(`[data-toggle-task-open="${taskId}"]`);
  if (el && state.openTaskId === taskId) renderMain();
}

// bajo cada cliente en Follow-up "By client", ver sus rutas ordenadas
// por tonelaje ("BSI FREIGHT" / "MEX-HKG 50,000ton 30%" / ...). Se pide
// una sola vez por cliente (cache en state.clientRoutesCache) y se
// vuelve a pedir solo si cambia la fuente de datos activa (ver
// switchDataSource/applyAerolineaVista, que limpian este cache junto
// con el resto de lo que depende de la fuente).
async function loadClientRoutes(cliente){
  if (state.clientRoutesCache[cliente] !== undefined) return;
  try {
    state.clientRoutesCache[cliente] = await api('/api/client-view/routes?cliente=' + encodeURIComponent(cliente));
  } catch (e) {
    state.clientRoutesCache[cliente] = [];
  }
  if (state.openClientGroup === cliente) renderMain();
}

// esta misma vista): "la idea es que solo aparezcan las rutas donde
// agregué la tarea" — mismo criterio de siempre (país destino, y
// aeropuerto de origen cuando la tarea lo especifica) que ya usa
// findTopRouteForClient() más arriba para ir en la otra dirección (de
// tarea a ruta), pero ahora devuelve LA ruta de ESA tarea puntual (no un
// filtro de la lista completa) — se usa para mostrar toneladas de mercado
// y market share en línea, dentro de la fila compacta de cada tarea (ver
// renderTaskRowCompact), en vez del panel aparte de rutas de antes.
function routeMatchForTask(t, allRutas){
  if (!allRutas || !allRutas.length || !t.pais) return null;
  return allRutas.find(r => {
    if ((t.pais||'').trim().toLowerCase() !== (r.destino_pais||'').trim().toLowerCase()) return false;
    if (t.origen && t.origen.trim()) {
      return (t.origen||'').trim().toLowerCase() === (r.origen_code||'').trim().toLowerCase();
    }
    return true;
  }) || null;
}
// Username -> nombre para mostrar (ej. quién asignó la tarea) — cae de
// vuelta al username tal cual si no se encuentra en el directorio de
// usuarios (state.users) o si todavía no se cargó.
function displayNameForUsername(username){
  if (!username) return '';
  const u = (state.users||[]).find(x => x.username === username);
  return u ? u.nombre : username;
}

// "todo en una fila": ruta + toneladas/MS% del período activo, el
// comentario, el nombre del vendedor, el desplegable de estado, y el botón
// de borrar — todo al lado, no en un acordeón que había que abrir como
// antes. Se usa tanto en las 2 vistas del admin (Follow-up "By Report/BD" y
// "By Vendedor") como en la vista propia del vendedor, regrupada por
// cliente.
//
// market share:
//  1) "el comentario... que vaya abajo de donde sale el market share" — la
//     ruta, las toneladas/MS%/temporalidad, y el comentario quedan
//     apilados en UNA sola columna (.task-row-route-comment), en vez de en
//     columnas separadas como antes.
//  2) "debe guardarse igual el market share la temporalidad" — mkt/ms% ya
//     NO se recalculan en vivo contra la fuente de datos activa
//     (routeMatchForTask/clientRoutesCache, que dependían de qué BD
//     estuviera elegida en el selector en ESE momento — esa dependencia
//     era justo el bug real de "la misma tarea se ve distinta según la
//     BD"). Ahora se usan los valores guardados EN LA TAREA al crearla
//     (t.market_share_pct/t.ton_mercado/t.periodo_label). Solo se cae de
//     vuelta al cálculo en vivo de antes para tareas viejas, creadas antes
//     de este cambio, que no tienen esos 3 campos guardados.
//  3) "que me permita ingresar un solo comentario... con un lápiz para
//     poder editarlo" — reemplaza el hilo apilado de comentarios del
//     por favor se que lo arreglamos pero hagamoslo como lo pedi ahora")
//     por edición directa de t.detalle (ver PATCH /api/tasks/{id}/detalle
//     y saveTaskDetalle). La respuesta del vendedor (comentarios_tarea) no
//     cambia — sigue siendo su propio hilo de respuestas.
function renderTaskRowCompact(t, { showCommentInput }){
  const hasPersistedStats = t.market_share_pct !== null && t.market_share_pct !== undefined;
  // aeropuerto puntual dentro del país (ver destino_aeropuerto,
  // openAddTaskModalFor), se muestra junto al país en vez de perderse.
  const destLabel = (t.pais || '?').toUpperCase() + (t.destino_aeropuerto ? ' · ' + t.destino_aeropuerto : '');
  let routeText, statsText;
  if (hasPersistedStats) {
    routeText = (t.origen || t.pais) ? `${esc(t.origen || '?')} &#8594; ${esc(destLabel)}` : '<span class="hint">No route</span>';
    statsText = `mkt ${fmtNum(t.ton_mercado,1)}t &nbsp;ms ${fmtPct(t.market_share_pct)}${t.periodo_label ? ' &nbsp;&middot;&nbsp; ' + esc(t.periodo_label) : ''}`;
  } else {
    const allRutas = state.clientRoutesCache[t.cliente];
    const match = routeMatchForTask(t, allRutas);
    routeText = match
      ? `${esc(match.origen_code || t.origen || '?')} &#8594; ${esc(match.destino_code || (t.pais||'').toUpperCase() || '?')}`
      : (t.origen || t.pais) ? `${esc(t.origen || '?')} &#8594; ${esc((t.pais||'?').toUpperCase())}` : '<span class="hint">No route</span>';
    statsText = match ? `mkt ${fmtNum(match.ton_mercado,1)}t &nbsp;ms ${fmtPct(match.market_share_pct)}` : '';
  }
  const comentarios = t.comentarios || [];
  // "cuando agrego un comentario... no se guarda, no sale nada" (pedido de
  // add_task_comment en main.py, usa user["nombre"]) — se compara contra
  // el nombre del vendedor, no contra su username.
  //
  // puede ingresar un solo comentario no más y que se pueda editar" — ya
  // no se muestra el hilo completo (podía traer varias filas viejas
  // apiladas del mismo autor, ver add_task_comment en tasks_db.py), solo
  // LA MÁS RECIENTE, con lápiz para editarla igual que el comentario del
  // gerente.
  const vendorThread = comentarios.filter(c => c.autor === t.vendedor_nombre);
  const lastVendorComment = vendorThread.length ? vendorThread[vendorThread.length - 1] : null;
  // "hecha", él ya no puede retroceder el estado — solo un admin/CEO
  // puede reabrirla. Esto es solo la parte de UX (deshabilitar el
  // desplegable); el permiso real se refuerza en el backend (ver PATCH
  // /api/tasks/{id} en main.py) para que no baste con editar el HTML a mano.
  const lockedForVendedor = isVendedor() && t.estado === 'hecha';
  // Mismo permiso que crear/borrar tareas (require_task_assigner en el
  // backend): admin, CEO o manager. Un manager solo verá estas tareas si
  // son de su equipo, ya que state.tasks viene acotado por el backend.
  const canEditDetalle = isAdmin() || isCeo() || isManager();
  const isEditingDetalle = state.editingTaskDetalle === t.id;
  const detalleDraft = state.taskDetalleDraft[t.id] !== undefined ? state.taskDetalleDraft[t.id] : t.detalle;
  const isEditingVendorComment = state.editingVendorComment === t.id;
  const vendorCommentDraft = state.taskCommentDraft[t.id] !== undefined ? state.taskCommentDraft[t.id] : (lastVendorComment ? lastVendorComment.texto : '');
  // Vendedor puede editar SU PROPIO comentario ya enviado (mismo permiso
  // que responder: es su tarea) — un admin/CEO viendo Follow-up solo lo
  // lee, no lo edita en su nombre.
  const canEditVendorComment = isVendedor() && showCommentInput;
  return `
  <div class="task-row" data-task-row="${t.id}">
    <div class="task-row-route-comment">
      <div style="font-weight:600;">${routeText}</div>
      ${statsText ? `<div class="hint" style="padding-top:1px;">${statsText}</div>` : ''}
    </div>
    <div class="task-row-manager-comment">
      ${isEditingDetalle ? `
        <textarea class="form-textarea" rows="2" id="taskDetalleEdit-${t.id}" style="font-size:11.5px;padding:5px 6px;">${esc(detalleDraft)}</textarea>
        <div style="display:flex;gap:6px;margin-top:4px;">
          <button class="btn btn-sm btn-primary" data-save-detalle="${t.id}">Save</button>
          <button class="btn btn-sm" data-cancel-detalle="${t.id}">Cancel</button>
        </div>
      ` : t.detalle ? `
        <div class="task-comment comment-manager" style="display:flex;align-items:flex-start;gap:5px;">
          <span style="flex:1;">${t.detalle_autor ? `<b>${esc(t.detalle_autor)}:</b> ` : ''}${esc(t.detalle)}</span>
          ${canEditDetalle ? `<button class="btn btn-sm" data-edit-detalle="${t.id}" title="Edit comment" style="padding:1px 6px;flex-shrink:0;">&#9998;</button>` : ''}
        </div>
        <div class="hint" style="padding-top:1px;">${t.detalle_fecha ? fmtDateTime(t.detalle_fecha) : fmtDateTime(t.fecha_creacion)}</div>
      ` : `
        <div class="task-comment comment-manager" style="display:flex;align-items:flex-start;gap:5px;">
          <span class="hint" style="flex:1;">Assigned by ${esc(t.asignado_por || '—')}</span>
          ${canEditDetalle ? `<button class="btn btn-sm" data-edit-detalle="${t.id}" title="Add comment" style="padding:1px 6px;flex-shrink:0;">&#9998;</button>` : ''}
        </div>
        <div class="hint" style="padding-top:1px;">${fmtDateTime(t.fecha_creacion)}</div>
      `}
    </div>
    <div class="task-row-vendor-comment">
      ${isEditingVendorComment ? `
        <textarea class="form-textarea" rows="2" id="taskVendorCommentEdit-${t.id}" style="font-size:11.5px;padding:5px 6px;">${esc(vendorCommentDraft)}</textarea>
        <div style="display:flex;gap:6px;margin-top:4px;">
          <button class="btn btn-sm btn-primary" data-save-vendor-comment="${t.id}">Save</button>
          <button class="btn btn-sm" data-cancel-vendor-comment="${t.id}">Cancel</button>
        </div>
      ` : lastVendorComment ? `
        <div class="task-comment comment-vendor" style="display:flex;align-items:flex-start;gap:5px;">
          <span style="flex:1;"><b>${esc(lastVendorComment.autor)}:</b> ${esc(lastVendorComment.texto)}</span>
          ${canEditVendorComment ? `<button class="btn btn-sm" data-edit-vendor-comment="${t.id}" title="Edit reply" style="padding:1px 6px;flex-shrink:0;">&#9998;</button>` : ''}
        </div>
        <div class="hint" style="padding-top:1px;">${fmtDateTime(lastVendorComment.fecha)}</div>
      ` : showCommentInput && isVendedor() ? `
        <div class="comment-add">
          <input type="text" placeholder="Reply..." id="commentInput-${t.id}" value="${esc(state.taskCommentDraft[t.id]||'')}">
          <button class="btn btn-sm" data-add-comment="${t.id}">Send</button>
        </div>
      ` : `<div class="hint" style="padding-top:0;">No reply from sales rep yet.</div>`}
    </div>
    <div class="task-row-vendor-name">${esc(t.vendedor_nombre)}</div>
    <div>
      <select class="task-row-status" data-set-estado="${t.id}" ${lockedForVendedor ? 'disabled title="Only a manager can reopen a task already marked Done"' : ''}>
        <option value="pendiente" ${t.estado==='pendiente'?'selected':''}>Pending</option>
        <option value="en_progreso" ${t.estado==='en_progreso'?'selected':''}>In progress</option>
        <option value="hecha" ${t.estado==='hecha'?'selected':''}>Done</option>
      </select>
      ${t.estado === 'hecha' && t.fecha_hecha ? `<div class="hint" style="padding-top:2px;">Done: ${fmtDateTime(t.fecha_hecha)}</div>` : ''}
    </div>
    ${(isAdmin() || isCeo() || isManager()) ? `<button class="btn btn-danger btn-sm" data-delete-task="${t.id}" title="Delete task">&#128465;</button>` : ''}
  </div>`;
}

// vía PATCH /api/tasks/{id}/detalle — NO usa el endpoint de comentarios_
// tarea (ese sigue siendo solo para la respuesta del vendedor).
async function saveTaskDetalle(taskId){
  const texto = (state.taskDetalleDraft[taskId] || '').trim();
  if (!texto) { alert('The comment cannot be empty.'); return; }
  try {
    await api('/api/tasks/' + taskId + '/detalle', { method: 'PATCH', body: JSON.stringify({ detalle: texto }) });
    state.editingTaskDetalle = null;
    delete state.taskDetalleDraft[taskId];
    await loadTasks(); renderMain();
  } catch (err) {
    alert('Could not save the comment: ' + err.message);
  }
}

// Se agrupa por cliente igual que la vista del admin (tasksGroupedByClient),
// en vez de una lista plana de todas las tareas mezcladas; cada tarea se
// muestra en la misma fila compacta (renderTaskRowCompact), con el input
// para que el vendedor deje su propio comentario/respuesta.
function renderSeguimientoVendedor(){
  const myTasks = state.tasks;
  const done = myTasks.filter(t => t.estado === 'hecha').length;
  const prog = myTasks.length ? Math.round(done/myTasks.length*100) : 0;
  const sortOldest = state.vendorTaskSortOrder === 'oldest';
  const sortTasks = (tasks) => [...tasks].sort((a, b) => {
    const da = new Date(a.fecha_creacion || 0).getTime();
    const db = new Date(b.fecha_creacion || 0).getTime();
    return sortOldest ? da - db : db - da;
  });
  // tareas no funciona no las ordena" — el Sort de antes solo reordenaba
  // las tareas DENTRO de una tarjeta de cliente ya abierta; como las
  // tarjetas en sí siempre quedaban en orden alfabético (tasksGroupedByClient),
  // si el vendedor no tenía ninguna tarjeta abierta (el caso normal, todas
  // se notaba en nada, parecía que el filtro no hacía nada. Ahora las
  // tareas de cada tarjeta se ordenan primero con el mismo criterio, y ESE
  // orden también decide en qué posición queda la tarjeta: la que tiene la
  // tarea más vieja/más nueva (según lo elegido) va primero — así el
  // cambio se ve altiro, sin tener que abrir nada.
  const groups = tasksGroupedByClient()
    .map(g => ({ cliente: g.cliente, tasks: sortTasks(g.tasks) }))
    .sort((a, b) => {
      const da = new Date(a.tasks[0]?.fecha_creacion || 0).getTime();
      const db = new Date(b.tasks[0]?.fecha_creacion || 0).getTime();
      return sortOldest ? da - db : db - da;
    });
  return `
  <div class="panel">
    <div class="panel-head">
      <span>My tasks</span>
      <div style="display:flex;align-items:center;gap:10px;">
        <div class="progress-wrap"><div class="progress-bar"><div class="progress-fill ${prog>=70?'ok':''}" style="width:${prog}%;"></div></div><div class="progress-label">${prog}% (${done}/${myTasks.length})</div></div>
        <button class="btn btn-primary" id="openTaskModalBtn" style="padding:3px 10px;font-size:11px;">+ Add task</button>
      </div>
    </div>
    <div style="padding:8px 10px 0;display:flex;align-items:center;gap:6px;">
      <label class="hint" for="vendorTaskSortOrder" style="margin:0;">Sort:</label>
      <select id="vendorTaskSortOrder" style="font-size:11px;padding:3px 6px;border-radius:6px;border:1px solid var(--line);">
        <option value="newest" ${!sortOldest?'selected':''}>Newest first</option>
        <option value="oldest" ${sortOldest?'selected':''}>Oldest first</option>
      </select>
    </div>
    <div style="padding:10px;">
      ${groups.length === 0 ? `<div class="empty" style="padding:0 6px;">You don't have any tasks assigned yet.</div>` : groups.map(g => {
        const isOpen = state.openClientGroup === g.cliente;
        const gDone = g.tasks.filter(t => t.estado === 'hecha').length;
        const gTasks = g.tasks; // ya viene ordenado (ver sortTasks arriba, aplicado antes del sort de tarjetas)
        return `
        <div class="vendor-card">
          <div class="vendor-top" data-toggle-client-group="${esc(g.cliente)}" style="cursor:pointer;">
            <div class="vendor-name">&#128100; ${esc(g.cliente)}</div>
            <div style="display:flex;align-items:center;gap:12px;">
              <span style="font-size:11px;color:var(--muted);">${gDone}/${g.tasks.length} done</span>
              <button class="btn" data-toggle-client-group="${esc(g.cliente)}">${isOpen?'&#9650;':'&#9660;'}</button>
            </div>
          </div>
          ${isOpen ? `<div style="padding:0 12px 12px;">${gTasks.map(t => renderTaskRowCompact(t, { showCommentInput: true })).join('')}</div>` : ''}
        </div>`;
      }).join('')}
    </div>
  </div>
  <div class="hint" style="margin-top:10px;">As a sales rep you can review your tasks, comment, mark your progress, and create new tasks for yourself. An admin, the CEO, or your manager can also assign you tasks.</div>
  <div class="soon-card" style="margin-top:14px;">&#128231; Send meeting minutes by email — coming soon</div>
  `;
}

function renderTasksByVendor(vendedorNombres){
  if (vendedorNombres.length === 0) return `<div class="empty">No sales reps yet. Create them in the Permissions tab.</div>`;
  return vendedorNombres.map(v => {
    const vTasks = state.tasks.filter(t => t.vendedor_username === v.username);
    const done = vTasks.filter(t => t.estado === 'hecha').length;
    const prog = vTasks.length ? Math.round(done/vTasks.length*100) : 0;
    const isOpen = state.openFichaVendor === v.username;
    return `
    <div class="vendor-card">

function tasksGroupedByOrigin(){
  const groups = new Map();
  state.tasks.forEach(t => {
    const origen = (t.origen || '').trim() || 'No origin specified';
    if (!groups.has(origen)) groups.set(origen, new Map());
    const byClient = groups.get(origen);
    if (!byClient.has(t.cliente)) byClient.set(t.cliente, []);
    byClient.get(t.cliente).push(t);
  });
  // orígenes reales primero, en orden alfabético — "No origin specified" siempre al final
  const origins = Array.from(groups.keys()).sort((a, b) => {
    if (a === 'No origin specified') return 1;
    if (b === 'No origin specified') return -1;
    return a.localeCompare(b);
  });
  return origins.map(origen => ({
    origen,
    clients: Array.from(groups.get(origen).entries())
      .sort((a, b) => a[0].localeCompare(b[0]))
      .map(([cliente, tasks]) => ({ cliente, tasks })),
  }));
}

function renderTasksByOrigin(){
  const groups = tasksGroupedByOrigin();
  if (groups.length === 0) return `<div class="empty">No tasks assigned to anyone yet.</div>`;
  return groups.map(g => {
    const isOpen = state.openOrigenGroup === g.origen;
    const totalTasks = g.clients.reduce((n, c) => n + c.tasks.length, 0);
    return `
    <div class="vendor-card">
      <div class="vendor-top" data-toggle-origen-group="${esc(g.origen)}" style="cursor:pointer;">
        <div class="vendor-name">&#9992;&#65039; ${esc(g.origen)}</div>

}

function tasksGroupedByClient(){

  return Array.from(groups.entries())
    .sort((a, b) => a[0].localeCompare(b[0]))

// Vista "By Report/BD" (reemplaza "By client"/"By origin & client"): 3
// niveles, BD -> origen donde se asignó la tarea -> cliente.
function tasksGroupedByFuente(){
  const groups = new Map(); // fuente -> Map(origen -> Map(cliente -> tasks[]))
  state.tasks.forEach(t => {
    const fuente = (t.fuente_nombre || '').trim() || 'Default database';
    const origen = (t.origen || '').trim() || 'No origin specified';
    if (!groups.has(fuente)) groups.set(fuente, new Map());
    const byOrigen = groups.get(fuente);
    if (!byOrigen.has(origen)) byOrigen.set(origen, new Map());
    const byCliente = byOrigen.get(origen);
    if (!byCliente.has(t.cliente)) byCliente.set(t.cliente, []);
    byCliente.get(t.cliente).push(t);
  });
  return Array.from(groups.entries()).sort((a, b) => a[0].localeCompare(b[0])).map(([fuente, byOrigen]) => ({
    fuente,
    origenes: Array.from(byOrigen.entries()).sort((a, b) => {
      if (a[0] === 'No origin specified') return 1;
      if (b[0] === 'No origin specified') return -1;
      return a[0].localeCompare(b[0]);
    }).map(([origen, byCliente]) => ({
      origen,
      clientes: Array.from(byCliente.entries()).sort((a, b) => a[0].localeCompare(b[0])).map(([cliente, tasks]) => ({ cliente, tasks })),
    })),
  }));
}

// clientes" — vista nueva "By Vendedor" (reemplaza "By salesperson"): 3
// niveles, Vendedor -> BD -> cliente.
function tasksGroupedByVendorFuente(vendedorNombres){
  return vendedorNombres.map(v => {
    const vTasks = state.tasks.filter(t => t.vendedor_username === v.username);
    const byFuente = new Map();
    vTasks.forEach(t => {
      const fuente = (t.fuente_nombre || '').trim() || 'Default database';
      if (!byFuente.has(fuente)) byFuente.set(fuente, new Map());
      const byCliente = byFuente.get(fuente);
      if (!byCliente.has(t.cliente)) byCliente.set(t.cliente, []);
      byCliente.get(t.cliente).push(t);
    });
    return {
      username: v.username, nombre: v.nombre, totalTasks: vTasks.length,
      fuentes: Array.from(byFuente.entries()).sort((a, b) => a[0].localeCompare(b[0])).map(([fuente, byCliente]) => ({
        fuente,
        clientes: Array.from(byCliente.entries()).sort((a, b) => a[0].localeCompare(b[0])).map(([cliente, tasks]) => ({ cliente, tasks })),
      })),
    };
  });
}

function renderRefreshCachePanel(){
  if (!isAdmin()) return '';
  const st = state.refreshCacheStatus;
  const manifest = st && st.manifest || {};
  const actualizadoEn = manifest.actualizado_en ? new Date(manifest.actualizado_en).toLocaleString() : null;
  const corriendo = !!(st && st.corriendo);
  const gcsOn = !!(st && st.gcs_configurado);
  const detalle = (st && st.detalle) || {};
  const errores = Object.entries(detalle).filter(([, v]) => !v.ok);
  return `
  <div class="panel" style="margin-bottom:16px;">
    <div class="panel-head">Data refresh (admin only)</div>
    <div class="panel-body" style="padding:16px;">
      <div style="font-size:12px;color:var(--muted);margin-bottom:10px;">
        ${gcsOn
          ? (actualizadoEn ? `Last full refresh: <b>${esc(actualizadoEn)}</b> — runs automatically every night, or on demand below.` : `No snapshot yet — click "Refresh data now" once to build the first one.`)
          : `Nightly automatic refresh isn't set up yet (GCS_BUCKET_NAME not configured) — the button below still works, it just won't persist between deploys/instances until that's set up.`}
        ${corriendo ? `<div style="margin-top:6px;color:var(--amberDark);font-weight:600;">Refreshing now — this can take several minutes…</div>` : ''}
        ${errores.length ? `<div style="margin-top:6px;color:var(--coral);">${errores.length} source(s) failed on the last run: ${esc(errores.map(([k]) => k).join(', '))}</div>` : ''}
      </div>
      <button class="btn btn-primary" id="refreshCacheBtn" ${corriendo ? 'disabled' : ''}>${corriendo ? 'Refreshing…' : 'Refresh data now'}</button>
      <div class="hint" style="margin-top:8px;">Re-reads every database from scratch (read-only) and updates what everyone sees — use this if you just updated a source and don't want to wait for tonight's automatic refresh.</div>

  </div>`;
}
