<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sales Dashboard — Cargo</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
  :root{
    /* Pedido del 16 sep: "usar el header del dataforce de sharon con
       sus colores" — --navy/--navy2/--sky son las únicas variables de marca
       que se tocan acá (se usan en TODA la app: header, botones primarios,
       tabs activos, badges — así que este cambio ya las alinea a todas sin
       tener que tocar cada componente por separado). --navy pasa a ser el
       mismo navy que usa el index.html de dataforce-home (#0d1f3c);
       --navy2 (hover/acento) pasa al azul de acento de Sharon (#1a56db,
       "--blue" en su index.html) en vez del navy más claro que tenía antes;
       --sky (texto claro sobre fondo navy, ej. el rol del usuario en el
       header) es nuevo — no existía un color así en dataforce-home, así que
       se dejó un celeste derivado de ese mismo azul de acento, con
       suficiente contraste sobre el navy nuevo. El resto de la paleta
       (colores de datos/gráficos: --teal, --coral, --amberDark, --paper,
       --card, --line, --ink, --muted) no cambia — esos no son "el header".
    */
    --navy:#0D1F3C; --navy2:#1A56DB; --sky:#8FB4EC; --amberDark:#8C6218;
    --teal:#1E7F72; --coral:#C4553B; --ink:#14213D; --muted:#64748B;
    --paper:#F7F5F0; --card:#FFFFFF; --line:#E4E1D8;
  }
  *{box-sizing:border-box;}
  body{margin:0; font-family:ui-sans-serif,system-ui,-apple-system,sans-serif; background:var(--paper); color:var(--ink);}
  /* Sharon pidió que los números NO vayan en fuente monoespaciada (de código) —
     que se vean con la misma fuente normal sans-serif que el resto del texto. */
  .mono{font-family:ui-sans-serif,system-ui,-apple-system,sans-serif; font-variant-numeric:tabular-nums;}

  #loginScreen{min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--navy); padding:16px;}
  .login-box{background:#fff; border-radius:12px; padding:36px 34px; width:340px; max-width:100%;}
  .login-brand{display:flex; align-items:center; gap:10px; margin-bottom:22px;}
  .login-icon{width:36px; height:36px; border-radius:8px; background:var(--sky); display:flex; align-items:center; justify-content:center; font-size:18px;}
  .login-title{font-size:14px; font-weight:700; letter-spacing:.03em;}
  .login-sub{font-size:11px; color:var(--muted); margin-top:1px;}
  .login-box label{font-size:11px; color:var(--muted); display:block; margin:14px 0 4px;}
  .login-box input{width:100%; font-size:13px; padding:9px 11px; border-radius:7px; border:1px solid var(--line);}
  .login-btn{width:100%; margin-top:20px; background:var(--navy); color:#fff; border:none; border-radius:7px; padding:10px; font-size:13px; font-weight:600; cursor:pointer;}
  .login-btn:hover{background:var(--navy2);}
  .login-error{font-size:12px; color:var(--coral); margin-top:12px; min-height:16px;}
  .login-hint{font-size:11px; color:var(--muted); margin-top:18px; padding-top:14px; border-top:1px solid var(--line); line-height:1.6;}

  #app{display:none;}
  header{background:var(--navy); padding:16px 24px; position:relative;}
  .headrow{display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px; position:relative;}
  .brand{display:flex; align-items:center; gap:12px;}
  .brand-icon{height:34px; border-radius:6px; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  .brand-title{color:#fff; font-size:13px; font-weight:600; letter-spacing:.04em;}
  .brand-sub{color:var(--sky); font-size:11px; margin-top:2px;}
  .hamburger-btn{background:transparent; border:none; cursor:pointer; padding:6px; display:flex; flex-direction:column; justify-content:center; gap:4px; margin-right:2px; flex-shrink:0;}
  .hamburger-btn span{display:block; width:20px; height:2px; background:#fff; border-radius:2px;}
  .hamburger-btn:hover span{background:var(--sky);}
  /* 16 sep: "poner el logo en el header" — la marca DATAFORCE de texto ya
     estaba, pero sin la "caja" con borde ni el ícono de link externo (↗)
     que se ve en el resto de Dataforce (la tarjeta de Data Sources en
     dataforce-home, por ejemplo) — se agrega el borde/padding y se
     reemplaza el glifo del ícono por un SVG chico (mismo trazo que el
     ícono "abrir en pestaña nueva" de siempre, no depende de ningún
     archivo de imagen). */
  .brand-df{display:flex; align-items:center; gap:6px; padding:4px 10px; border-radius:6px; border:1px solid rgba(255,255,255,.28);}
  .brand-df-icon{color:#fff; font-size:15px; line-height:1; display:flex; align-items:center;}
  .brand-df-text{color:#fff; font-size:14px; font-weight:700; letter-spacing:.06em;}
  .brand-title-center{flex:1 1 auto; min-width:0; text-align:center; color:var(--sky); font-size:12px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; pointer-events:none;}
  .brand{flex:0 0 auto;}
  .user-box{flex:0 0 auto;}
  @media (max-width: 900px){ .brand-title-center{display:none;} }
  .hamburger-menu{position:absolute; top:56px; left:24px; background:#fff; border-radius:8px; box-shadow:0 8px 24px rgba(0,0,0,.22); min-width:230px; padding:8px 0; z-index:80;}
  .hamburger-menu-title{font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:.08em; padding:8px 16px 6px;}
  .hamburger-menu-item{display:block; padding:9px 16px; color:var(--ink); text-decoration:none; font-size:13px;}
  .hamburger-menu-item:hover{background:var(--paper);}
  .hamburger-menu-note{font-size:11px; color:var(--muted); padding:6px 16px 2px; border-top:1px solid var(--line); margin-top:4px;}
  .user-box{display:flex; align-items:center; gap:10px; background:var(--navy2); padding:6px 12px; border-radius:6px;}
  .user-box .name{color:#fff; font-size:12px; font-weight:500;}
  .user-box .role{color:var(--sky); font-size:10px;}
  .logout-btn{background:transparent; border:1px solid #ffffff40; color:#fff; font-size:11px; padding:5px 10px; border-radius:6px; cursor:pointer;}
  .logout-btn:hover{background:#ffffff20;}
  .tabs{display:flex; gap:4px; margin-top:16px; flex-wrap:wrap;}
  .tab-btn{display:flex; align-items:center; gap:6px; padding:8px 14px; font-size:12px; font-weight:500; border-radius:6px 6px 0 0; border:none; cursor:pointer; background:transparent; color:#B7C0D0;}
  .tab-btn.active{background:var(--paper); color:var(--ink);}
  main{padding:20px 24px;}
  @media (max-width:640px){ main{padding:14px;} header{padding:14px;} }

  .filters{display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin-bottom:16px; background:var(--card); border:1px solid var(--line); border-radius:8px; padding:12px;}
  .filters select, .filters input{font-size:12px; padding:6px 8px; border-radius:6px; border:1px solid var(--line); background:#fff;}
  .filter-group{display:flex; align-items:center; gap:6px; background:#FAFAF6; border:1px solid var(--line); border-radius:8px; padding:5px 8px 5px 10px;}
  .filter-group-label{font-size:10px; text-transform:uppercase; letter-spacing:.03em; color:var(--muted); font-weight:600; margin-right:2px;}
  .spin{width:10px; height:10px; border:2px solid #ffffff60; border-top-color:#fff; border-radius:50%; display:inline-block; animation:spin .7s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .lock-badge{font-size:11px; padding:4px 8px; border-radius:6px; background:#EAF1F8; color:var(--navy); display:flex; align-items:center; gap:4px;}
  .seg{display:flex; border:1px solid var(--line); border-radius:6px; overflow:hidden;}
  .seg button{border:none; background:#fff; font-size:11px; padding:6px 10px; cursor:pointer; color:var(--muted);}
  .seg button.active{background:var(--navy); color:#fff;}
  .seg button + button{border-left:1px solid var(--line);}

  .kpis{display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:12px; margin-bottom:16px;}
  .kpi{background:#fff; border:1px solid var(--line); border-radius:8px; padding:12px;}
  .kpi-label{font-size:11px; text-transform:uppercase; letter-spacing:.03em; color:var(--muted);}
  .kpi-value{font-size:17px; font-weight:600; margin-top:4px;}

  .alerts-banner{background:#fff; border:1px solid var(--line); border-left:4px solid var(--amberDark); border-radius:8px; padding:12px 16px; margin-bottom:16px;}
  .alerts-title{font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.03em; color:var(--muted); margin-bottom:8px; display:flex; align-items:center; gap:6px;}
  .alert-item{display:flex; align-items:flex-start; gap:8px; font-size:12.5px; padding:5px 0; border-top:1px solid var(--line);}
  .alert-item:first-child{border-top:none;}
  .alert-dot{width:8px; height:8px; border-radius:50%; margin-top:4px; flex-shrink:0;}
  .alert-dot.alta{background:var(--coral);}
  .alert-dot.media{background:var(--amberDark);}
  .alert-dot.info{background:var(--teal);}
  .alerts-toggle{font-size:11px; color:var(--navy); cursor:pointer; text-decoration:underline; margin-top:6px;}

  /* ---------- panel lateral de análisis (drawer) ---------- */
  .drawer-overlay{position:fixed; inset:0; background:rgba(20,33,61,0.35); z-index:40; opacity:0; pointer-events:none; transition:opacity .2s;}
  .drawer-overlay.open{opacity:1; pointer-events:auto;}
  .drawer{position:fixed; top:0; right:0; height:100vh; width:400px; max-width:92vw; background:#fff; z-index:41; box-shadow:-8px 0 24px rgba(0,0,0,.15); transform:translateX(100%); transition:transform .25s ease; display:flex; flex-direction:column;}
  .drawer.open{transform:translateX(0);}
  .drawer-head{background:var(--navy); color:#fff; padding:16px 18px; display:flex; align-items:center; justify-content:space-between; flex-shrink:0;}
  .drawer-head b{font-size:13px;}
  .drawer-close{background:transparent; border:none; color:#fff; font-size:18px; cursor:pointer; line-height:1;}
  .drawer-body{padding:16px 18px; overflow-y:auto; flex:1;}
  .analysis-fab{display:flex; align-items:center; gap:8px; background:var(--navy); color:#fff; border:none; border-radius:8px; padding:10px 16px; font-size:12px; font-weight:600; cursor:pointer; margin-bottom:16px;}
  .analysis-fab:hover{background:var(--navy2);}
  .analysis-fab .dot{width:8px; height:8px; border-radius:50%; background:var(--coral);}

  /* ---------- gráficos visuales (gauge / dona) ---------- */
  .visual-row{display:grid; grid-template-columns:repeat(auto-fit, minmax(240px,1fr)); gap:12px; margin-bottom:16px;}
  .visual-card{background:#fff; border:1px solid var(--line); border-radius:8px; padding:12px; text-align:center;}
  .visual-card-title{font-size:11px; text-transform:uppercase; letter-spacing:.03em; color:var(--muted); margin-bottom:4px;}
  .gauge-wrap{position:relative; height:130px;}
  .donut-wrap{position:relative; height:190px;}
  .donuts-global{display:grid; grid-template-columns:1fr 1fr; gap:20px;}
  @media (max-width:700px){ .donuts-global{grid-template-columns:1fr;} }

  .grid2{display:grid; grid-template-columns:1.5fr 1fr; gap:16px; margin-bottom:16px;}
  @media (max-width:900px){ .grid2{grid-template-columns:1fr;} }
  .panel{background:#fff; border:1px solid var(--line); border-radius:8px; overflow:hidden;}
  .panel-head{padding:10px 16px; font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.03em; color:var(--muted); border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:6px;}
  .panel-body{max-height:460px; overflow-y:auto;}
  table{width:100%; border-collapse:collapse; font-size:13px;}
  thead th{position:sticky; top:0; background:#fff; text-align:right; padding:8px 12px; font-size:11px; text-transform:uppercase; letter-spacing:.02em; color:var(--muted); cursor:pointer; user-select:none;}
  thead th:first-child{text-align:left; cursor:default;}
  tbody tr.row{border-top:1px solid var(--line); cursor:pointer;}
  tbody tr.row:hover{background:#FAFAF6;}
  tbody tr.row.selected{background:#EAF1F8;}
  tbody td{padding:8px 12px;}
  td.num{text-align:right; font-family:ui-sans-serif,system-ui,-apple-system,sans-serif; font-variant-numeric:tabular-nums; font-size:12px; white-space:nowrap;}
  .country-name{font-size:12px; font-weight:500;}
  .country-cont{font-size:10px; color:var(--muted); margin-left:4px;}
  .expand-wrap{background:#FAFAF6; padding:6px 16px 12px; max-height:420px; overflow-y:auto;}
  .expand-title{font-size:10px; text-transform:uppercase; letter-spacing:.03em; color:var(--muted); margin-bottom:6px; display:flex; justify-content:space-between; align-items:center;}
  /* 16 sep: 2 columnas de tarifa nuevas (Mkt Rate / Cathay Rate, ver
     detailHeaderRow) — las 5 columnas numéricas quedan todas del mismo
     ancho (80px) y centradas en vez de 90/90/60 a la derecha, para que se
     vea prolijo con 2 columnas más. */
  .client-grid{display:grid; grid-template-columns:1fr repeat(5, 80px) 128px; gap:8px; font-size:12px; padding:6px 0; border-bottom:1px solid var(--line); align-items:center; cursor:pointer;}
  .client-grid .row-actions{display:flex; gap:4px; justify-content:flex-end;}
  .client-grid:last-child{border-bottom:none;}
  .client-grid:hover{background:#F0EDE4;}
  .client-grid .num{text-align:center; font-family:ui-sans-serif,system-ui,-apple-system,sans-serif; font-variant-numeric:tabular-nums; color:var(--muted);}
  .client-grid .num.b{color:var(--ink); font-weight:500;}
  /* 16 sep: pestaña admin "Airline Destinations" (pedido de Sharon) — una
     columna por aerolínea, cada una con su buscador de "agregar" arriba y
     la lista actual (agrupada continente -> país) debajo; se apilan en
     columnas más angostas cuando no entran todas en el ancho disponible.
     Pedido del 16 sep, viendo la pestaña real con LATAM en 136
     destinos: "hacer mas grande paa que no tenga que hacer scroll" — antes
     cada columna tenía su propio scroll interno (max-height:560px), lo que
     obligaba a hacer scroll DENTRO de una columna angosta para ver toda la
     lista. Se saca ese límite: cada columna crece con su contenido y el
     scroll queda a cargo de la página completa (normal en una pantalla de
     administración, no es algo que se consulte a cada rato).  El buscador
     de "agregar destino" SÍ mantiene su propio scroll (es un desplegable
     chico de resultados, no la lista principal).*/
  .destino-aerolinea-grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(210px, 1fr)); gap:14px; align-items:start;}
  .destino-aerolinea-col{border:1px solid var(--line); border-radius:8px; background:#FAFAF6; display:flex; flex-direction:column;}
  .destino-aerolinea-col-head{font-size:12px; font-weight:600; padding:10px 12px; border-bottom:1px solid var(--line); background:#fff; border-radius:8px 8px 0 0;}
  .destino-aerolinea-search{padding:8px 10px; border-bottom:1px solid var(--line); position:relative;}
  .destino-aerolinea-search-results{margin-top:6px; max-height:180px; overflow-y:auto; border:1px solid var(--line); border-radius:6px; background:#fff;}
  .destino-aerolinea-search-item{display:flex; align-items:center; justify-content:space-between; gap:6px; padding:5px 8px; font-size:11px; border-bottom:1px solid var(--line);}
  .destino-aerolinea-search-item:last-child{border-bottom:none;}
  .destino-aerolinea-list{padding:6px 10px 10px;}
  .destino-aerolinea-continente{font-size:10px; text-transform:uppercase; letter-spacing:.03em; color:var(--muted); font-weight:600; margin:10px 0 2px;}
  .destino-aerolinea-continente:first-child{margin-top:2px;}
  .destino-aerolinea-pais{font-size:10.5px; font-weight:600; color:var(--navy2); margin:6px 0 2px;}
  .destino-aerolinea-item{display:flex; align-items:center; justify-content:space-between; gap:6px; font-size:11.5px; padding:3px 0; border-bottom:1px solid #EFEBDF;}
  .destino-aerolinea-item:last-child{border-bottom:none;}
  .destino-aerolinea-remove{background:none; border:none; color:var(--coral); font-size:14px; cursor:pointer; line-height:1; padding:2px 4px;}
  .destino-aerolinea-remove:hover{background:#F0C7BC; border-radius:4px;}
  .destino-aerolinea-remove:disabled{opacity:.4; cursor:not-allowed;}
  .chip{font-size:9px; font-family:ui-monospace,monospace; background:var(--navy); color:var(--sky); padding:2px 6px; border-radius:4px;}
  .chip.role-ceo{background:#5C2A8C;}
  .chip.role-vendedor{background:var(--amberDark);}
  .opp-row{display:flex; align-items:center; justify-content:space-between; padding:10px 16px; border-top:1px solid var(--line); gap:10px;}
  .opp-row:first-child{border-top:none;}
  .opp-title{font-size:12px; font-weight:500;}
  .opp-sub{font-size:11px; color:var(--muted); margin-top:2px;}
  .btn{font-size:11px; padding:6px 10px; border-radius:6px; border:1px solid var(--line); background:#fff; cursor:pointer; display:flex; align-items:center; gap:4px; white-space:nowrap;}
  .btn-sm{font-size:10px; padding:4px 8px; justify-content:center;}
  .btn:hover{background:#FAFAF6;}
  .btn-primary{background:var(--navy); color:#fff; border:none;}
  .btn-primary:hover{background:var(--navy2);}
  .btn-disabled{opacity:.5; cursor:not-allowed;}
  .btn-disabled:hover{background:#fff;}
  .btn-danger{color:var(--coral); border-color:#F0C7BC;}
  .empty{padding:24px; text-align:center; font-size:12px; color:var(--muted);}
  .loading{padding:24px; text-align:center; font-size:12px; color:var(--muted);}
  .vendor-card{border:1px solid var(--line); border-radius:8px; margin-bottom:8px;}
  .vendor-top{display:flex; align-items:center; justify-content:space-between; padding:10px 12px; flex-wrap:wrap; gap:8px;}
  .vendor-name{font-size:13px; font-weight:500;}
  .progress-wrap{width:90px;}
  .progress-bar{height:6px; border-radius:4px; background:var(--line); overflow:hidden;}
  .progress-fill{height:100%; background:var(--amberDark);}
  .progress-fill.ok{background:var(--teal);}
  .progress-label{font-size:10px; color:var(--muted); text-align:right; margin-top:2px;}
  .task-item{border-top:1px solid var(--line); padding:8px 0;}
  .task-item:first-child{border-top:none;}
  .task-head{display:flex; align-items:flex-start; gap:8px; font-size:12px; cursor:pointer;}
  .task-check{width:14px; height:14px; margin-top:2px; flex-shrink:0;}
  .task-comments{margin:6px 0 0 22px; padding-left:10px; border-left:2px solid var(--line);}
  .task-comment{font-size:11.5px; color:var(--muted); padding:3px 0;}
  .task-comment b{color:var(--ink);}
  .comment-add{display:flex; gap:6px; margin:6px 0 0 22px;}
  .comment-add input{flex:1; font-size:11px; padding:5px 8px; border-radius:6px; border:1px solid var(--line);}
  .task-row{display:flex; align-items:flex-start; gap:10px; padding:9px 0; border-top:1px solid var(--line); font-size:11.5px; flex-wrap:wrap;}
  .task-row:first-child{border-top:none;}
  .task-row-route{flex:0 0 130px;}
  .task-row-route-comment{flex:1 1 200px; min-width:180px;}
  .task-row-manager-comment, .task-row-vendor-comment{flex:1 1 170px; min-width:150px;}
  .task-row-vendor-name{flex:0 0 90px; color:var(--muted); padding-top:2px;}
  .task-row-status{flex:0 0 112px; font-size:11px; padding:5px 6px; border-radius:6px; border:1px solid var(--line); align-self:flex-start;}
  .task-row .task-comment{padding:0;}
  .task-row .comment-add{margin:4px 0 0;}
  .comment-manager{color:var(--navy2);}
  .comment-vendor{color:var(--amberDark);}
  .comment-manager b, .comment-vendor b{color:inherit;}
  .form-group{margin-bottom:12px;}
  .form-label{font-size:11px; color:var(--muted); display:block; margin-bottom:4px;}
  .form-input, .form-select, .form-textarea{width:100%; font-size:12px; padding:7px 9px; border-radius:6px; border:1px solid var(--line); font-family:inherit;}
  .form-textarea{resize:vertical;}
  .hint{font-size:11px; color:var(--muted); padding-top:4px;}
  .error-banner{background:#FBE7E2; color:var(--coral); font-size:12px; padding:10px 14px; border-radius:8px; margin-bottom:16px;}
  .soon-badge{font-size:9px; background:#EEE; color:var(--muted); padding:2px 6px; border-radius:4px; margin-left:6px; text-transform:none; letter-spacing:0;}
  .soon-card{background:#FAFAF6; border:1px dashed var(--line); border-radius:8px; padding:16px; text-align:center; color:var(--muted); font-size:12px;}
  .comment-card{border:1px solid var(--line); border-radius:8px; padding:12px; margin-bottom:10px;}
  .comment-card .who{font-size:12px; font-weight:600;}
  .comment-card .when{font-size:10px; color:var(--muted); margin-left:6px; font-weight:400;}
  .comment-card .txt{font-size:12.5px; margin-top:6px; line-height:1.5;}
  .users-table td, .users-table th{font-size:12px;}
  .responsive-table-wrap{overflow-x:auto;}

  /* ---------- modal de detalle de cliente ---------- */
  .modal-overlay{position:fixed; inset:0; background:rgba(20,33,61,0.45); z-index:60; display:flex; align-items:center; justify-content:center; padding:16px;}
  .modal-box{background:#fff; border-radius:10px; width:1100px; max-width:96vw; max-height:88vh; overflow-y:auto;}
  .modal-head{background:var(--navy); color:#fff; padding:16px 20px; border-radius:10px 10px 0 0; display:flex; align-items:center; justify-content:space-between;}
  .modal-head .title{font-size:14px; font-weight:700;}
  .modal-head .sub{font-size:11px; color:var(--sky); margin-top:2px;}
  .modal-close{background:transparent; border:none; color:#fff; font-size:20px; cursor:pointer; line-height:1;}
  .modal-body{padding:18px 20px;}
  .modal-kpis{display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:18px;}
  @media (max-width:560px){ .modal-kpis{grid-template-columns:1fr 1fr;} }

  /* ---------- multi-selección de aeropuertos (checkboxes) ---------- */
  .multi-select-wrap{position:relative; display:inline-block;}
  .multi-select-btn{font-size:12px; padding:6px 10px; border-radius:6px; border:1px solid var(--line); background:#fff; cursor:pointer; display:flex; align-items:center; gap:6px;}
  .multi-select-btn:disabled{opacity:.5; cursor:not-allowed;}
  .multi-select-panel{position:absolute; top:calc(100% + 4px); left:0; background:#fff; border:1px solid var(--line); border-radius:8px; box-shadow:0 6px 20px rgba(0,0,0,.12); padding:8px; z-index:30; min-width:220px; max-height:260px; overflow-y:auto;}
  .multi-select-panel label{display:flex; align-items:center; gap:6px; font-size:12px; padding:4px 6px; border-radius:4px; cursor:pointer;}
  .multi-select-panel label:hover{background:#FAFAF6;}
  .multi-select-panel .divider{border-top:1px solid var(--line); margin:4px 0;}


  /* Red de seguridad: si algo se desborda por un pixel de más, que se
     recorte en vez de estirar toda la página con scroll horizontal.
     No afecta el scroll horizontal propio de las tablas (abajo). */
  html, body{ overflow-x:hidden; }
  .responsive-table-wrap{ -webkit-overflow-scrolling:touch; }

  @media (max-width:768px){
    .modal-body{padding:14px;}
    .modal-head{padding:14px 16px;}
    .panel-head{padding:9px 12px;}
    table{font-size:12px;}
    thead th, tbody td{padding:6px 8px;}
  }

  @media (max-width:600px){
    /* Barra de módulos: en vez de amontonarse en varias filas, se
       desliza horizontal — patrón estándar de apps en celular. */
    .tabs{flex-wrap:nowrap; overflow-x:auto; -webkit-overflow-scrolling:touch; padding-bottom:2px;}
    .tab-btn{flex-shrink:0; padding:7px 11px; font-size:11.5px;}

    .kpis{grid-template-columns:repeat(2,1fr); gap:8px;}
    .kpi{padding:10px;}
    .kpi-value{font-size:15px;}

    .visual-row{grid-template-columns:1fr;}
    .modal-kpis{grid-template-columns:1fr 1fr; gap:8px;}

    .filters{padding:10px; gap:6px;}
    .filter-group{padding:4px 6px 4px 8px;}

    /* .client-grid: cada fila de cliente/aeropuerto dentro de un país.
       Siempre son los mismos elementos en el mismo orden (nombre,
       5 números —Mkt Ton/Cathay Ton/MS%/Mkt Rate/Cathay Rate, sumadas
       las 2 de tarifa el 16 sep—, acciones — ver renderClientsListHtml /
       renderAirportsListHtml / detailHeaderRow), así que se puede
       reacomodar por posición sin tocar el HTML/JS que la genera: el
       nombre pasa a ocupar toda la fila de arriba, los 5 números quedan
       en filas de 3 columnas iguales debajo (la última queda con 2 y un
       hueco, se ve bien igual), y las acciones (Detail / +Add task) en
       su propia fila al final. */
    .client-grid{grid-template-columns:repeat(3,1fr); row-gap:3px; padding:8px 0;}
    .client-grid > *:first-child{grid-column:1/-1; font-size:12.5px;}
    .client-grid > *:last-child{grid-column:1/-1;}
    .client-grid .row-actions{justify-content:flex-start; flex-wrap:wrap; margin-top:3px;}

    .opp-row{flex-wrap:wrap;}
    .task-row-route{flex-basis:100%;}
    .task-row-status{flex-basis:100%; align-self:stretch;}

    /* Modales a pantalla completa en celular — más fácil de leer y
       de cerrar que una ventana angosta flotando en medio de la pantalla. */
    .modal-overlay{padding:0;}
    .modal-box{border-radius:0; width:100vw; max-width:100vw; max-height:100vh;}

    .login-box{padding:26px 22px;}
  }
</style>

<!-- Pantalla en blanco (sin login, sin formulario) mientras se resuelve el
     inicio de sesión automático que llega desde el cuadrado "Market Data"
     de Dataforce (?email=...). El script de abajo la activa de forma
     síncrona, antes de que el navegador llegue a pintar #loginScreen, para
     que no se vea ni un instante el formulario de login/hint al entrar
     desde ahí. Si el auto-login falla, tryEnterFromDataforce() la oculta y
     vuelve a mostrar #loginScreen con el motivo del error. -->
<div id="ssoRedirectScreen" style="display:none; min-height:100vh; align-items:center; justify-content:center; background:var(--navy); padding:16px;"></div>
<script>
  (function(){
    try {
      if (new URLSearchParams(window.location.search).get('email')) {
        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('ssoRedirectScreen').style.display = 'flex';
      }
    } catch (e) {}
  })();
</script>

// Los países de origen calculados en vivo (source_geo_summary, ver Data
// Sources) vienen tal cual están en la base — algunos en MAYÚSCULAS
// (ej. "HONG KONG") — esto los deja en formato título para que se lean
// igual de prolijos que el resto de los nombres de país de la app.
function titleCase(s){
  return String(s||'').toLowerCase().replace(/\b\w/g, c => c.toUpperCase());
}

// El reporte ahora también se presenta a gente que habla inglés — formato
// estándar en inglés: coma para miles, punto para el decimal (ej. 1,234.56).
function numComma(n, dec){
  dec = dec === undefined ? 0 : dec;
  const v = (n === null || n === undefined || isNaN(n)) ? 0 : n;
  return new Intl.NumberFormat('en-US', { minimumFractionDigits: dec, maximumFractionDigits: dec }).format(v);
}
function fmtTon(kg, dec){ dec = dec===undefined?1:dec; return numComma((kg||0)/1000, dec); }
function fmtNum(n, dec){ dec = dec===undefined?0:dec; return numComma(n||0, dec); }
// antes cada valor traía "/kg" pegado (ej. "$1.26/kg") — se ve repetitivo
// en una tabla con muchas columnas de meses; ahora la unidad va una sola
// vez en el encabezado de la fila/columna (ver LBL_MKT_RATE/LBL_CX_RATE)
// y acá el valor queda limpio, solo con el "$".
function fmtRate(n){ return isFinite(n) && n > 0 ? "$" + numComma(n, 2) : "—"; }
function fmtPct(n){ return numComma(n||0, 2) + "%"; }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function fmtDateTime(iso){ try { return new Date(iso).toLocaleString('en-US', {day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit'}); } catch(e){ return iso; } }
const MONTH_LABELS = {"01":"Jan","02":"Feb","03":"Mar","04":"Apr","05":"May","06":"Jun","07":"Jul","08":"Aug","09":"Sep","10":"Oct","11":"Nov","12":"Dec"};
function monthLabel(m){ const [y,mm] = m.split('-'); return (MONTH_LABELS[mm]||mm) + " " + y; }
// que se compara es el MISMO (ej. "Ene 2025" contra "Ene 2026" — el caso
// típico de Year over year), no repetir el nombre del mes dos veces —
// mostrar "Jan 2025/2026" en vez de "Jan 2025 / Jan 2026". Cuando los
// meses son distintos (ej. comparando "últimos 3 meses" contra "los 3
// anteriores", que caen en meses de calendario distintos), se deja el
// formato de siempre (los dos nombres completos), porque ahí no hay
// nombre en común que se pueda acortar sin perder información.
function comparativoAxisLabel(monthA, monthB){
  if (monthA && monthB) {
    const mma = monthA.split('-')[1], mmb = monthB.split('-')[1];
    if (mma === mmb) {
      const ya = monthA.split('-')[0], yb = monthB.split('-')[0];
      return `${MONTH_LABELS[mma] || mma} ${ya}/${yb}`;
    }
    return `${monthLabel(monthA)} / ${monthLabel(monthB)}`;
  }
  return monthLabel(monthA || monthB) || '';
}
// para mostrar un rango de meses de forma compacta ("Ene 2025 – Jun 2025")
// en vez de listar cada mes uno por uno — se usa en el detalle de período
// de Comparativo, donde antes salía "enero 2025, febrero 2025, marzo
// 2025..." para un rango que puede tener hasta 12 meses seguidos.
function monthRangeLabel(months){
  if (!months || !months.length) return '';
  if (months.length === 1) return monthLabel(months[0]);
  return monthLabel(months[0]) + ' – ' + monthLabel(months[months.length-1]);
}
// comparativo en vez de que diga BEFORE NOW que diga 2025 2026" — se usa
// en las leyendas de los 2 gráficos de Comparativo (drawComparativoTrendChart/
// drawComparativoRateChart) en vez de las etiquetas genéricas "(Before)"/
// "(Now)", mostrando el año real de cada período (o el rango de años, si
// el período elegido cruza de uno a otro).
function shortPeriodLabel(months){
  if (!months || !months.length) return '';
  const years = Array.from(new Set(months.map(m => m.split('-')[0])));
  return years.length === 1 ? years[0] : (years[0] + '–' + years[years.length-1]);
}

// Excel en español espera ';' como separador de columnas (porque la coma
// ya es el separador decimal) — con esto el archivo se abre directo en
// columnas bien separadas, sin tener que usar el asistente de importación.
function exportToCSV(filename, headers, rows){
  const esc_csv = v => {
    const s = String(v);
    // como los números ahora llevan coma de miles (formato inglés), TODO
    // campo que pueda traer una coma se encierra en comillas — así el CSV
    // no se corta en columnas de más al abrirlo en Excel.
    if (s.includes(',') || s.includes('"') || s.includes('\n')) return '"' + s.replace(/"/g, '""') + '"';
    return s;
  };
  const lines = [headers.map(esc_csv).join(',')];
  rows.forEach(r => lines.push(r.map(esc_csv).join(',')));
  const csv = '\uFEFF' + lines.join('\r\n'); // BOM para que Excel reconozca tildes/ñ
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

async function api(path, opts){
  opts = opts || {};
  const headers = Object.assign({}, opts.headers || {});
  if (state.token) headers["Authorization"] = "Bearer " + state.token;
  if (state.dataSource) headers["X-Fuente-Datos"] = state.dataSource;
  if (state.aerolineaVista) headers["X-Aerolinea-Vista"] = state.aerolineaVista;
  if (opts.body && !(opts.body instanceof FormData)) headers["Content-Type"] = "application/json";
  // Antes un pedido que se quedaba pegado (ej. una consulta muy lenta a una
  // base de DATAFORCE grande) dejaba la pantalla en "Cargando..." para
  // siempre, sin ningún error — fetch() no tiene timeout por defecto. Con
  // esto, después de un buen rato se corta solo y aparece como un error
  // normal (con su botón de reintentar), en vez de quedar colgado sin
  // explicación.
  //
  // como 3 veces". Causa real: el backend solo lee CADA base la PRIMERA
  // vez que alguien la abre en esa corrida del servidor — esa primera
  // lectura (CSV grande o, si no hay cache local, la base MySQL real en
  // vivo) puede demorar bastante más que los 90s que había antes acá, y el
  // backend usa un candado (_load_lock, ver get_df() en main.py) para que
  // dos pedidos en paralelo no la lean dos veces — así que un reintento (o
  // un refresh de la página) NO acelera nada: solo hace otro pedido nuevo
  // que se pone a esperar detrás del mismo candado. Si esos 90s se cumplían
  // ANTES de que la carga real terminara, el navegador cortaba el pedido
  // igual — y como encima el usuario refrescaba pensando que estaba
  // trabado, se sentía como "nunca carga". Subir el límite a 4 minutos le
  // da tiempo real a esa primera lectura para terminar sola; una vez que
  // termina, esa misma base queda en memoria y el resto del día es
  // instantánea (ver "Cache local de DATAFORCE" en el README — correr
  // refrescar_cache.py de antemano deja esa primera lectura sobre un CSV
  // local en vez de la base MySQL en vivo, así que ni siquiera se nota).
  const controller = new AbortController();
  const timeoutId = setTimeout(() => controller.abort(), 240000);
  let res;
  try {
    res = await fetch(API + path, Object.assign({}, opts, { headers, signal: controller.signal }));
  } catch (err) {
    if (err.name === "AbortError") throw new Error("Se demoró más de 4 minutos y se cortó — puede que la fuente elegida tenga mucho volumen de datos y esta sea la primera vez que se abre en esta sesión del servidor. Prueba de nuevo (no hace falta refrescar la página entera) o elige otra fuente.");
    throw err;
  } finally {
    clearTimeout(timeoutId);
  }
  if (res.status === 401) { logout("Your session expired, please log in again."); throw new Error("401"); }
  if (!res.ok) {
    const body = await res.json().catch(() => ({}));
    throw new Error(body.detail || ("Error " + res.status));
  }
  return res.json();
}

// el servidor puede tardar unos segundos justo al arrancar (procesando el
// CSV) — en vez de mostrar un error de una, reintenta un par de veces con
// una pequeña espera, así una demora de arranque no se ve como una falla.
function sleep(ms){ return new Promise(r => setTimeout(r, ms)); }
async function withRetry(fn, { retries = 3, delayMs = 1500 } = {}){
  let lastErr;
  for (let i = 0; i <= retries; i++){
    try { return await fn(); }
    catch (err) {
      lastErr = err;
      if (err.message === "401") throw err; // no reintentar si la sesión expiró
      if (i < retries) await sleep(delayMs);
    }
  }
  throw lastErr;
}

// tiene la vista restringida a un continente (lockedContinente), ese es
// el único valor posible, sin importar lo que haya en tabFilters.
function effContinentes(scope){
  const locked = lockedContinente();

function continentesParam(scope){

async function setTab(t){
  state.tab = t;
  renderTabs();
  updateDataSourceSwitcherVisibility();
  if (t === 'comentarios') {
    document.getElementById('main').innerHTML = '<div class="loading">Loading comments…</div>';
    const tasks = [loadReportComments()];
    if (isAdmin() || isCeo()) tasks.push(loadUsersDirectory());
    await Promise.all(tasks);
  } else if (t === 'fuentes') {
    // normalmente ya está cargado desde el login (loadDataSourcesUI), pero
    // por si acaso (permiso cambiado recién, o llegó vacío) se refresca acá.
    if (!state.dataSources.length) {
      document.getElementById('main').innerHTML = '<div class="loading">Loading data sources…</div>';
      await loadDataSourcesUI();
    }
    // botón "Refresh data now" — solo se pide este estado si es admin (el
    // endpoint igual lo exige, ver require_admin en main.py).
    if (isAdmin()) await loadRefreshCacheStatus();
  } else if (t === 'permisos' && isAdmin()) {
    document.getElementById('main').innerHTML = '<div class="loading">Loading users…</div>';
    await Promise.all([loadUsers(), loadAllAirlines(), loadAllDataSources(), loadAirlines()]);
  } else if (t === 'reporte') {
    // pestañas (ver makeTabFilters), volver a Sales Report después de
    // cambiar el filtro en OTRA pestaña (Comparativo/Global/Client View)
    // tiene que traer los datos con el filtro nuevo, no seguir mostrando
    // lo que ya estaba cargado desde antes de ese cambio.
    renderMain();
    await refreshReportData();
    renderMain();
    // lleva al perfil de follow up, lo asigno pero cuando vuelvo a esta
    // vista... me sale bugueado, tengo que cerrar y abrir de nuevo" — el
    // renderMain() de arriba vuelve a pintar la fila de un país expandido
    // (state.expandedCountry) con el placeholder "Loading…" (ver la tabla
    // "BY COUNTRY"), pero nada volvía a pedirle los datos reales a
    // loadDetailContent() para esa fila — antes de que Sales Report
    // siempre recargara al volver a entrar (el cambio de arriba, mismo
    // día), esto no se notaba porque renderMain() no se repetía sin datos
    // nuevos detrás. Mismo arreglo que ya existía para el filtro de
    // Destino y el selector de aerolínea (ver más abajo, wireDestinoFilterBar
    // y applyAerolineaVista): si había un país expandido, se le vuelve a
    // pedir su detalle.
    if (state.expandedCountry) {
      const rowData = state.countries.find(r => r.Des_Country_Code === state.expandedCountry);
      await loadDetailContent(state.expandedCountry, rowData ? rowData.Des_Country : state.expandedCountry);
    }
    return;
  } else if (t === 'comparativo') {
    renderMain();
    await loadComparativo();
    return;
  } else if (t === 'global') {
    renderMain();
    await loadGlobalData();
    renderMain();
    return;
  } else if (t === 'cliente') {
    renderMain();
    if (!state.clienteViewList.length) await loadClienteViewList();
    // el nombre de cliente elegido (clienteViewSelected) es propio de esta
    // pestaña, no se comparte — pero si ya había uno elegido de una visita
    // anterior, sus datos hay que refrescarlos con el filtro compartido
    // actual (puede haber cambiado en otra pestaña mientras tanto).
    if (state.clienteViewSelected) await loadClienteViewData();
    renderMain();
    return;
  } else if (t === 'cumplimiento') {
    renderMain();
    await loadComplianceData();
    renderMain();
    return;
  } else if (t === 'destinosAerolinea' && isAdmin()) {
    renderMain();
    await loadDestinosAerolineaData();
    renderMain();
    return;
  }
  renderMain();
}

// "Market Data" de Dataforce (la app de Sharon) — el link llega con
// ?email=correo@gsaforce.com. Se chequea ACÁ, antes que la sesión
// guardada de siempre, porque si alguien hace clic en el cuadrado
// estando ya logueado en el navegador como otra persona, tiene que
// entrar como quien dice el link, no quedarse con la sesión vieja.
async function tryEnterFromDataforce(){
  const params = new URLSearchParams(window.location.search);
  const email = params.get('email');
  if (!email) return false;
  // saca '?email=...' de la barra de direcciones apenas se lee — así el
  // link no queda visible/guardable en el historial o en un marcador.
  window.history.replaceState({}, document.title, window.location.pathname);
  try {
    const data = await api('/api/sso-login?' + new URLSearchParams({ email }).toString(), { method: 'GET' });
    sessionStorage.setItem('panel_token', data.token);
    sessionStorage.setItem('panel_user', JSON.stringify({ username: email, nombre: data.nombre, rol: data.rol, continente_permitido: data.continente_permitido, puede_gestionar_cumplimiento: data.puede_gestionar_cumplimiento }));
    state.token = data.token; state.user = JSON.parse(sessionStorage.getItem('panel_user'));
    await boot();
    return true;
  } catch (err) {
    document.getElementById('ssoRedirectScreen').style.display = 'none';
    document.getElementById('loginScreen').style.display = 'flex';
    document.getElementById('loginError').textContent = err.message || "Could not sign you in automatically from Dataforce. You can try username/password, or contact an administrator.";
    document.getElementById('loginRedirectHint').style.display = 'none';
    document.getElementById('loginPasswordFallback').style.display = 'block';
    document.getElementById('togglePasswordLogin').style.display = 'none';
    return true; // ya se mostró el motivo en pantalla — no seguir con la sesión guardada vieja
  }
}

async function tryResumeSession(){
  const savedMsg = sessionStorage.getItem('panel_login_msg');
  if (savedMsg) { document.getElementById('loginError').textContent = savedMsg; sessionStorage.removeItem('panel_login_msg'); }
  if (await tryEnterFromDataforce()) return;
  const token = sessionStorage.getItem('panel_token');
  const user = sessionStorage.getItem('panel_user');
  if (token && user) {
    state.token = token; state.user = JSON.parse(user);
    try { await boot(); return; } catch (e) {}
  }
}

async function boot(){
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('ssoRedirectScreen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  document.getElementById('userName').textContent = state.user.nombre;
  const roleLabel = state.user.rol === 'admin' ? 'Admin (full access)' : state.user.rol === 'ceo' ? 'CEO' : state.user.rol === 'manager' ? 'Manager (task assignment)' : ('Sales Rep · ' + (state.user.continente_permitido || ''));
  document.getElementById('userRole').textContent = roleLabel;
  if (lockedContinente()) { Object.values(state.tabFilters).forEach(f => { f.continentes = [lockedContinente()]; }); }
  renderTabs();
  await loadDataSourcesUI();
  await loadCoreData();
}

// de inicio y de fin en el selector... por ahora solo dicen la fecha de
// inicio" — arma la etiqueta con el rango completo cuando el backend
// pudo calcularlo (ver anio_inicio/anio_fin en /api/data-sources); si
// una fuente puntual no trajo el dato (BD real caída, etc.) se muestra
// solo el nombre, sin inventar un año.
function sourceLabelWithRange(s){
  if (s.anio_inicio && s.anio_fin) {
    return s.anio_inicio === s.anio_fin ? `${s.nombre} (${s.anio_inicio})` : `${s.nombre} (${s.anio_inicio}–${s.anio_fin})`;
  }
  return s.nombre;
}

// Trae la lista de bases de DATAFORCE (con su descripción) para TODOS los
// para el botón "i"/pestaña Data Sources, aunque no pueda cambiar de base.
// El SELECTOR de base (dataSourceBox) sigue siendo solo CEO/admin: un
// vendedor nunca lo ve — sigue viendo siempre la fuente que ve todo el
// mundo por defecto, restringida además por su aerolínea/cliente
// permitidos si los tiene asignados.
async function loadDataSourcesUI(){
  const box = document.getElementById('dataSourceBox');
  try { state.dataSources = await api('/api/data-sources'); } catch (e) { state.dataSources = []; }
  if (!(isAdmin() || isCeo())) { if (box) box.style.display = 'none'; updateDataSourceSwitcherVisibility(); return; }
  if (!box) return;
  if (!state.dataSources.length) { box.style.display = 'none'; return; } // nada configurado todavía en DATA_SOURCES
  box.style.display = '';
  // del selector" — antes había una opción en blanco (sin X-Fuente-Datos,
  // ver api() más arriba) que dejaba el backend elegir; ahora el selector
  // siempre muestra y selecciona una BD real, apenas carga la lista.
  if (!state.dataSource || !state.dataSources.some(s => s.id === state.dataSource)) {
    state.dataSource = state.dataSources[0].id;
  }
  const sel = document.getElementById('dataSourceSelect');
  sel.innerHTML = state.dataSources.map(s => `<option value="${esc(s.id)}" ${state.dataSource===s.id?'selected':''}>${esc(sourceLabelWithRange(s))}</option>`).join('');
  sel.onchange = () => switchDataSource(sel.value);
  updateDataSourceSwitcherVisibility();
}

// Recarga todo lo que ya estaba cacheado por pestaña, para que la próxima
// vez que se visite cada una pida los datos de nuevo en vez de mostrar los

// (applyAerolineaVista), porque ambos cambian qué cuenta como "propio" en
// TODA la data ya cargada (toneladas, tarifa, MS%).
async function reloadAfterScopeChange(){
  state.comparativoData = null;
  // pestaña Comparativo con un rango de fechas activo, a veces quedaba un
  // gráfico "pegado" con datos de la base anterior y etiquetas genéricas
  // "Month 1, Month 2...", mientras la tabla de arriba ya decía "Not enough
  // data to compare" — solo se arreglaba recargando la página. Causa: acá
  // se limpiaba comparativoData pero NO comparativoTrendA/comparativoTrendB
  // (los datos que arma el gráfico), así que drawComparativoTrendChart()
  // seguía dibujando esos datos viejos aunque ya no tuvieran relación con
  // los períodos (periodo_a/periodo_b) de la nueva base.
  state.comparativoTrendA = [];
  state.comparativoTrendB = [];
  state.globalCountries = [];
  state.clienteViewList = [];
  state.complianceLoaded = false;
  state.clientRoutesCache = {}; // rutas por cliente (Follow-up "By client") — dependen de la fuente activa, ver loadClientRoutes
  // filtros" — cada base puede tener países/aeropuertos/zonas distintos
  // (o ninguno de los que estaban elegidos), así que TODOS los filtros de
  // Reporte/Comparativo/Vista global/Vista por cliente (mismo objeto
  // compartido, ver resetReportFilterState) se reinician acá, no solo
  // Zona GSA Force. loadCoreData() de abajo ya recarga el reporte con los
  // filtros ya reseteados, así que no hace falta llamar refreshReportData()
  // aparte.
  resetReportFilterState();
  await loadCoreData();
  // "Shipper View" (ver TABS) sigue a LBL_CLIENT, que loadCoreData() ya
  // recalculó arriba (actualizarAerolineaActiva) — sin este renderTabs()
  // el botón de la pestaña se quedaba con el nombre de la base ANTERIOR
  // hasta que la persona cambiara de pestaña y volviera.
  renderTabs();
  // loadComparativo() no está entre las tareas de loadCoreData() a propósito
  // (se pide solo al entrar a esa pestaña, para no demorar el login/cambio
  // de base con un cálculo que la mayoría de las veces nadie va a mirar).
  // Pero si la persona YA estaba en Comparativo cuando cambió de base, hay
  // que refrescarlo ahora mismo — si no, con las líneas de arriba se ve
  // "Not enough data to compare" y ningún gráfico hasta que cambie de
  // pestaña o vuelva a tocar un filtro.
  if (state.tab === 'comparativo') {
    await loadComparativo();
  }
  // parada en "Compliance" cuando cambió de base o de "view as", el
  // selector de aerolínea del formulario "New compliance rule" seguía
  // ofreciendo solo la aerolínea de la base ANTERIOR (o solo Cathay) —
  // porque esa lista se pedía una sola vez al ENTRAR a la pestaña
  // (loadComplianceData(), ver setTab), no cada vez que cambia la base.
  // Con esto se refresca también sin necesidad de salir y volver a entrar
  // a Compliance.
  if (state.tab === 'cumplimiento') {
    await loadComplianceData();
  }
}

// Cambiar de base de datos (CEO/admin).
async function switchDataSource(newSource){
  state.dataSource = newSource;
  // Cada base puede mezclar aerolíneas distintas (o ninguna) — la
  // aerolínea elegida en la base anterior con el selector "ver como esta
  // aerolínea" ya no tiene sentido acá (ver renderAirlineViewBox()).
  state.aerolineaVista = "";
  await reloadAfterScopeChange();
}

// fuente activa mezcla varias aerolíneas (Logcomex/Isidora/Aduana Perú) y
// quien mira no tiene una aerolinea_permitida propia (CEO/admin), esto le
// deja elegir cuál de las aerolíneas reales de esa tabla quiere ver como
// si fuera la propia — así OWN TON/OWN REV/MS% dejan de estar siempre en 0.
async function applyAerolineaVista(newVista){
  state.aerolineaVista = newVista;
  await reloadAfterScopeChange();
}

// Arma (o esconde) el selector de "ver como esta aerolínea" en el
// encabezado, junto al de base de datos — ver actualizarAerolineaActiva(),
// que deja en state.airlineSelectorAvailable si la fuente activa mezcla
// varias aerolíneas y el usuario no tiene una asignada. Las opciones salen
// de /api/airlines, que YA devuelve la lista de aerolíneas reales de la
// fuente activa (se usa también para el selector de Permisos).
async function renderAirlineViewBox(){
  const box = document.getElementById('airlineViewBox');
  if (!box) return;
  if (!state.airlineSelectorAvailable) { box.style.display = 'none'; return; }
  try { state.airlineViewOptions = await api('/api/airlines'); } catch (e) { state.airlineViewOptions = []; }
  if (!state.airlineViewOptions.length) { box.style.display = 'none'; return; }
  box.style.display = '';
  const sel = document.getElementById('airlineViewSelect');
  sel.innerHTML = `<option value="">View as: none (Own = 0)</option>` +
    state.airlineViewOptions.map(a => `<option value="${esc(a.id)}" ${state.aerolineaVista===a.id?'selected':''}>View as: ${esc(a.nombre)}</option>`).join('');
  sel.onchange = () => applyAerolineaVista(sel.value);
  updateDataSourceSwitcherVisibility();
}

async function loadCoreData(){
  // alcanza a cambiar de base (o hacer otra acción que llame loadCoreData)
  // mientras la anterior todavía está en vuelo — sin esto, la más vieja
  // podía terminar DESPUÉS que la más nueva y dejar la pantalla mostrando
  // datos de la base equivocada.
  const myRequestId = ++state.coreDataRequestSeq;
  const main = document.getElementById('main');
  // tengo que refrescar 3 veces"): un mensaje fijo no deja ver si sigue
  // trabajando o quedó pegado, así que refrescar parecía la única salida
  // — pero refrescar NO ayuda (la carga sigue corriendo igual del lado
  // del servidor) y de hecho puede sumar una espera nueva atrás de la que
  // ya estaba en curso. Este contador de segundos, visible todo el
  // tiempo que dura la carga, muestra que sigue viva sin necesidad de
  // adivinar.
  const _loadStartedAt = Date.now();
  main.innerHTML = `<div class="loading">Loading data… (<span id="loadElapsedSecs">0</span>s)<br><span style="font-size:11px;opacity:.75;">If this is the first time this database is opened since the server started, this can take several minutes — it's reading straight from the real database, not stuck. Please don't refresh the page: refreshing doesn't make this faster, it just queues a second wait behind this one. It finishes on its own and is instant after that.</span></div>`;
  const _loadElapsedTimer = setInterval(() => {
    const el = document.getElementById('loadElapsedSecs');
    if (!el) { clearInterval(_loadElapsedTimer); return; } // la pantalla ya cambió (terminó o se fue a otra vista)
    el.textContent = Math.round((Date.now() - _loadStartedAt) / 1000);
  }, 1000);

  try {
    // actualizarAerolineaActiva() va en el mismo Promise.all (no depende
    // de trend/countries ni al revés) y ANTES del primer renderMain() —
    // así los encabezados "CX Ton"/"CX Rate" ya salen correctos (o "AV",
    // o genéricos) desde el primer dibujo, no un instante después con un
    // parpadeo.
    const [trendAll, countriesAll] = await withRetry(() => Promise.all([
      api('/api/trend'),
      api('/api/countries'),
      actualizarAerolineaActiva(),
    ]));
    if (myRequestId !== state.coreDataRequestSeq) return; // quedó vieja, otra carga más nueva ya está en curso
    state.months = trendAll.map(r => r.month).sort();
    state.countryOptionsAll = countriesAll;
    state.trend = trendAll;
    state.trendScope = { type: "global", label: "Global" };
    await renderAirlineViewBox();

    // estas tres son independientes entre sí: se piden todas a la vez en vez
    // de una por una, que era la causa principal de la demora al entrar.
    const bootTasks = [ loadTasks(), loadAlerts(), refreshReportData(), loadGlobalData(), loadOrigins(), loadAerolineasDestino() ];
    if (isAdmin() || isCeo()) bootTasks.push(loadUsers()); // necesario para el selector de vendedor en Seguimiento (admin y CEO pueden asignar)
    // SU equipo — en vez de state.users con TODOS los vendedores (como
    // arriba), acá se llena con /api/my-team, que el backend ya devuelve
    // acotado a sus supervisados. Así todo el código que ya lee
    // state.users (selector de "+ Nueva tarea", agrupado "Por vendedor" en
    // Seguimiento, etc.) funciona sin cambios, mostrando solo su equipo.
    else if (isManager()) bootTasks.push(loadMyTeam());
    await withRetry(() => Promise.all(bootTasks));
    if (myRequestId !== state.coreDataRequestSeq) return;
    renderMain();
  } catch (err) {
    if (myRequestId !== state.coreDataRequestSeq) return; // una carga más nueva ya está resolviendo esto, no pisarla con un error viejo
    // antes esto dejaba la pantalla pegada en "Cargando..." para siempre sin
    // explicar nada — ahora se ve el error real y un botón para reintentar.
    main.innerHTML = `
      <div class="error-banner" style="display:flex;align-items:center;justify-content:space-between;gap:12px;">
        <div>Could not load data: ${esc(err.message || 'unknown error')}. Check that the backend is still running.</div>
        <button class="btn" id="retryBootBtn">Retry</button>
      </div>`;
    const retryBtn = document.getElementById('retryBootBtn');
    if (retryBtn) retryBtn.onclick = () => loadCoreData();
  }
}

function windowsFor(period){
  const n = state.months.length;
  if (period === "last1") return state.months.slice(-1);
  if (period === "last3") return state.months.slice(-3);
  if (period === "last6") return state.months.slice(-6);
  if (period === "all") return state.months.slice();
  // Mismo criterio que 'ytd' en /api/comparativo (main.py): todos los
  // meses del año del mes MÁS RECIENTE que trae la base (no del año
  // calendario real de hoy — con datos históricos/demo eso podría no
  // filtro de fecha quede en YTD por defecto en todas las pestañas.
  if (period === "ytd") {
    if (!n) return [];
    const lastYear = state.months[n-1].slice(0, 4);
    return state.months.filter(m => m.startsWith(lastYear + "-"));
  }
  return [period];
}
// límites reales del rango de fechas personalizado, calculados desde los
// meses que realmente trae la base de datos (antes el <input type="date">
// no tenía min/max, así que el calendario nativo del navegador abría en el
// mes actual — agosto 2026 — sin ninguna pista de que hay datos desde 2023).
function dataDateBounds(){
  if (!state.months.length) return { min: "", max: "" };
  const first = state.months[0]; // ej. '2023-01'
  const last = state.months[state.months.length - 1]; // ej. '2026-06'
  const min = first + "-01";
  const [y, m] = last.split("-").map(Number);
  const max = new Date(Date.UTC(y, m, 0)).toISOString().slice(0, 10); // último día de 'last'
  return { min, max };
}
// 'dateFrom'/'dateTo' son opcionales — solo se usan cuando period==='custom'
// y por defecto son los del Reporte de ventas (state.dateFrom/dateTo); la
// Vista por cliente (ver renderClienteView) pasa los suyos propios
// (clienteViewDateFrom/To) porque tiene su período elegido aparte.
function periodLabel(period, dateFrom, dateTo){
  const w = windowsFor(period);
  const rango = w.length > 1 ? `${monthLabel(w[0])} – ${monthLabel(w[w.length-1])}` : (w.length === 1 ? monthLabel(w[0]) : '');
  if (period === "last1") return `Last month (${rango})`;
  if (period === "last3") return `Last 3 months (${rango})`;
  if (period === "last6") return `Last 6 months (${rango})`;
  if (period === "all") return `Total (${rango})`;
  if (period === "ytd") return `YTD (${rango})`;
  if (period === "custom") return "Range " + ((dateFrom!==undefined?dateFrom:state.dateFrom)||'?') + " to " + ((dateTo!==undefined?dateTo:state.dateTo)||'?');
  return monthLabel(period);
}
// Etiqueta corta del período global activo (state.period) — usada en el
// wireframes del 3 sep: "(mkt 13,520T ms/0.1. YTD)") para no repetir el
// texto largo de periodLabel() en un espacio tan chico.
function compactPeriodLabel(){
  const map = { ytd: "YTD", last1: "Last month", last3: "Last 3 months", last6: "Last 6 months", all: "Total", custom: "Custom range" };
  return map[state.period] || periodLabel(state.period);
}

// filtros" — al cambiar de base, un país/aeropuerto/zona elegido en la BD
// anterior podía no existir en la nueva (ej. filtro puesto en "México" y
// la nueva base no tiene México como destino) y la pantalla quedaba
// pegada en "No data for this filter" sin ninguna pista de por qué.
// Factoreado de resetFilters() (que además dispara la recarga y el
// redibujo) para poder reusar SOLO el reseteo de campos desde
// reloadAfterScopeChange() (ver más abajo), que ya llama a loadCoreData()
// — que a su vez ya recarga el reporte — así no se duplica el pedido al
// servidor.
//
// tabFilters.reporte/comparativo/global/cliente son el MISMO objeto (ver
// makeTabFilters() / state.tabFilters más arriba), así que resetear acá
// alcanza para las 4 pestañas de una sola vez.
function resetReportFilterState(){
  const f = state.tabFilters.reporte;
  f.continentes = lockedContinente() ? [lockedContinente()] : [];
  f.paises = [];
  f.destAeropuerto = [];
  f.origenPais = "Todos"; f.origenAeropuertos = [];
  f.aerolineaDestino = "Todos"; state.reporteCountryOptions = [];
  f.airportOptionsForFilter = [];
  state.search = "";
  state.period = "ytd"; 
  state.dateFrom = ""; state.dateTo = "";
  state.expandedCountry = null;
  state.expandedAirport = null;
  state.sortKey = "mkt_w"; state.sortDir = "desc"; // ver mismo comentario en el 'state' inicial, más arriba
  const ecsReset = effContinentes('reporte');
  state.trendScope = { type: "global", label: ecsReset.length === 0 ? "Global" : ecsReset.join(" + ") };
}

async function resetFilters(){
  resetReportFilterState();
  await refreshReportData();
  renderMain();
}

// Igual que resetFilters() pero genérico para las otras 3 pestañas con
// filtros (Comparativo, Vista global, Vista por cliente) — cada una pasa
// su 'scope', cómo recargar sus datos, y un 'extra' opcional para resetear
// campos propios de esa pestaña que no viven en tabFilters (ej. el período
// de comparación, o el cliente buscado en Vista por cliente).
async function clearScopeFilters(scope, reload, extra){
  const f = state.tabFilters[scope];
  Object.assign(f, makeTabFilters());
  if (lockedContinente()) f.continentes = [lockedContinente()];
  if (extra) extra();
  await reload();
  renderMain();
}

function aeropuertoParam(scope){
  return state.tabFilters[scope].destAeropuerto.length ? state.tabFilters[scope].destAeropuerto.join(',') : null;
}
// multi-select (ver renderCountryMultiSelectPanel) — este helper arma el
// param 'pais' como lista separada por comas, igual que aeropuertoParam
// de arriba. El backend (filter_df en data_helpers.py) ya sabe separar
// esa lista con .isin(...), así que no hace falta tocar cada endpoint.
function paisParam(scope){
  return state.tabFilters[scope].paises.length ? state.tabFilters[scope].paises.join(',') : null;
}
// array (multi-select), este helper arma 'origen_aeropuerto' como lista
// separada por comas. filter_df() (data_helpers.py) ya sabe separar esa
// lista con .isin(...) para origen_aeropuerto, no hace falta tocar el backend.
function origenAeropuertoParam(scope){
  return state.tabFilters[scope].origenAeropuertos.length ? state.tabFilters[scope].origenAeropuertos.join(',') : null;
}

async function refreshReportData(){
  const myRequestId = ++state.reportRequestSeq;
  state.reportBusy = true;
  updateBusyIndicator();

  const f = state.tabFilters.reporte;
  const params = new URLSearchParams();
  const ecParam = continentesParam('reporte');
  if (ecParam) params.set('continente', ecParam);
  if (paisParam('reporte')) params.set('pais', paisParam('reporte'));
  if (aeropuertoParam('reporte')) params.set('aeropuerto', aeropuertoParam('reporte'));
  if (f.origenPais !== "Todos") params.set('origen_pais', f.origenPais);
  if (origenAeropuertoParam('reporte')) params.set('origen_aeropuerto', origenAeropuertoParam('reporte'));
  // "Destinos <aerolínea>" (ver /api/aerolineas-destino y filter_df en
  // data_helpers.py). Mismo patrón que el resto de filtros de esta función.
  if (f.aerolineaDestino !== "Todos") params.set('aerolinea_destino', f.aerolineaDestino);
  if (state.period === "custom") {
    if (state.dateFrom) params.set('date_from', state.dateFrom);
    if (state.dateTo) params.set('date_to', state.dateTo);
  } else {
    params.set('months', windowsFor(state.period).join(','));
  }

  try {
    // de ventas es mas lento... el bug que queda en loading... nada se
    // soluciona". El batch anterior juntó estos 5 pedidos en un
    // Promise.all pensando que "en paralelo" es más rápido — medido
    // directamente contra el servidor, es AL REVÉS: son 5 funciones de
    // pandas que hacen trabajo pesado (filtrar+agregar cientos de miles
    // de filas), y Python solo corre una de esas a la vez (GIL) sin
    // importar cuántos pedidos HTTP lleguen juntos — lanzarlos en
    // paralelo solo los hace turnarse por el procesador CON overhead de
    // cambio de contexto encima, y si justo en ese momento alguien hace
    // clic para expandir un país (como en el video), ese clic se suma a
    // la cola y se siente como que quedó pegado en "Loading…". Y esto
    // explica por qué justo el Reporte de Ventas —que dispara 4-5 de
    // estos pedidos pesados juntos en cada cambio de filtro— se sentía
    // mucho más lento que Vista Global, que no dispara tantos a la vez.
    //
    // Arreglo real: /api/report-bundle (ver main.py) filtra los datos UNA
    // sola vez en el servidor y calcula summary+countries+top-clients+
    // opportunities+trend(global) ahí mismo — un solo pedido al servidor
    // en vez de 5 compitiendo por el procesador. Si el gráfico de
    // tendencia está mostrando un país/cliente/aeropuerto puntual
    // (trendScope drilled-in, no el global del reporte completo), ese
    // trend puntual se sigue pidiendo aparte — igual que antes— porque el
    // bundle solo sabe calcular el trend "global".
    const wantsGlobalTrend = state.trendScope.type === "global";
    const [bundle, trend] = await Promise.all([
      api('/api/report-bundle?' + params.toString()),
      wantsGlobalTrend ? Promise.resolve(null) : api(buildTrendUrl()),
    ]);
    // si mientras esperábamos el usuario ya cambió el filtro de nuevo, esta
    // respuesta quedó vieja — se descarta en vez de pisar el resultado más
    // reciente (esto era lo que a veces se sentía como "se pega": una
    // respuesta lenta y antigua llegando después de una más nueva).
    if (myRequestId !== state.reportRequestSeq) return;
    state.summary = bundle.summary;
    state.countries = bundle.countries;
    state.opportunities = bundle.opportunities;
    state.crossSellOpportunities = bundle.cross_sell_opportunities || [];
    state.topClientsData = bundle.top_clients;
    state.reporteSummaryVersion++; // ver comentario junto a la declaración, arriba
    const trendResult = wantsGlobalTrend ? bundle.trend : trend;
    // el gráfico ahora respeta el mismo período/rango de fechas elegido arriba
    // (antes se quedaba siempre en los 13 meses completos sin importar el filtro)
    state.trend = trendResult;
    state.reportError = null;
  } catch (err) {
    // ESTE catch es la causa real del "se queda pegado": antes, si un fetch
    // fallaba (red lenta, sesión vencida, error del backend), la excepción
    // cortaba refreshReportData() a mitad de camino — y como el finally de
    // abajo SÍ se ejecuta pero el renderMain() vive en el handler que llamó
    // a esta función, esa llamada nunca llegaba a completarse: el filtro
    // quedaba aplicado en el <select> pero la tabla/gráfico seguían
    // mostrando los datos de ANTES del cambio. Cambiar de pestaña y volver
    // no arreglaba nada porque state.summary/countries nunca se habían
    // actualizado. Ahora el error se absorbe acá para que la función nunca
    // "explote" a medio camino.
    console.error('No se pudo refrescar el reporte:', err);
    if (myRequestId === state.reportRequestSeq) state.reportError = err.message || 'Unknown error';
  } finally {
    if (myRequestId === state.reportRequestSeq) { state.reportBusy = false; updateBusyIndicator(); }
  }
}

function updateBusyIndicator(){
  const el = document.getElementById('busyIndicator');
  if (el) el.style.display = state.reportBusy ? 'inline-flex' : 'none';
}

function periodParams(){
  const p = new URLSearchParams();
  if (state.period === "custom") {
    if (state.dateFrom) p.set('date_from', state.dateFrom);
    if (state.dateTo) p.set('date_to', state.dateTo);
  } else if (state.period !== "all") {
    p.set('months', windowsFor(state.period).join(','));
  }
  return p;
}
// ventas y el botón "Detail" deben mostrar SIEMPRE el año hasta la fecha
// (YTD), sin importar qué período/rango esté elegido en el filtro general
// (que sí sigue afectando la tabla/summary). Mismo criterio de "YTD" que
// windowsFor('ytd') (año del mes más reciente que trae la base activa, no
// necesariamente el año calendario real de hoy).
function ytdParams(){
  const p = new URLSearchParams();
  p.set('months', windowsFor('ytd').join(','));
  return p;
}
// Helper compartido: si hay un país expandido en la tabla de Reporte de
// ventas, vuelve a pedir su detalle con los filtros actuales — evita que la
// fila expandida quede mostrando datos viejos tras cambiar un filtro que no
// pasaba por wireDestinoFilterBar (período, origen, rango de fechas
// filtros si tengo abierto alguno de los paises no se actualiza".
async function refreshExpandedCountryDetailIfOpen(){
  if (!state.expandedCountry) return;
  const rowData = state.countries.find(r => r.Des_Country_Code === state.expandedCountry);
  await loadDetailContent(state.expandedCountry, rowData ? rowData.Des_Country : state.expandedCountry);
}

// Separado de refreshTrendForCurrentScope() (4 sep, batch 14) para poder
// construir la URL sin pedirla todavía. refreshReportData() (más arriba)
// SOLO llama a esto (y pide /api/trend aparte) cuando el gráfico está
// mostrando un país/cliente/aeropuerto puntual (trendScope drilled-in) —
// para el caso normal (trendScope "global"), /api/report-bundle (batch
// 15, ver main.py) ya devuelve el trend global calculado junto con todo
// lo demás, así que no hace falta este pedido aparte. Los otros 3
// llamados a refreshTrendForCurrentScope() (al seleccionar un
// cliente/aeropuerto puntual para ver su tendencia, sin refrescar el
// reporte completo) siguen usando la versión de abajo tal cual, que sí
// pide y asigna en un solo paso.
function buildTrendUrl(){
  const f = state.tabFilters.reporte;
  const trendScope = state.trendScope;
  const p = ytdParams();
  if (f.origenPais !== "Todos") p.set('origen_pais', f.origenPais);
  if (origenAeropuertoParam('reporte')) p.set('origen_aeropuerto', origenAeropuertoParam('reporte'));
  if (f.aerolineaDestino !== "Todos") p.set('aerolinea_destino', f.aerolineaDestino);
  if (trendScope.type === "cliente") {
    p.set('pais', trendScope.paisCode); p.set('cliente', trendScope.cliente);
    return '/api/trend?' + p.toString();
  } else if (trendScope.type === "aeropuerto") {
    p.set('aeropuerto', trendScope.code);
    return '/api/trend?' + p.toString();
  } else if (trendScope.type === "pais") {
    p.set('pais', trendScope.code);
    return '/api/trend?' + p.toString();
  } else {
    const ecParam = continentesParam('reporte');
    if (ecParam) p.set('continente', ecParam);
    if (paisParam('reporte')) p.set('pais', paisParam('reporte'));
    if (aeropuertoParam('reporte')) p.set('aeropuerto', aeropuertoParam('reporte'));
    return '/api/trend' + (p.toString() ? ('?' + p.toString()) : '');
  }
}
async function refreshTrendForCurrentScope(){
  state.trend = await api(buildTrendUrl());
}

// un país (dentro del detalle expandido de "By country") tiene que respetar
// el filtro de Origen y el período activos en el Reporte de ventas — antes
// solo filtraba por país/aeropuerto DESTINO, ignorando Origen y período por
// completo (por eso aparecían clientes/toneladas que no correspondían).
async function loadClients(paisCode){
  const f = state.tabFilters.reporte;
  const p = periodParams();
  p.set('pais', paisCode);
  if (aeropuertoParam('reporte')) p.set('aeropuerto', aeropuertoParam('reporte'));
  if (f.origenPais !== "Todos") p.set('origen_pais', f.origenPais);
  if (origenAeropuertoParam('reporte')) p.set('origen_aeropuerto', origenAeropuertoParam('reporte'));
  if (f.aerolineaDestino !== "Todos") p.set('aerolinea_destino', f.aerolineaDestino);
  return api('/api/clients?' + p.toString());
}
// extraParams (opcional): querystring adicional a agregar (usado por el
// detalle expandido para respetar Origen/período — ver loadDetailContent).
// El llamado de populateDestinationFilters() más abajo NO pasa extraParams
// a propósito: ese solo puebla el desplegable de aeropuertos del filtro de
// Destino, que debe seguir mostrando TODOS los aeropuertos del país
// independientemente del filtro de Origen activo.
async function loadAirports(paisCode, extraParams){
  let url = '/api/airports?pais=' + encodeURIComponent(paisCode);
  if (extraParams) url += '&' + extraParams;
  return api(url);
}

// se llama cuando cambia el país en el filtro de Destino de una pestaña —
// puebla los desplegables de aeropuerto destino y cliente para ESE país,
// solo dentro del estado de filtros de ESA pestaña ('scope').
async function populateDestinationFilters(scope, paisCode){
  if (!paisCode || paisCode === "Todos") {
    state.tabFilters[scope].airportOptionsForFilter = [];
    return;
  }
  // Si hay una aerolínea elegida en "Destinos <aerolínea>", el desplegable
  // de aeropuerto de destino también se acota a esa aerolínea (mismo
  // criterio que loadDetailContent/loadClients). 16 sep: antes esto solo
  // corría en Reporte de ventas porque era la única pestaña con ese filtro;
  // ahora que Vista Global y Comparativo también lo tienen (y las 4
  // pestañas comparten el MISMO tabFilters.aerolineaDestino, ver
  // makeTabFilters) aplica sin importar desde qué pestaña se abrió el
  // desplegable de país/aeropuerto de Destino.
  const rf = state.tabFilters.reporte;
  const extraParams = (rf.aerolineaDestino !== 'Todos')
    ? new URLSearchParams({ aerolinea_destino: rf.aerolineaDestino }).toString()
    : undefined;
  state.tabFilters[scope].airportOptionsForFilter = await loadAirports(paisCode, extraParams);
}

// (/api/client-view/routes, ya usado por Follow-up "By client"), la de
// mayor tonelaje de mercado que va al país indicado — se usa para
// prellenar el aeropuerto de ORIGEN y describir la ruta específica
// (origen → destino, toneladas, share) en el texto de una tarea nueva, en
// vez de un texto genérico "a nivel país" que no alcanza para medir el
// impacto real después. Devuelve null si no hay ninguna ruta real para
// ese cliente+país (cliente nuevo, nombre no calza con el mercado, falla
// la red, etc.) — quien llama se queda con su texto genérico de respaldo
// en ese caso, nunca se rompe la asignación de la tarea por esto.
// activo en el Reporte de ventas, la ruta que se usa para autocompletar el
// origen de la tarea tiene que salir de ESE origen — antes tomaba la ruta
// de mayor tonelaje hacia el país sin importar desde dónde salía (por eso
// aparecía "BOG" con Chile seleccionado como origen).
// que no llega hasta el año actual) el período global activo (por defecto
// YTD del año en curso) puede no tener NINGÚN dato para el cliente — antes
// eso dejaba el origen de la tarea nueva en blanco (un "?" en el modal),
// aunque la ruta real SÍ existe en el histórico completo de esa fuente.
// Ahora, si la búsqueda respetando el período activo no encuentra nada, se
// reintenta sin restricción de período (todo el histórico) — así al menos
// se completa el aeropuerto de origen correcto; el resultado queda
// marcado con _allTime para que quien lo use (ver periodLabelForMatch)
// no diga "YTD" sobre números que en realidad son de todo el histórico.
async function findTopRouteForClient(cliente, paisName){
  const f = state.tabFilters.reporte;
  const buildParams = (conPeriodo) => {
    const p = conPeriodo ? periodParams() : new URLSearchParams();
    p.set('cliente', cliente);
    if (f.origenPais !== "Todos") p.set('origen_pais', f.origenPais);
    if (origenAeropuertoParam('reporte')) p.set('origen_aeropuerto', origenAeropuertoParam('reporte'));
    return p;
  };
  const buscar = async (conPeriodo) => {
    const rutas = await api('/api/client-view/routes?' + buildParams(conPeriodo).toString());
    return (rutas || []).find(r => (r.destino_pais || '').trim().toLowerCase() === (paisName || '').trim().toLowerCase()) || null;
  };
  try {
    const found = await buscar(true);
    if (found) return found;
  } catch (e) { /* sigue al respaldo de abajo */ }
  try {
    const foundAllTime = await buscar(false);
    return foundAllTime ? Object.assign({}, foundAllTime, { _allTime: true }) : null;
  } catch (e) {
    return null;
  }
}
// Etiqueta de período a mostrar junto a una ruta encontrada por
// findTopRouteForClient — si vino del respaldo sin período (ver arriba),
// aclara que las toneladas/MS% son de todo el histórico, no del período
// activo, para no mostrar un dato que parece de "YTD" y en realidad no lo es.
function periodLabelForMatch(match){
  return (match && match._allTime) ? `All-time (no ${compactPeriodLabel()} data)` : compactPeriodLabel();
}
function routeTaskText(prefix, cliente, match, fallbackPaisName){
  return `${prefix}: ${cliente} — route ${match.origen_code || '?'} → ${match.destino_code || '?'} (${match.destino_pais || fallbackPaisName}) — market ${fmtNum(match.ton_mercado,1)}t vs own ${fmtNum(match.ton_propias,1)}t (share ${fmtPct(match.market_share_pct)})`;
}

// cuando apretas DETAIL deberia mostarte en grande el periodo que tengo
// secleccionado afuera... si yo estoy viendo YTD y me meto al detalle me
// deberia mostarr arriba en grande los YTD y despues el detalle por mes"
// — antes el modal mostraba SIEMPRE el último mes disponible en los KPIs
// grandes de arriba, sin importar qué período estuviera elegido afuera
// (YTD, últimos 3 meses, un mes específico, rango custom). Ahora ambos
// pedidos (/api/trend y el nuevo /api/summary con 'cliente') llevan los
// mismos parámetros de período que ya usa el Reporte de ventas
// (periodParams(), la misma función que usa refreshReportData) — así el
// detalle por mes de abajo queda acotado al mismo período, y los KPIs de
// arriba muestran el TOTAL agregado de ese período, no el último mes.
async function openClientModal(paisCode, paisName, cliente){
  state.clientModalOpen = true;
  state.clientModalLoading = true;
  state.clientModalData = null;
  state.clientModalSortAsc = true;
  renderClientModal();
  try {
    const p = ytdParams(); 
    p.set('pais', paisCode); p.set('cliente', cliente);
    // Studio y una query SQL directa, que el "Detail" de un cliente traía
    // MUCHO más CX Ton/market share de lo que había en la base para esa
    // ruta puntual — DHL Global Forwarding, origen NLU, destino China:
    // 25.5 CX Ton / 26.51% share en el modal vs. 0.758 CX Ton / 1.36% en
    // la base filtrada a NLU): el encabezado del modal SÍ muestra el
    // origen activo ("Origin All · NLU"), pero el pedido a /api/trend y
    // /api/summary de acá abajo nunca lo mandaba — traía TODOS los
    // orígenes mezclados para ese cliente/país, no solo el aeropuerto de
    // origen filtrado en la pantalla de Reporte de ventas. Mismo patrón
    // que ya usa refreshReportData() (scope 'reporte') para armar estos
    // dos parámetros.
    const fOrig = state.tabFilters.reporte;
    if (fOrig.origenPais !== "Todos") p.set('origen_pais', fOrig.origenPais);
    if (origenAeropuertoParam('reporte')) p.set('origen_aeropuerto', origenAeropuertoParam('reporte'));
    const [trend, periodSummary] = await Promise.all([
      api('/api/trend?' + p.toString()),
      api('/api/summary?' + p.toString()),
    ]);
    const last = trend[trend.length - 1] || {};
    state.clientModalData = { paisCode, paisName, cliente, trend, last, periodSummary };
  } catch (e) {
    state.clientModalData = { paisCode, paisName, cliente, trend: [], last: {}, error: e.message };
  } finally {
    state.clientModalLoading = false;
    renderClientModal();
  }
}
