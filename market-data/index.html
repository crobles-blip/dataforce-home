function renderCumplimiento(){
  if (!isCompliance()) return `<div class="empty">You don't have access to this section.</div>`;
  // asignarles reglas de oportunidad" — el <select> de "New compliance
  // rule" (más abajo) leía de state.airlineViewOptions, que es la lista del
  // selector "view as this airline" del encabezado (solo se llena cuando
  // la fuente activa mezcla varias aerolíneas Y el usuario no tiene una
  // aerolínea propia asignada — casi siempre vacía). La lista correcta ya
  // se estaba pidiendo bien (loadComplianceData(), ver el comentario junto
  // a state.tab === 'cumplimiento' en boot/setTab) y quedaba guardada en
  // state.airlines — solo que el <select> nunca la leía de ahí.
  const rows = state.complianceStatus || [];
  const vendedores = (state.users || []).filter(u => u.rol === 'vendedor');
  const gaps = rows.filter(r => !r.cumple);
  return `
  <div class="panel">
    <div class="panel-head" style="display:flex;align-items:center;justify-content:space-between;">
      <span>Compliance status by route</span>
      <span style="text-transform:none;font-weight:400;font-size:11px;color:var(--muted);">${gaps.length} route${gaps.length===1?'':'s'} below target</span>
    </div>
    <div class="panel-body responsive-table-wrap">
      ${rows.length === 0 ? `<div class="empty" style="padding:16px;">No compliance rules defined yet — add one below.</div>` : `
      <table class="users-table">
        <thead><tr>
          <th style="text-align:left;">Airline</th><th style="text-align:left;">Origin</th><th style="text-align:left;">Destination</th>
          <th style="text-align:right;">Target %</th><th style="text-align:right;">Actual %</th><th style="text-align:right;">Gap</th><th style="text-align:left;">Status</th><th></th>
        </tr></thead>
        <tbody>
          ${rows.map(r => `
            <tr>
              <td style="text-align:left;padding:8px 12px;">${esc(r.cliente)}</td>
              <td style="text-align:left;padding:8px 12px;">${esc(r.origen || 'All')}</td>
              <td style="text-align:left;padding:8px 12px;">${esc(r.destino_pais)}</td>
              <td class="num" style="padding:8px 12px;">${fmtPct(r.objetivo_pct)}</td>
              <td class="num" style="padding:8px 12px;">${r.sin_datos ? '—' : fmtPct(r.actual_pct)}</td>
              <td class="num" style="padding:8px 12px;${r.cumple?'':'color:var(--coral);font-weight:600;'}">${r.sin_datos ? '—' : (r.gap_pct>0?'-':'+')+fmtPct(Math.abs(r.gap_pct))}</td>
              <td style="text-align:left;padding:8px 12px;">
                <span class="chip" style="background:${r.sin_datos?'var(--muted)':r.cumple?'var(--teal)':'var(--coral)'};">${r.sin_datos?'No data':r.cumple?'On target':'Opportunity'}</span>
              </td>
              <td style="padding:8px 12px;">
                <div style="display:flex;gap:6px;">
                  ${!r.cumple && !r.sin_datos && canAssignTasks() ? `<button class="btn" data-assign-compliance="${r.id}">+ Add task</button>` : ''}
                  <button class="btn btn-danger" data-remove-compliance-rule="${r.id}">Delete</button>
                </div>
              </td>
            </tr>
          `).join('')}
        </tbody>
      </table>`}
    </div>
  </div>

  <div class="grid2" style="grid-template-columns:1fr 1fr;margin-top:16px;">
    <div class="panel">
      <div class="panel-head">New compliance rule</div>
      <div style="padding:16px;">
        <div class="form-group"><label class="form-label">Airline</label>
          <select id="crCliente" class="form-select">
            <option value="">Choose airline…</option>
            ${(state.airlines || []).map(a => `<option value="${esc(a.nombre)}" ${state.newComplianceRule.cliente===a.nombre?'selected':''}>${esc(a.nombre)}</option>`).join('')}
          </select>
          <div class="hint">This is the airline whose Market Share % on the route is measured — not the forwarder client.</div>
        </div>
        <div class="form-group"><label class="form-label">Origin (flight/airport, optional)</label><input id="crOrigen" class="form-input" placeholder="E.g.: MEX (empty = any origin)" value="${esc(state.newComplianceRule.origen)}"></div>
        <div class="form-group"><label class="form-label">Destination country</label><input id="crDestino" class="form-input" placeholder="E.g.: Hong Kong" value="${esc(state.newComplianceRule.destino_pais)}"></div>
        <div class="form-group"><label class="form-label">Target market share %</label><input id="crObjetivo" type="number" min="0" max="100" step="0.1" class="form-input" placeholder="E.g.: 80" value="${esc(state.newComplianceRule.objetivo_pct)}"></div>
        <button class="btn btn-primary" id="addComplianceRuleBtn">+ Add rule</button>
        <div class="hint">Target % is compared against Market Share % on that exact origin → destination route. Any client below target shows up here as an opportunity.</div>
      </div>
    </div>

    ${(isAdmin() || isCeo()) ? `
    <div class="panel">
      <div class="panel-head">Grant Compliance access</div>
      <div style="padding:16px;">
        <div class="hint" style="margin-bottom:10px;">By default only admins and the CEO see this tab. Turn this on for a specific sales rep if they need to manage compliance rules too.</div>
        ${vendedores.length === 0 ? `<div class="empty">No sales reps yet.</div>` : vendedores.map(v => `
          <div style="display:flex;align-items:center;justify-content:space-between;padding:7px 0;border-top:1px solid var(--line);">
            <span style="font-size:13px;">${esc(v.nombre)}</span>
            <label style="display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);cursor:pointer;">
              <input type="checkbox" data-compliance-access="${v.id}" ${v.puede_gestionar_cumplimiento ? 'checked' : ''}> allowed
            </label>
          </div>
        `).join('')}
      </div>
    </div>` : ''}
  </div>`;
}

function accessSummary(aerolineasPermitidas, fuentesPermitidas){
  // permisos por cliente(=aerolínea)/BD para la fila de la tabla — el
  // detalle completo se marca en el modal "Manage access", acá alcanza con
  // un vistazo rápido. Ya no hay continente ni un desplegable de una sola
  // aerolínea — solo estas dos dimensiones.
  const a = (aerolineasPermitidas || []).length;
  const f = (fuentesPermitidas || []).length;
  if (!a && !f) return 'All clients · All databases';
  const aTxt = a ? `${a} client${a===1?'':'s'}` : 'All clients';
  const fTxt = f ? `${f} database${f===1?'':'s'}` : 'All databases';
  return `${aTxt} · ${fTxt}`;
}

// pestaña admin "Airline Destinations" (pedido de Sharon, 16 sep):
// una columna por aerolínea (las 6 de siempre, mismas que "Destinos
// <aerolínea>" en Sales Report/Global View/Client View — ver
// aerolineasDestinoOptions), cada una con su propio buscador para agregar
// un aeropuerto nuevo y la lista actual (agrupada continente -> país) con
// un botón "×" para quitarlo. Los cambios se guardan en MySQL (ver
// tasks_db.py / data_helpers.py) y quedan visibles de inmediato en el
// filtro "Destinos <aerolínea>" de las demás pestañas.
function renderDestinosAerolinea(){
  if (!isAdmin()) return `<div class="empty">Only an admin can view this section.</div>`;
  const opciones = state.aerolineasDestinoOptions || [];
  return `
  <div class="panel">
    <div class="panel-head">Airline Destinations</div>
    <div class="panel-body" style="padding:16px;">
      <div class="hint" style="margin-bottom:14px;">These are the destinations behind the "Destinations &lt;airline&gt;" filter in Sales Report, Global View and ${esc(LBL_CLIENT)} View. Search to add an airport, or remove one with the × button — changes apply right away.</div>
      ${!opciones.length ? `<div class="loading">${state.destinosAerolineaLoading ? 'Loading…' : 'No airlines available.'}</div>` : `
      <div class="destino-aerolinea-grid">
        ${opciones.map(a => renderDestinosAerolineaColumn(a)).join('')}
      </div>`}
    </div>
  </div>`;
}

function renderDestinosAerolineaColumn(a){
  const code = a.code;
  const info = state.destinosAerolineaData[code];
  const q = state.destinosAerolineaSearch[code] || "";
  const results = state.destinosAerolineaSearchResults[code] || [];
  const busy = !!state.destinosAerolineaBusy[code];
  const total = info ? info.grupos.reduce((s, c) => s + c.paises.reduce((s2, p) => s2 + p.aeropuertos.length, 0), 0) : 0;
  return `
  <div class="destino-aerolinea-col">
    <div class="destino-aerolinea-col-head">${esc(a.label)} <span class="hint">(${total})</span></div>
    <div class="destino-aerolinea-search">
      <input type="text" class="form-input" placeholder="Add airport (code, city, country)…" data-destino-search="${esc(code)}" value="${esc(q)}" style="font-size:11.5px;padding:5px 8px;" ${busy ? 'disabled' : ''}>
      ${q ? `
        <div class="destino-aerolinea-search-results">
          ${results.length ? results.map(r => `
            <div class="destino-aerolinea-search-item">
              <span>${esc(r.codigo)} — ${esc(r.nombre)} <span class="hint">(${esc(r.pais)})</span></span>
              <button class="btn btn-sm" data-destino-add="${esc(code)}|${esc(r.codigo)}" ${busy ? 'disabled' : ''}>+ Add</button>
            </div>
          `).join('') : `<div class="hint" style="padding:6px 8px;">No matching airports.</div>`}
        </div>` : ''}
    </div>
    <div class="destino-aerolinea-list">
      ${!info ? `<div class="hint">Loading…</div>` :
        !info.grupos.length ? `<div class="hint">No destinations yet.</div>` :
        info.grupos.map(cont => `
          <div class="destino-aerolinea-continente">${esc(cont.continente)}</div>
          ${cont.paises.map(p => `
            <div class="destino-aerolinea-pais">${esc(p.pais)}</div>
            ${p.aeropuertos.map(ap => `
              <div class="destino-aerolinea-item">
                <span>${esc(ap.codigo)} <span class="hint">${esc(ap.nombre)}</span></span>
                <button class="destino-aerolinea-remove" data-destino-remove="${esc(code)}|${esc(ap.codigo)}" ${busy ? 'disabled' : ''} title="Remove destination">&times;</button>
              </div>
            `).join('')}
          `).join('')}
        `).join('')}
    </div>
  </div>`;
}

function openUserAccessModal(userId){
  const u = state.users.find(x => String(x.id) === String(userId));
  if (!u) return;
  state.userAccessModalUserId = userId;
  state.userAccessDraft = {
    rol: u.rol,
    aerolineas_permitidas: (u.aerolineas_permitidas || []).slice(),
    fuentes_permitidas: (u.fuentes_permitidas || []).slice(),
    vendedores_supervisados: (u.vendedores_supervisados || []).slice(),
  };
  state.userAccessAirlineFilter = "";
  renderUserAccessModal();
}
function closeUserAccessModal(){
  state.userAccessModalUserId = null;
  state.userAccessDraft = null;
  renderUserAccessModal();
}
function reRenderUserAccessModalPreservingFocus(){
  const active = document.activeElement;
  const id = active && active.id;
  const selStart = active && typeof active.selectionStart === "number" ? active.selectionStart : null;
  renderUserAccessModal();
  if (id) { const el = document.getElementById(id); if (el) { el.focus(); if (selStart !== null) { try { el.setSelectionRange(selStart, selStart); } catch(e){} } } }
}

                  </label>`).join('') : `<div class="hint">No matches.</div>`}
              </div>
              <div class="hint" style="margin-top:4px;">${d.aerolineas_permitidas.length ? d.aerolineas_permitidas.length + ' selected' : 'All clients (no restriction)'}</div>
            </div>
          </div>

          <button class="btn btn-primary" id="userAccessSaveBtn" style="margin-top:16px;">Save access</button>
        </div>
      </div>
    </div>
  `;
  const closeBtn = document.getElementById('userAccessModalCloseBtn');
  if (closeBtn) closeBtn.onclick = closeUserAccessModal;
  const overlay = document.getElementById('userAccessModalOverlay');
  if (overlay) overlay.onclick = (e) => { if (e.target.id === 'userAccessModalOverlay') closeUserAccessModal(); };
  const rolSel = document.getElementById('uaRol');
  // A diferencia de otros campos de este modal, el rol SÍ necesita
  // re-render al cambiar (para mostrar/ocultar el checklist de vendedores
  // supervisados cuando se elige/deselecciona "manager").
  if (rolSel) rolSel.onchange = (e) => { d.rol = e.target.value; reRenderUserAccessModalPreservingFocus(); };
  const filterInput = document.getElementById('uaAirlineFilter');
  if (filterInput) filterInput.oninput = (e) => { state.userAccessAirlineFilter = e.target.value; reRenderUserAccessModalPreservingFocus(); };
  document.querySelectorAll('[data-ua-source]').forEach(cb => cb.onchange = (e) => {
    const id = cb.dataset.uaSource;
    if (e.target.checked) { if (!d.fuentes_permitidas.includes(id)) d.fuentes_permitidas.push(id); }
    else { d.fuentes_permitidas = d.fuentes_permitidas.filter(x => x !== id); }
    reRenderUserAccessModalPreservingFocus();
  });
  document.querySelectorAll('[data-ua-airline]').forEach(cb => cb.onchange = (e) => {
    const a = cb.dataset.uaAirline;
    if (e.target.checked) { if (!d.aerolineas_permitidas.includes(a)) d.aerolineas_permitidas.push(a); }
    else { d.aerolineas_permitidas = d.aerolineas_permitidas.filter(x => x !== a); }
    reRenderUserAccessModalPreservingFocus();
  });
  document.querySelectorAll('[data-ua-vendedor]').forEach(cb => cb.onchange = (e) => {
    const username = cb.dataset.uaVendedor;
    if (e.target.checked) { if (!d.vendedores_supervisados.includes(username)) d.vendedores_supervisados.push(username); }
    else { d.vendedores_supervisados = d.vendedores_supervisados.filter(x => x !== username); }
    reRenderUserAccessModalPreservingFocus();
  });
  const saveBtn = document.getElementById('userAccessSaveBtn');
  if (saveBtn) saveBtn.onclick = saveUserAccess;
}
async function saveUserAccess(){
  const userId = state.userAccessModalUserId;
  const d = state.userAccessDraft;
  if (!userId || !d) return;
  const btn = document.getElementById('userAccessSaveBtn');
  try {
    if (btn) { btn.disabled = true; btn.textContent = 'Saving…'; }
    await updateUserScope(userId, d.rol, d.fuentes_permitidas, d.aerolineas_permitidas, d.vendedores_supervisados);
    closeUserAccessModal();
  } catch (e) {
    alert('Could not save access: ' + e.message);
    if (btn) { btn.disabled = false; btn.textContent = 'Save access'; }
  }
}

function drawChart(){
  const canvas = document.getElementById('trendChart');
  if (canvas) {
    const data = state.trend.map(d => ({ monthKey: d.month, month: monthLabel(d.month), mktTon: d.ton_mercado, ms: d.market_share_pct }));
    if (state.chart) { state.chart.destroy(); state.chart = null; }
    state.chart = new Chart(canvas, {
      data: {
        labels: data.map(d => d.month),
        datasets: [
          { type: 'bar', label: LBL_MKT_TON, data: data.map(d => d.mktTon), backgroundColor: '#C9D6E3', borderColor: '#8FA3B8', borderWidth: 1, yAxisID: 'y', order: 2 },
          { type: 'line', label: LBL_MS, data: data.map(d => d.ms), borderColor: '#8C6218', backgroundColor: '#8C6218', yAxisID: 'y1', tension: 0.25, pointRadius: 3, order: 1 },
        ]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        onClick: (evt, elements) => {
          if (!elements.length) return;
          const idx = elements[0].index;
          const monthKey = data[idx] && data[idx].monthKey;
          if (!monthKey) return;
          state.period = monthKey; // clic en una barra: filtra el reporte a ese mes específico
          refreshReportData().then(renderMain);
        },
        onHover: (evt, elements) => { evt.native.target.style.cursor = elements.length ? 'pointer' : 'default'; },
        scales: {
          y: { position: 'left', beginAtZero: true, ticks: { font: { size: 11 } } },
          y1: { position: 'right', beginAtZero: true, ticks: { font: { size: 11 }, callback: v => v + '%' }, grid: { drawOnChartArea: false } },
          x: { ticks: { font: { size: 10 } }, grid: { display: false } }
        },
        plugins: { legend: { display: state.chartLegendsVisible, labels: { font: { size: 9 }, boxWidth: 8 } } }
      }
    });
  }

  // segundo gráfico: toneladas + las dos tarifas (mercado y propia) juntas
  // — antes el CX Rate vivía mezclado en el gráfico de arriba con la MS%,
  // pedido: separarlo en su propio gráfico, igual al de "Vista por cliente".
  const rateCanvas = document.getElementById('trendRateChart');
  if (rateCanvas) {
    const rdata = state.trend.map(d => ({ month: monthLabel(d.month), mktTon: d.ton_mercado, mktRate: d.tarifa_mercado, cxRate: d.tarifa_propia }));
    if (state.rateChart) { state.rateChart.destroy(); state.rateChart = null; }
    state.rateChart = new Chart(rateCanvas, {
      data: {
        labels: rdata.map(d => d.month),
        datasets: [
          { type: 'bar', label: LBL_MKT_TON, data: rdata.map(d => d.mktTon), backgroundColor: '#C9D6E3', borderColor: '#8FA3B8', borderWidth: 1, yAxisID: 'y', order: 3 },
          { type: 'line', label: LBL_MKT_RATE, data: rdata.map(d => d.mktRate), borderColor: '#0A4E8C', backgroundColor: '#0A4E8C', yAxisID: 'y1', tension: 0.25, pointRadius: 3, order: 2 },
          { type: 'line', label: LBL_CX_RATE, data: rdata.map(d => d.cxRate), borderColor: OWN_BRAND.main, backgroundColor: OWN_BRAND.main, yAxisID: 'y1', tension: 0.25, pointRadius: 3, borderDash: [4,2], order: 1 },
        ]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        scales: {
          y: { position: 'left', beginAtZero: true, ticks: { font: { size: 11 } } },
          y1: { position: 'right', beginAtZero: true, ticks: { font: { size: 11 }, callback: v => '$'+v }, grid: { drawOnChartArea: false } },
          x: { ticks: { font: { size: 10 } }, grid: { display: false } }
        },
        plugins: { legend: { display: state.chartLegendsVisible, labels: { font: { size: 9 }, boxWidth: 8 } } }
      }
    });
  }

  // velocímetro de market share + dona de continentes (dan una lectura
  // visual inmediata, sin tener que leer texto ni tablas)
  //
  // arriba no deberian volver a cargar" — drawChart() se llama en CADA
  // renderMain() de Sales Report (expandir un país, asignar una tarea,
  // cambiar el estado de una tarea, etc.), y como el <canvas> se recrea
  // de cero cada vez (todo #main se reemplaza), estos 3 gráficos SIEMPRE
  // se instancian de nuevo — Chart.js anima la entrada desde cero en cada
  // instancia nueva, así que se veían "recargar"/parpadear aunque los
  // números fueran idénticos a los de un segundo antes. Estos 3 dependen
  // solo de state.summary/state.countries, que NO cambian por esas
  // acciones — solo cambian cuando refreshReportData() trae datos
  // realmente nuevos (filtro de Origen/Destino/período/continente). Se
  // compara la versión actual contra la última vez que se dibujaron: si
  // no cambió, se instancian sin animación (pintan los mismos números al
  // toque, sin el efecto de "crecer desde cero"); si sí cambió, se anima
  // normal como siempre.
  const summaryUnchanged = state._lastDrawnSummaryVersion === state.reporteSummaryVersion;
  state._lastDrawnSummaryVersion = state.reporteSummaryVersion;
  if (state.gaugeInst) { state.gaugeInst.destroy(); state.gaugeInst = null; }
  if (state.continentDonutInst) { state.continentDonutInst.destroy(); state.continentDonutInst = null; }
  const s = state.summary || {};
  state.gaugeInst = drawGauge('gaugeChart', s.market_share_pct || 0, 'own share', summaryUnchanged);

  const byContinent = new Map();
  state.countries.forEach(r => {
    if (!byContinent.has(r.Des_Continent)) byContinent.set(r.Des_Continent, { Des_Continent: r.Des_Continent, mkt_w: 0, cust_c: 0, mkt_c: 0 });
    const a = byContinent.get(r.Des_Continent);
    a.mkt_w += r.mkt_w; a.cust_c += r.cust_c; a.mkt_c += r.mkt_c;
  });
  const contRows = Array.from(byContinent.values());
  const contSorted = contRows.slice().sort((a,b) => b.mkt_w - a.mkt_w).slice(0, 8);
  state.continentDonutInst = drawDonut('continentDonut', contRows, 'mkt_w', 'Des_Continent', fmtTon(s.ton_mercado ? s.ton_mercado*1000 : 0, 0), LBL_MKT_TON, false, summaryUnchanged);
  if (state.continentDonutInst && !lockedContinente()) {
    state.continentDonutInst.options.onClick = (evt, elements) => {
      if (!elements.length) return;
      const idx = elements[0].index;
      const cont = contSorted[idx] && contSorted[idx].Des_Continent;
      if (!cont) return;
      const rf = state.tabFilters.reporte;
      // clic en una porción de la dona = drill-down a ESE continente
      // (reemplaza cualquier selección múltiple que hubiera antes, no la
      // suma) — mismo criterio que ya tenía esto antes del multi-select.
      rf.continentes = [cont]; rf.paises = []; rf.destAeropuerto = []; rf.airportOptionsForFilter = [];
      Promise.all([refreshReportData(), loadAlerts()]).then(renderMain);
    };
    state.continentDonutInst.options.onHover = (evt, elements) => { evt.native.target.style.cursor = elements.length ? 'pointer' : 'default'; };
    state.continentDonutInst.update();
  }

  // revenue de mercado por continente, dentro del filtro actual
  if (state.topClientsChartInst) { state.topClientsChartInst.destroy(); state.topClientsChartInst = null; }
  const revTotal = contRows.reduce((sum, c) => sum + c.mkt_c, 0);
  state.topClientsChartInst = drawDonut('topClientsChart', contRows, 'mkt_c', 'Des_Continent', '$' + fmtBig(revTotal), LBL_MKT_REV, true, summaryUnchanged);
}
const centerTextPlugin = {
  id: 'centerText',
  afterDraw(chart){
    const opts = chart.config.options.plugins.centerText;
    if (!opts) return;
    const { ctx, chartArea: { left, right, top, bottom } } = chart;
    const cx = (left + right) / 2;
    const cy = opts.gauge ? bottom - 6 : (top + bottom) / 2;
    const innerWidth = (right - left) * 0.55; // ancho útil dentro del agujero de la dona
    ctx.save();
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = opts.color || 'var(--ink)';
    // el tamaño de letra se achica solo si el número es muy largo, para
    // que nunca se salga del círculo (sin tener que abreviarlo con "M")
    let fontSize = 20;
    ctx.font = `700 ${fontSize}px ui-sans-serif, system-ui, sans-serif`;
    while (ctx.measureText(String(opts.value)).width > innerWidth && fontSize > 10) {
      fontSize -= 2;
      ctx.font = `700 ${fontSize}px ui-sans-serif, system-ui, sans-serif`;
    }
    ctx.fillText(opts.value, cx, cy - (opts.gauge ? 22 : 8));
    ctx.fillStyle = '#64748B';
    ctx.font = '600 10px ui-sans-serif, system-ui, sans-serif';
    ctx.fillText(opts.label, cx, cy - (opts.gauge ? 4 : -12));
    ctx.restore();
  }
};

function drawGauge(canvasId, pct, label, noAnimation){
  const canvas = document.getElementById(canvasId);
  if (!canvas) return null;
  const clamped = Math.max(0, Math.min(100, pct));
  const color = clamped >= 20 ? '#1E7F72' : clamped >= 8 ? '#8C6218' : '#C4553B';
  return new Chart(canvas, {
    type: 'doughnut',
    data: { datasets: [{ data: [clamped, 100 - clamped], backgroundColor: [color, '#E4E1D8'], borderWidth: 0 }] },
    options: {
      responsive: true, maintainAspectRatio: false,
      rotation: -90, circumference: 180, cutout: '75%',
      // (la animación de entrada de Chart.js, que barre desde 0 cada vez que
      // se crea una instancia nueva) cuando los datos que muestra no
      // cambiaron — ver drawChart() y el comentario junto a
      // state.reporteSummaryVersion.
      animation: noAnimation ? false : undefined,
      plugins: { legend: { display: false }, tooltip: { enabled: false }, centerText: { value: fmtPct(clamped), label, gauge: true, color } }
    },
    plugins: [centerTextPlugin]
  });
}

function drawDonut(canvasId, rows, valueKey, labelKey, centerValue, centerLabel, isCurrency, noAnimation){
  const canvas = document.getElementById(canvasId);
  if (!canvas) return null;
  const PALETTE = ['#003B71','#0A4E8C','#1E7F72','#7DAED3','#8C6218','#C4553B','#5C2A8C','#3B90C7'];
  const sorted = rows.slice().sort((a,b) => b[valueKey] - a[valueKey]).slice(0, 8);
  return new Chart(canvas, {
    type: 'doughnut',
    data: {
      labels: sorted.map(r => r[labelKey]),
      datasets: [{ data: sorted.map(r => r[valueKey]), backgroundColor: sorted.map((_,i) => PALETTE[i % PALETTE.length]), borderColor: '#fff', borderWidth: 2 }]
    },
    options: {
      responsive: true, maintainAspectRatio: false, cutout: '62%',
      // ver comentario en drawGauge de arriba — mismo criterio acá.
      animation: noAnimation ? false : undefined,
      // leyenda a la izquierda (en vez de abajo) para que la dona no tenga
      // que competir por alto con una fila de textos — así el círculo (y el
      // número grande al centro) puede verse más grande dentro del mismo
      // espacio de la tarjeta.
      plugins: {
        legend: { display: state.chartLegendsVisible, position: 'left', align: 'center', labels: { font: { size: 9 }, boxWidth: 8, padding: 6 } },
        // 'valueKey' siempre trae kilos crudos (o dólares si isCurrency) —
        // antes se le pasaba raw*1000 a fmtTon() por error, mostrando el
        // tooltip 1000 veces más grande de lo real.
        tooltip: { callbacks: { label: (ctx) => ctx.label + ': ' + (isCurrency ? '$' + fmtNum(ctx.raw, 0) : fmtTon(ctx.raw)) } },
        centerText: { value: centerValue, label: centerLabel }
      }
    },
    plugins: [centerTextPlugin]
  });
}

function reRenderPreservingFocus(){
  const active = document.activeElement;
  const id = active && active.id;
  const selStart = active && typeof active.selectionStart === "number" ? active.selectionStart : null;
  renderMain();
  if (id) { const el = document.getElementById(id); if (el) { el.focus(); if (selStart !== null) { try { el.setSelectionRange(selStart, selStart); } catch(e){} } } }
}

async function loadDetailContent(code, name){
  const myRequestId = ++state.detailWrapRequestSeq;
  const wrap = document.getElementById('detailWrap-' + code);
  if (!wrap) return;
  wrap.innerHTML = `<div class="loading">Loading…</div>`;
  // recargar el detalle de un país (nuevo país, cambió el filtro, cambió
  // Clients/Airports, etc.) siempre parte de cero: cualquier aeropuerto o
  // cliente que hubiera quedado expandido pertenece a datos viejos.
  state.expandedAirport = null;
  state.expandedClient = null;
  let html;
  try {
    if (state.detailLevel === 'cliente') {
      const clients = await loadClients(code);
      // si mientras esperábamos la respuesta el usuario ya cambió el filtro
      // de nuevo (otro clic en el checkbox de aeropuerto, por ejemplo), esta
      // respuesta quedó vieja y NO se pinta — así nunca pisa a una más
      // reciente ni escribe sobre un pedazo de pantalla que ya no existe.
      // Esto era justo lo que se sentía como "queda pegado cargando".
      if (myRequestId !== state.detailWrapRequestSeq) return;
      state.reportClientsCache = { code, clients };
      html = renderClientsListHtml(code, name);
    } else {
      const f = state.tabFilters.reporte;
      const p = periodParams();
      if (f.origenPais !== "Todos") p.set('origen_pais', f.origenPais);
      if (origenAeropuertoParam('reporte')) p.set('origen_aeropuerto', origenAeropuertoParam('reporte'));
      if (f.aerolineaDestino !== "Todos") p.set('aerolinea_destino', f.aerolineaDestino);
      const airports = await loadAirports(code, p.toString());
      if (myRequestId !== state.detailWrapRequestSeq) return;
      state.reportAirportsCache = { code, airports };
      html = renderAirportsListHtml(code, name);
    }
  } catch (e) {
    // "Loading…" para siempre cuando el pedido al servidor fallaba (se
    // cortaba por timeout, la fuente recién se estaba leyendo por primera
    // vez desde MySQL en vivo, etc.) — antes la excepción de loadClients()/
    // loadAirports() no se atrapaba en ningún lado, así que el código que
    // reemplaza el "Loading…" por el contenido real nunca se llegaba a
    // ejecutar. Ahora se muestra el error real con un botón para
    // reintentar, igual que ya pasa en el resto del reporte.
    if (myRequestId !== state.detailWrapRequestSeq) return;
    const errWrap = document.getElementById('detailWrap-' + code);
    if (!errWrap) return;
    errWrap.innerHTML = `<div class="error-banner" style="display:flex;align-items:center;justify-content:space-between;gap:12px;">
      <div>Could not load the detail: ${esc(e.message || 'Unknown error')}.</div>
      <button class="btn btn-sm" id="retryDetailWrap-${esc(code)}">Retry</button>
    </div>`;
    const retryBtn = document.getElementById('retryDetailWrap-' + code);
    if (retryBtn) retryBtn.onclick = () => loadDetailContent(code, name);
    return;
  }
  // buscar el wrap DE NUEVO por si renderMain() lo reemplazó mientras
  // esperábamos — nunca escribir sobre una referencia que puede estar
  // desconectada del DOM visible.
  const freshWrap = document.getElementById('detailWrap-' + code);
  if (!freshWrap) return;
  freshWrap.innerHTML = html;
  wireDetailWrapEvents(freshWrap, code, name);
}

    // mismo fix que loadClients(): respetar Origen/período activos, no solo

function wireDetailWrapEvents(wrap, code, name){
  // clic en la fila del cliente: solo actualiza el gráfico de tendencia
  // (esto es lo que le gustó al equipo — verlo cambiar en vivo)
  wrap.querySelectorAll('[data-select-client]').forEach(el => el.onclick = (e) => {
    if (e.target.closest('[data-open-detail-client],[data-quick-add-task-client]')) return; // esos botones manejan su propio click
    selectTrendClient(el.dataset.paisCode, el.dataset.paisName, el.dataset.selectClient);
  });
  // botón "Detail": abre el modal completo, sin necesidad de adivinar haciendo clic en la fila
  wrap.querySelectorAll('[data-open-detail-client]').forEach(btn => btn.onclick = (e) => {
    e.stopPropagation();
    openClientModal(btn.dataset.paisCode, btn.dataset.paisName, btn.dataset.openDetailClient);
  });
  // prellenado para este cliente, sin pasar por el modal de Detail. Pasa
  // también el código de país y, si la fila es de un aeropuerto puntual
  // (dentro de "Clients at {airport}" o "Airports used by {client}"), ese
  // aeropuerto — así openAddTaskModalFor arma el destino en el nivel
  wrap.querySelectorAll('[data-quick-add-task-client]').forEach(btn => btn.onclick = async (e) => {
    e.stopPropagation();
    await openAddTaskModalFor(btn.dataset.quickAddTaskClient, btn.dataset.paisName, btn.dataset.paisCode, btn.dataset.airportCode || '', btn.dataset.airportCity || '');
  });
  // clic en la fila del cliente (vista "Clients", nivel país): igual que un
  // aeropuerto, actualiza el gráfico de tendencia Y abre/cierra la lista de
  // sigue abriendo el modal completo sin pasar por el expandir/colapsar.
  wrap.querySelectorAll('[data-toggle-client]').forEach(el => el.onclick = (e) => {
    if (e.target.closest('[data-open-detail-client],[data-quick-add-task-client]')) return; // esos botones manejan su propio click
    const clienteNombre = el.dataset.toggleClient;
    const countryCode = el.dataset.paisCode, countryName = el.dataset.paisName;
    selectTrendClient(countryCode, countryName, clienteNombre);
    toggleClientExpand(countryCode, countryName, clienteNombre);
  });
  // clic en la fila del aeropuerto (vista "Airports"): igual que un país,
  // actualiza el gráfico de tendencia Y abre/cierra el detalle de clientes
  // abriendo el modal completo sin pasar por el expandir/colapsar.
  wrap.querySelectorAll('[data-toggle-airport]').forEach(el => el.onclick = (e) => {
    if (e.target.closest('[data-open-detail-airport]')) return; // el botón Detail maneja su propio click
    const airportCode = el.dataset.toggleAirport, airportCity = el.dataset.airportCity;
    const countryCode = el.dataset.paisCode, countryName = el.dataset.paisName;
    selectTrendAirport(airportCode, airportCity);
    toggleAirportExpand(countryCode, countryName, airportCode, airportCity);
  });
  wrap.querySelectorAll('[data-open-detail-airport]').forEach(btn => btn.onclick = (e) => {
    e.stopPropagation();
    openAirportModal(btn.dataset.paisName, btn.dataset.openDetailAirport, btn.dataset.airportCity);
  });
}

// conecta los selects de Origen compartidos (usados en Comparativo y
// Vista por cliente) — 'onDataReload' es la función a llamar tras el cambio.
// filtro con autocompletar (input de texto + <datalist>) para no tener que
// hacer scroll en un <select> larguísimo (ej. la lista de clientes) — se
// puede tipear para buscar y elegir de la lista nativa del navegador. Solo
// dispara la recarga de datos cuando lo tipeado calza EXACTO con una opción
// (se eligió del desplegable, o se tipeó el nombre completo) — mientras se
// escribe un texto parcial no pasa nada, así no se dispara una carga por
// cada letra tipeada.
function wireTypeaheadFilter(inputId, getOptions, matchKey, onMatch, onClear){
  const input = document.getElementById(inputId);
  if (!input) return;
  input.addEventListener('input', async (e) => {
    const val = e.target.value.trim();
    if (!val) { await onClear(); return; }
    const match = getOptions().find(o => matchKey(o).toLowerCase() === val.toLowerCase());
    if (match) await onMatch(match);
  });
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); e.target.blur(); } });
}

function wireOrigenFilterBar(scope, onDataReload){
  const f = state.tabFilters[scope];
  const p = document.getElementById('origenPaisSelectShared');
  if (p) p.onchange = async (e) => {
    f.origenPais = e.target.value;
    f.origenAeropuertos = []; // los aeropuertos elegidos antes pueden no pertenecer al país nuevo
    // reaccionar" — estas dos llamadas son independientes (loadOrigins
    // solo llena el desplegable de aeropuertos, onDataReload ya lee
    // f.origenPais recién asignado arriba), así que antes esperaban una
    // detrás de la otra sin necesidad, sumando sus dos tiempos de ida y
    // vuelta al servidor. En paralelo, el cambio de Origen reacciona en el
    // tiempo del más lento de los dos, no en la suma de ambos.
    await Promise.all([loadOrigins(f.origenPais), onDataReload()]);
    renderMain();
  };
  wireOrigenAeropuertoMultiSelect(scope, 'Shared', onDataReload);
}

// conecta el filtro de Destino compartido (usado en Vista global y
// Comparativo) — misma lógica que la versión de Reporte de ventas, pero
// 'onDataReload' es quien decide qué recargar (loadGlobalData / loadComparativo)
// en vez de estar atado a refreshReportData(). 'scope' determina en qué
// state.tabFilters[scope] se guarda la selección — así cada pestaña que usa
// esta barra mantiene su propio filtro, independiente de las demás.
// Refresca en el DOM, sin pasar por renderMain() (que reconstruiría y
// haría parpadear los gráficos), el botón + panel del multi-select de
// país — usado tanto al reordenar (A-Z / tamaño) como al tildar/destildar
// un país en el panel.
function refreshPaisMultiSelectDom(scope, idSuffix){
  const f = state.tabFilters[scope];
  const opts = countryOptionsForContinente(scope);
  const toggle = document.getElementById('paisMultiToggle' + idSuffix);
  if (toggle) toggle.innerHTML = `${esc(countryMultiSelectLabel(f, opts))} <span style="opacity:.6;">▾</span>`;
  const panel = document.getElementById('paisMultiPanel' + idSuffix);
  if (panel) panel.innerHTML = `
    <label><input type="checkbox" id="paisCbAll${idSuffix}" ${f.paises.length===0?'checked':''}> All countries</label>
    <div class="divider"></div>
    ${opts.map(c => `<label><input type="checkbox" class="pais-cb${idSuffix}" value="${esc(c.code)}" ${f.paises.includes(c.code)?'checked':''}> ${esc(c.name)}</label>`).join('')}`;
}

// Wiring del panel de checkboxes del multi-select de país (abrir/cerrar +
// marcar/desmarcar cada país) — común a las 4 pestañas que tienen este
// filtro (ver comentario junto a makeTabFilters). 'idSuffix' distingue
// los ids en el DOM entre la barra "Shared" (Reporte/Comparativo/Vista
// global — mismo <div> reutilizado por las 3) y la de Vista por cliente
// ("Cliente", que no tiene el sub-filtro de aeropuerto de destino, por
// eso vive aparte de wireDestinoFilterBar más abajo).
function wirePaisCheckboxes(scope, idSuffix, onDataReload){
  const f = state.tabFilters[scope];
  const applyPaisChange = async () => {
    // al cambiar la selección de países, el sub-filtro de aeropuerto de
    // destino (si existe para esta barra) deja de tener sentido salvo
    // que haya quedado EXACTAMENTE un país marcado — mismo criterio que
    // ya se usa para habilitar/deshabilitar ese botón en el render.
    f.destAeropuerto = [];
    if (f.paises.length === 1) { await populateDestinationFilters(scope, f.paises[0]); }
    else { f.airportOptionsForFilter = []; }
    await onDataReload();
    f.paisDropdownOpen = true; // se mantiene abierto mientras se van marcando varios (ej. Asia -> China + Japón)
    renderMain();
  };
  const allCb = document.getElementById('paisCbAll' + idSuffix);
  if (allCb) allCb.onchange = async () => { f.paises = []; await applyPaisChange(); };
  document.querySelectorAll('.pais-cb' + idSuffix).forEach(cb => cb.onchange = async (e) => {
    if (e.target.checked) { if (!f.paises.includes(e.target.value)) f.paises.push(e.target.value); }
    else f.paises = f.paises.filter(p => p !== e.target.value);
    await applyPaisChange();
  });
}
function wirePaisMultiSelect(scope, idSuffix, onDataReload){
  const f = state.tabFilters[scope];
  const toggle = document.getElementById('paisMultiToggle' + idSuffix);
  if (toggle) toggle.onclick = (e) => { e.stopPropagation(); f.paisDropdownOpen = !f.paisDropdownOpen; renderMain(); };
  const panel = document.getElementById('paisMultiPanel' + idSuffix);
  if (panel) panel.onclick = (e) => e.stopPropagation(); // no cerrar el panel al marcar checkboxes
  wirePaisCheckboxes(scope, idSuffix, onDataReload);
}
// Wiring del panel de checkboxes del multi-select de CONTINENTE (pedido de
// wirePaisMultiSelect de arriba, solo que al cambiar el continente también
// se limpia la selección de país (mismo criterio que ya tenía el <select>

function wireContinenteMultiSelect(scope, idSuffix, onDataReload){

// Wiring común del multi-select de continente + multi-select de país, sin

function wireEvents(){
  if (state.tab === 'reporte'){
    const rf = state.tabFilters.reporte;

    // dispara reRenderPreservingFocus(), que reconstruye TODO el HTML del
    // formulario desde state.newUser — como esos 4 campos nunca se habían
    // guardado ahí, volvían a aparecer vacíos aunque ya los hubiera
    // llenado. Mismo patrón que ya usan los checkboxes de abajo: cada
    // campo se guarda en state.newUser al tipear/cambiar, no solo al
    // final, así sobrevive cualquier re-render intermedio.
    const nuNombre = document.getElementById('nuNombre');
    if (nuNombre) nuNombre.oninput = (e) => { state.newUser.nombre = e.target.value; };
    const nuUsername = document.getElementById('nuUsername');
    if (nuUsername) nuUsername.oninput = (e) => { state.newUser.username = e.target.value; };
    const nuPassword = document.getElementById('nuPassword');
    if (nuPassword) nuPassword.oninput = (e) => { state.newUser.password = e.target.value; };
    const nuRol = document.getElementById('nuRol');
    // muestra cuando el rol elegido es "manager" — a diferencia de los
    // otros campos de este formulario, este SÍ necesita re-render al
    // cambiar (para mostrar/ocultar el checklist), no solo guardar en state.
    if (nuRol) nuRol.onchange = (e) => { state.newUser.rol = e.target.value; reRenderPreservingFocus(); };
    const createBtn = document.getElementById('createUserBtn');
    if (createBtn) createBtn.onclick = async () => {
      state.newUser = {
        ...state.newUser, // conserva aerolineas_permitidas/fuentes_permitidas ya marcados en los checklists
        nombre: document.getElementById('nuNombre').value.trim(),
        username: document.getElementById('nuUsername').value.trim(),
        password: document.getElementById('nuPassword').value,
        rol: document.getElementById('nuRol').value,
      };
      // igual se crea el usuario" — el botón no se deshabilitaba durante
      // el pedido, así que un doble clic (fácil de hacer si no se ve
      // ningún cambio en pantalla al instante) mandaba DOS pedidos
      // POST /api/users casi al mismo tiempo con el mismo username: el
      // primero crea el usuario bien (200), el segundo choca contra la
      // restricción de username único de la base y explota sin
      // capturar (500) — aunque el usuario ya haya quedado creado por el
      // primero. Deshabilitar el botón mientras el pedido está en vuelo
      // evita el doble envío de raíz (ver también el try/except nuevo en
      // el backend, post_user en main.py, como segunda barrera).
      if (createBtn.disabled) return;
      createBtn.disabled = true;
      const textoOriginal = createBtn.textContent;
      createBtn.textContent = 'Creating…';
      try {
        await createUser();
      } finally {
        createBtn.disabled = false;
        createBtn.textContent = textoOriginal;
      }
    };
    const nuAirlineFilter = document.getElementById('nuAirlineFilter');
    if (nuAirlineFilter) nuAirlineFilter.oninput = (e) => { state.newUserAirlineFilter = e.target.value; reRenderPreservingFocus(); };
    document.querySelectorAll('[data-nu-airline]').forEach(cb => cb.onchange = (e) => {
      const a = cb.dataset.nuAirline;
      if (e.target.checked) { if (!state.newUser.aerolineas_permitidas.includes(a)) state.newUser.aerolineas_permitidas.push(a); }
      else { state.newUser.aerolineas_permitidas = state.newUser.aerolineas_permitidas.filter(x => x !== a); }
      reRenderPreservingFocus();
    });
    document.querySelectorAll('[data-nu-source]').forEach(cb => cb.onchange = (e) => {
      const id = cb.dataset.nuSource;
      if (e.target.checked) { if (!state.newUser.fuentes_permitidas.includes(id)) state.newUser.fuentes_permitidas.push(id); }
      else { state.newUser.fuentes_permitidas = state.newUser.fuentes_permitidas.filter(x => x !== id); }
      reRenderPreservingFocus();
    });
    document.querySelectorAll('[data-nu-vendedor]').forEach(cb => cb.onchange = (e) => {
      const username = cb.dataset.nuVendedor;
      if (!state.newUser.vendedores_supervisados) state.newUser.vendedores_supervisados = [];
      if (e.target.checked) { if (!state.newUser.vendedores_supervisados.includes(username)) state.newUser.vendedores_supervisados.push(username); }
      else { state.newUser.vendedores_supervisados = state.newUser.vendedores_supervisados.filter(x => x !== username); }
      reRenderPreservingFocus();
    });
    const rowScopeChanged = (userId) => {
      const rolSel = document.querySelector(`[data-user-rol="${userId}"]`);
      // el cliente/BD permitidos ya no se editan desde esta fila (ver botón
      // "Manage access") — se reenvían tal cual estaban para no borrarlos.
      // cambiar SOLO el rol desde este desplegable no debe borrar el equipo
      // ya asignado a un manager (por si vuelve a ese rol después).
      const u = state.users.find(x => String(x.id) === String(userId)) || {};
      updateUserScope(userId, rolSel ? rolSel.value : undefined,
                       u.fuentes_permitidas || [], u.aerolineas_permitidas || [],
                       u.vendedores_supervisados || []);
    };
    document.querySelectorAll('[data-user-rol]').forEach(sel => sel.onchange = () => rowScopeChanged(sel.dataset.userRol));
    document.querySelectorAll('[data-manage-access]').forEach(btn => btn.onclick = () => openUserAccessModal(btn.dataset.manageAccess));
    document.querySelectorAll('[data-remove-user]').forEach(btn => btn.onclick = () => removeUser(btn.dataset.removeUser));
  } else if (state.tab === 'cumplimiento') {
    const addRuleBtn = document.getElementById('addComplianceRuleBtn');
    if (addRuleBtn) addRuleBtn.onclick = addComplianceRule;
    document.querySelectorAll('[data-remove-compliance-rule]').forEach(btn => btn.onclick = () => removeComplianceRule(btn.dataset.removeComplianceRule));
    document.querySelectorAll('[data-assign-compliance]').forEach(btn => btn.onclick = () => {
      const row = state.complianceStatus.find(r => String(r.id) === btn.dataset.assignCompliance);
      if (row) assignFromComplianceGap(row);
    });
    document.querySelectorAll('[data-compliance-access]').forEach(cb => cb.onchange = (e) => {
      toggleComplianceAccess(cb.dataset.complianceAccess, e.target.checked);
    });
  } else if (state.tab === 'destinosAerolinea') {
    document.querySelectorAll('[data-destino-search]').forEach(inp => inp.oninput = (e) => {
      searchDestinosAerolinea(inp.dataset.destinoSearch, e.target.value);
    });
    document.querySelectorAll('[data-destino-add]').forEach(btn => btn.onclick = () => {
      const [code, aeropuerto] = btn.dataset.destinoAdd.split('|');
      setDestinoAerolinea(code, aeropuerto, 'Y');
    });
    document.querySelectorAll('[data-destino-remove]').forEach(btn => btn.onclick = () => {
      const [code, aeropuerto] = btn.dataset.destinoRemove.split('|');
      if (!confirm(`Remove ${aeropuerto} as a destination?`)) return;
      setDestinoAerolinea(code, aeropuerto, 'N');
    });
  }
}

// se registra una sola vez: cierra el desplegable de aeropuertos si el
// clic fue afuera de él. Importante: NO llama a renderMain() completo acá
// —eso competía con otros clics (como abrir el detalle de un país) que
// también estaban a medio cargar datos del backend, y el re-render los
// cortaba a mitad de camino. Solo se quita el panelito del DOM.
document.addEventListener('click', (e) => {
  const f = state.tabFilters[state.tab];
  if (f && f.airportDropdownOpen && !e.target.closest('.multi-select-wrap')) {
    f.airportDropdownOpen = false;
    const panel = document.getElementById('airportMultiPanelShared');
    if (panel) panel.remove();
  }
  // mismo criterio, para el panel del multi-select de país (ver
  // wirePaisMultiSelect) — 'Cliente' es el idSuffix propio de Vista por
  // cliente, que no comparte DOM con la barra "Shared" de las otras 3.
  if (f && f.paisDropdownOpen && !e.target.closest('.multi-select-wrap')) {
    f.paisDropdownOpen = false;
    const panel = document.getElementById('paisMultiPanelShared') || document.getElementById('paisMultiPanelCliente');
    if (panel) panel.remove();
  }
  // mismo criterio, para el panel del multi-select de CONTINENTE (9 sep,
  // ver wireContinenteMultiSelect).
  if (f && f.continenteDropdownOpen && !e.target.closest('.multi-select-wrap')) {
    f.continenteDropdownOpen = false;
    const panel = document.getElementById('continenteMultiPanelShared') || document.getElementById('continenteMultiPanelCliente');
    if (panel) panel.remove();
  }
  // mismo criterio, para el panel del multi-select de AEROPUERTO DE ORIGEN
  // (11 sep, ver wireOrigenAeropuertoMultiSelect) — 'Report' es el idSuffix
  // propio de Reporte de ventas, 'Shared' el de las otras 3 pestañas.
  if (f && f.origenAeropuertoDropdownOpen && !e.target.closest('.multi-select-wrap')) {
    f.origenAeropuertoDropdownOpen = false;
    const panel = document.getElementById('origenAeropuertoMultiPanelShared') || document.getElementById('origenAeropuertoMultiPanelReport');
    if (panel) panel.remove();
  }
});

tryResumeSession();

</script>
</body>
</html>
